.h-gt{position:relative;flex:0 0 calc((100% - 20px) / 3);aspect-ratio:3/4;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--bd);display:block}
.h-gt .ph{position:absolute;inset:0}
.h-gt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.88))}
.h-gt b{position:absolute;z-index:2;left:8px;right:8px;bottom:8px;font-size:13.5px;font-weight:900;color:#fff;line-height:1.2;text-shadow:0 1px 2px #000}
.h-badge{position:absolute;z-index:2;left:6px;top:6px;font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--au-g);color:#1B1206}
.h-badge.hot{background:#E5383B;color:#fff}
.h-gl{position:relative;flex:0 0 calc((100% - 30px) / 4);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--tx)}
.h-gl .ph{position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--bd)}
.h-gl.cur .ph{border-color:var(--au)}
.h-gl span{display:flex;flex-direction:column;align-items:center}
.h-gl b{font-size:13px;font-weight:800}
.h-gl small{font-size:10.5px;color:var(--tx2)}
.h-drama{display:flex;gap:12px;padding:10px}
.h-dr-img{position:relative;flex:0 0 96px;aspect-ratio:3/4;border-radius:var(--r-s);overflow:hidden}
.h-dr-img .ph{position:absolute;inset:0}
.h-dr-t{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:2px 0}
.h-dr-t em{font-style:normal;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:rgba(233,196,106,.14);color:var(--au)}
.h-dr-t b{font-size:16px;font-weight:800}
.h-dr-t small{font-size:12px;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h-dr-t u{margin-top:auto;display:inline-flex;align-items:center;gap:2px;text-decoration:none;font-size:12px;font-weight:800;padding:6px 10px 6px 12px;border-radius:8px;background:var(--au-g);color:#1B1206}
.h-list{padding:0 14px}
.h-row{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:1px solid var(--bd)}
.h-row:last-child{border-bottom:0}
.h-ri{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--sf2);color:var(--tx2)}
.h-ri .ic{width:15px;height:15px}
.h-ri.ok{background:rgba(59,227,139,.12);color:#3BE38B}
.h-rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.h-rm b{font-size:14px;font-weight:700}
.h-rm small{font-size:11.5px;color:var(--tx2)}
.h-go{height:30px;min-width:56px;padding:0 12px;border-radius:8px;border:1px solid rgba(233,196,106,.5);background:transparent;color:var(--au);
  font:800 12px var(--sans);display:inline-grid;place-items:center;text-decoration:none;cursor:pointer}
.h-done{font-size:12px;font-weight:700;color:#3BE38B}
/* ---- 全站对齐：一种卡片、一种按钮层级、统一间距 ---- */
.panel,.vip{background:var(--sf) !important;border:1px solid var(--bd) !important;border-radius:var(--r) !important;box-shadow:none !important}
.pill{background:var(--sf2) !important;border:1px solid var(--bd) !important;color:var(--tx2) !important}
.pill.g{color:var(--au) !important;border-color:rgba(233,196,106,.35) !important}
.sec{margin-top:var(--sec) !important}
.sec-h{margin-bottom:12px !important;align-items:center !important}
.btn-gh,.btn-qt{background:var(--sf) !important;border:1px solid var(--bd) !important}
#bar{padding-left:var(--g) !important;padding-right:var(--g) !important}
.ep,.lrow,.mtile,.mgrow,.gframe,.item,.gpanel,.shbar,.gcard,.tabs2,.tgbar,.mhero,.agechip,.tag,.unmute,.pmcard{border-color:var(--bd) !important}
.gframe::before,.gframe::after{display:none !important}
.ep.on,.gcard.cur{border-color:rgba(233,196,106,.6) !important}
.sec-h .h2{padding-left:0 !important;font-size:17px !important;font-weight:800 !important}
.sec-h .h2::before{display:none !important}
.sec-h .tbtn,.sec-h>a{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 10px;border-radius:8px;background:var(--sf);border:1px solid var(--bd) !important;
  font-size:12px;font-weight:700;color:var(--tx2) !important;text-decoration:none}
.sec-h .sm{color:var(--tx2) !important;font-size:12px}
.ptchip{border:1px solid rgba(233,196,106,.35) !important}
.ghub>*,.ghub>*>*:first-child{border-color:var(--bd) !important;box-shadow:none !important}
.gx-1,.gx-2,.gx-3,.gx-4,.gx-5,.gx-6{background:var(--sf) !important}
.act3{background:var(--sf) !important;border:1px solid var(--bd) !important;box-shadow:none !important;color:var(--tx) !important}
.act3::after{display:none !important}
.act3.a3-blue{background:var(--au-g) !important;border-color:transparent !important;color:#1B1206 !important}
.mtile{background:var(--sf2) !important;border:1px solid var(--bd) !important;box-shadow:none !important}
.mtile-art{background:#0E0E12 !important}
.ptcard{background:linear-gradient(120deg,rgba(233,196,106,.18),rgba(21,21,27,.95) 60%) !important;border:1px solid rgba(233,196,106,.3) !important;box-shadow:none !important}
.gcardx .cv-fx{opacity:.35}
.gcardx>em.h-badge{position:absolute;left:10px;top:10px;font-style:normal}
/* 夏夏：竖屏视频截帧，脸在上方，裁切点下移，多露出比基尼 */
[data-od-id="girl-hero-summer"] .ph>img{--pos:50% 36% !important;object-position:50% 36% !important}
/* ===== v13 · 全站精修 ===== */
#fab{display:none !important}
/* 女友列表：两列人像卡 */
.gl2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gl2-c{border-radius:var(--r) !important;overflow:hidden;background:var(--sf) !important;border:1px solid var(--bd) !important;box-shadow:none !important;padding:0 !important}
.gl2-c.cur{border-color:rgba(233,196,106,.7) !important}
.gl2-ph{position:relative;display:block;aspect-ratio:3/4;text-decoration:none;color:#fff}
.gl2-ph .ph{position:absolute;inset:0}
.gl2-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.85))}
.gl2-cur{position:absolute;z-index:2;left:8px;top:8px;display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:10.5px;font-weight:800;
  padding:3px 8px;border-radius:6px;background:var(--au-g);color:#1B1206}
.gl2-cur .ic{width:12px;height:12px}
.gl2-n{position:absolute;z-index:2;left:10px;right:10px;bottom:9px;display:flex;flex-direction:column}
.gl2-n b{font-size:17px;font-weight:900}
.gl2-n small{font-size:11px;color:rgba(255,255,255,.75)}
.gl2-b{padding:10px}
.gl2-lv{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--tx2);font-weight:600}
.gl2-lv i{display:block;height:4px;border-radius:2px;background:var(--sf2);overflow:hidden}
.gl2-lv u{display:block;height:100%;background:var(--au-g)}
.gl2-btn{display:grid;place-items:center;width:100%;height:34px;margin-top:10px;border:0;border-radius:9px;background:var(--au-g);color:#1B1206;
  font:800 13px var(--sans);text-decoration:none;cursor:pointer}
.gl2-btn.ghost{background:var(--sf2);border:1px solid var(--bd);color:var(--tx)}
/* 段位标签：中性底 + 金属色字 */
.tgb{background:rgba(0,0,0,.55) !important;border:1px solid var(--bd) !important;box-shadow:none !important;color:#E3A86B !important}
.tgb.tg-silver{color:#D7DCE3 !important}.tgb.tg-gold{color:var(--au) !important}.tgb.tg-diamond{color:#9FE3FF !important}
.tgb em{color:inherit !important;opacity:.7}
.epnum{display:grid;place-items:center;flex:0 0 44px;height:44px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd);
  font:900 16px var(--sans);color:var(--au);font-variant-numeric:tabular-nums}
.epnum.lk{color:var(--tx2)}
.mtile-art{height:84px !important;display:grid !important;place-items:center;position:relative}
.mtile-art .mart{width:46px;height:46px}
.mtile-art em{position:absolute;right:8px;bottom:6px;font-style:normal;font-size:9px;font-weight:900;letter-spacing:.12em;color:rgba(233,196,106,.6)}
.rules{margin-top:var(--sec);background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:0 14px}
.rules>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;cursor:pointer;font-weight:800;font-size:15px}
.rules>summary::-webkit-details-marker{display:none}
.rules>summary small{font-size:12px;font-weight:600;color:var(--tx2)}
.rules>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--tx2);border-bottom:2px solid var(--tx2);transform:rotate(45deg);margin:-4px 4px 0}
.rules[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.rules[open]{padding-bottom:14px}
.rules .panel{background:var(--sf2) !important}
.cv-pink .cv-tint,.cv-gold .cv-tint,.cv-violet .cv-tint,.cv-coral .cv-tint{display:none !important}
.gcardx:not(.cv-frost) .cv-fx{display:none !important}
.gcardx{border-color:var(--bd) !important}
/* ===== v14 · 奖励页：VIP 会员卡 + 官方周边 ===== */
.vipc{position:relative;display:block;aspect-ratio:1.7/1;padding:16px 18px;border-radius:18px;overflow:hidden;text-decoration:none;color:var(--tx);
  background:radial-gradient(120% 90% at 100% 0%,rgba(233,196,106,.22),transparent 55%),
             repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px),
             linear-gradient(150deg,#1D1B21 0%,#0C0B0F 60%,#141217 100%);
  border:1px solid rgba(233,196,106,.45);box-shadow:inset 0 1px 0 rgba(255,236,190,.18),0 18px 40px -20px rgba(233,196,106,.35)}
.vipc-sheen{position:absolute;top:-60%;left:-30%;width:40%;height:220%;transform:rotate(25deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,236,190,.08),transparent)}
.vipc-top{position:relative;display:flex;align-items:center;justify-content:space-between}
.vipc-top img{height:22px}
.vipc-top em{display:flex;flex-direction:column;align-items:flex-end;font-style:normal;font-size:13px;font-weight:800;color:var(--au)}
.vipc-top em small{font-size:9px;letter-spacing:.2em;color:rgba(233,196,106,.6)}
.vipc-mid{position:relative;display:flex;flex-direction:column;margin-top:12px}
.vipc-mid small{font-size:11.5px;color:var(--tx2)}
.vipc-mid b{font-size:40px;font-weight:900;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#FFF6DA,#E9C46A 60%,#B8862B);-webkit-background-clip:text;background-clip:text;color:transparent}
.vipc-bot{position:absolute;left:18px;right:18px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.vipc-prog{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.vipc-prog i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.vipc-prog u{display:block;height:100%;background:var(--au-g)}
.vipc-prog small{font-size:10.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vipc-link{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--au);white-space:nowrap}
.vipc-link .ic{width:14px;height:14px}
.vipc-no{position:absolute;right:18px;top:50%;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.22);font-variant-numeric:tabular-nums}
.mx{margin-top:var(--sec)}
.mx-note{font-size:12px;color:var(--tx2)}
.mx-img{position:relative;display:block;overflow:hidden;background:#0B0B0E}
.mx-img img{width:100%;height:100%;object-fit:cover;display:block}
.mx-feat{display:flex;width:100%;padding:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);background:var(--sf);color:var(--tx);
  text-align:left;font-family:var(--sans);cursor:pointer}
.mx-feat .mx-img{flex:0 0 46%;aspect-ratio:1}
.mx-ft{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;min-width:0}
.mx-tag{font-style:normal;font-size:10px;font-weight:900;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:#E5383B;color:#fff;margin-bottom:3px}
.mx-ft b{font-size:16px;font-weight:800}
.mx-ft small{font-size:11.5px;color:var(--tx2)}
.mx-price{display:inline-flex;align-items:center;gap:4px;margin-top:auto;font-size:18px;font-weight:900;color:var(--au);font-variant-numeric:tabular-nums}
.mx-price small{font-size:11px;font-weight:700;color:var(--tx2);margin-left:1px}
.mx-btn{display:inline-grid;place-items:center;height:32px;padding:0 16px;margin-top:8px;border-radius:9px;background:var(--au-g);color:#1B1206;font-size:12.5px;font-weight:800}
.mx-btn.sm{height:28px;width:100%;padding:0;font-size:12px;margin-top:8px}
.mx-btn.own{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}
.mx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mx-it{display:flex;flex-direction:column;align-items:flex-start;padding:0 0 8px;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--bd);
  background:var(--sf);color:var(--tx);font-family:var(--sans);text-align:left;cursor:pointer}
.mx-it .mx-img{width:100%;aspect-ratio:1}
.mx-it b{font-size:13px;font-weight:800;margin:8px 8px 0}
.mx-it .mx-price{font-size:14px;margin:2px 8px 0}
.mx-it .mx-btn{margin:8px 8px 0;width:calc(100% - 16px)}
.mx-foot{margin-top:10px;font-size:11px;color:var(--tx2);text-align:center}
/* 角色详情：顶部改成循环视频 */
.gvid video{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.gvid img{animation:none !important}
/* ===== v16 · 去框：靠留白分区，不靠边框 ===== */
:root{--bd:transparent}
/* 分类：纯文字，选中的才是金色胶囊 */
.h-chips a{background:transparent !important;border:0 !important;padding:0 10px !important;color:var(--tx2) !important}
.h-chips a.on{background:var(--au-g) !important;color:#1B1206 !important;padding:0 14px !important}
/* 打卡：去掉外框，7 天只留图标 + 文字 */
.h-ck{background:transparent !important;border:0 !important;padding:0 !important}
.h-day{background:transparent !important;border:0 !important;padding:4px 0 !important}
.h-day i{width:38px !important;height:38px !important;border-radius:50%;background:#16161B}
.h-day.on i{background:rgba(233,196,106,.16)}
.h-day.today i{box-shadow:0 0 0 2px var(--au)}
.h-day.today{box-shadow:none !important}
.h-day.gift{background:transparent !important;color:var(--au) !important}
.h-day.gift i{background:var(--au-g)}
/* 「查看全部」：文字链接 */
.h-sec a,.sec-h .tbtn,.sec-h>a{background:transparent !important;border:0 !important;padding:0 !important;height:auto !important;color:var(--tx2) !important}
/* 卡片：不描边 */
.h-card,.h-bn,.h-gt,.hm .adwrap,.panel,.vip,.lrow,.ep,.mtile,.gcardx,.gl2-c,.mx-feat,.mx-it,.rules,.tgbar,.gpanel{border-color:transparent !important}
.h-gl .ph{border-color:transparent !important}
.h-gl.cur .ph{border-color:var(--au) !important}
/* 剧集卡、任务清单：去外框 */
.h-drama{background:transparent !important;padding:0 !important}
.h-list{background:transparent !important;padding:0 !important}
.h-row{border-bottom:1px solid rgba(255,255,255,.06) !important}
.h-go{border:0 !important;background:transparent !important;padding:0 !important;min-width:0 !important;color:var(--au) !important}
.h-ri{background:transparent !important}
/* 积分胶囊：去描边 */
.ptchip{border:0 !important;background:rgba(255,255,255,.06) !important}
.pill{border:0 !important}
.ichip,.tile,.scard,.albc,.catchip,.ptcard,.empty,.uthumb,.poster,.row{border-color:transparent !important}
.ichip{background:rgba(0,0,0,.45) !important}
.catchip:not(.on){background:transparent !important;color:var(--tx2) !important}
.panel,.vip,.lrow,.ep,.gcardx,.ptcard,.gl2-c,.mtile,.scard,.albc,.tile,.gpanel,.tgbar,.mhero,.shbar,.h-bn,.h-card,.mx-feat,.mx-it{box-shadow:none !important}
.panel::before,.panel::after,.lrow::before,.lrow::after,.vip::before,.vip::after,.ptcard::after{display:none !important}
.mgrow,.gframe,.gpanel{box-shadow:none !important}
.gpanel::after,.gpanel::before{display:none !important}
/* 剧集：右上角显眼分享按钮 */
.topshare{position:relative;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px 0 10px;border:0;border-radius:99px;cursor:pointer;
  background:var(--au-g);color:#1B1206;font:800 13px var(--sans);box-shadow:0 6px 18px -6px rgba(233,196,106,.7);white-space:nowrap}
.topshare .ic{width:15px;height:15px}
.topshare em{font-style:normal;font-size:10.5px;font-weight:900;padding:1px 5px;border-radius:6px;background:#E5383B;color:#fff}
@media (prefers-reduced-motion:no-preference){.topshare{animation:shPulse 2.2s ease-in-out infinite}}
@keyframes shPulse{0%,100%{box-shadow:0 6px 18px -6px rgba(233,196,106,.7)}50%{box-shadow:0 0 0 6px rgba(233,196,106,.18),0 6px 18px -6px rgba(233,196,106,.9)}}
</style>

/* 旧存档里 queen / cool / sweet 已下线：按角色存的东西丢弃，当前陪伴回落到兔兔 */
function migrateGirls(s){
  const ok = id => GIDS.includes(id);
  if(!ok(s.girl)) s.girl = "bunny";
  const pick = o => {
    const out = {};
    for(const k in (o || {})) if(ok(k)) out[k] = o[k];
    return out;
  };
  s.xp = Object.assign({ bunny:0, neko:0, summer:0, maid:0 }, pick(s.xp));
  s.outfit = pick(s.outfit);
  s.shots  = pick(s.shots);
  s.gt     = s.gt || {};
  const o = s.owned = s.owned || {};
  o.album = pick(o.album);
  o.tier  = pick(o.tier);
  o.vid    = (o.vid    || []).filter(ok);
  o.outfit = (o.outfit || []).filter(ok);
  delete s.chats; delete s.chatXp; delete s.extra;   /* 聊天与每日计分局都已下线 */
}
let S = load();
function load(){
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){ s = null; }
  if(!s || typeof s !== "object"){ s = fresh(); }
  else { const f = fresh(); for(const k in f) if(!(k in s)) s[k] = f[k]; }
  if(s.day !== today()){
    s.day = today(); s.checkedIn = false; s.rounds = 0; s.invited = 0;
    s.tasks = { checkin:false, game:false, drama:false, share:false, gift:false };
  }
  migrateGirls(s);
  if(!s.owned.outfitC) s.owned.outfitC = [];
  if(!s.owned.outfitL) s.owned.outfitL = [];
  if(!s.owned.album) s.owned.album = {};
  if(!s.owned.tier) s.owned.tier = {};
  if(!s.shots) s.shots = {};
  if(!s.gt) s.gt = {};
  if(!s.vouchers) s.vouchers = [];
  if(!Array.isArray(s.eps.d1)) s.eps.d1 = [];
  s.eps.d1 = s.eps.d1.filter(n => n > FREE_EPS);     /* 免费集不再当作已购 */
  if(!s.booted){
    s.booted = true; s.pts = RULES.signup;
    s.ledger = [{ t:Date.now(), label:"首次注册奖励", d:RULES.signup }];
    s.owned.vid = ["bunny"];
  }
  return s;
}

function bondOf(gid){
  const xp = S.xp[gid] || 0;
  let i = 0;
  for(let k = 0; k < LEVELS.length; k++) if(xp >= LEVELS[k].at) i = k;
  const cur = LEVELS[i], nxt = LEVELS[i + 1];
  return { lv:cur.lv, name:cur.name, unlock:cur.unlock, xp, max:!nxt,
    next: nxt ? nxt.at : cur.at,
    pct: nxt ? Math.min(1, (xp - cur.at) / (nxt.at - cur.at)) : 1 };
}
const lvOf = gid => bondOf(gid).lv;

    if(S.ledger.length > 60) S.ledger.length = 60;
  }
  let up = null;
  if(xp){
    const before = lvOf(g.id);
    S.xp[g.id] = (S.xp[g.id] || 0) + xp;
    if(lvOf(g.id) > before) up = LEVELS[lvOf(g.id) - 1];
  }
  save(); bumpChips(); bumpBonds();
  flyReward(pts, xp);
  rewardToast(label, pts, xp, g);
  if(up) setTimeout(() => levelSheet(g, up), 820);
  return up;
}

function countTo(el, from, to){
  if(from === to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 620;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if(k < 1) requestAnimationFrame(step);
  })(performance.now());
}

/* ============================================================
   动效引擎 · 只写 transform / opacity，不碰布局
   ============================================================ */
const RMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
const rm = () => RMQ.matches;
const HRT = `<svg viewBox="0 0 24 24"><path d="M12 21S3 15.3 3 9.3A4.9 4.9 0 0 1 12 6.5a4.9 4.9 0 0 1 9 2.8C21 15.3 12 21 12 21z"/></svg>`;

/* 最后一次按下的位置：飞行物从这里出发 */
let lastTap = null;
const RIP = ".btn,.quick a,.lrow,.ep,.item,.gift";
document.addEventListener("pointerdown", e => {
  const t = e.target.closest("button,a,[data-gift],[data-rw],[data-pick],[data-ep]");
  lastTap = t ? t.getBoundingClientRect()
              : { left:e.clientX - 1, top:e.clientY - 1, width:2, height:2 };
  if(rm()) return;
  const host = e.target.closest(RIP);
  if(!host) return;
  const r = host.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
  const i = document.createElement("i");
  i.className = "rip";
  i.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px`;

}, true);

const fxBox = () => $("#fx").getBoundingClientRect();
function fxAt(r){
  if(!r) return null;
  const b = fxBox();
  return { x:r.left - b.left + (r.width || 0) / 2, y:r.top - b.top + (r.height || 0) / 2 };
}
function fxAdd(el, ms){ $("#fx").appendChild(el); setTimeout(() => el.remove(), ms); return el; }
const rectOf = sel => { const e = typeof sel === "string" ? $(sel) : sel; return e ? e.getBoundingClientRect() : null; };

/* 4. 「+10 积分 / +5 亲密」沿弧线飞向积分芯片 */
function flyReward(pts, xp, from){
  const chip = $(".ptchip");
  if(rm() || !chip) return;
  const a = fxAt(from || lastTap) || { x:195, y:400 };
  const b = fxAt(chip.getBoundingClientRect());
  const items = [];
  if(pts) items.push([`${pts > 0 ? "+" : ""}${pts} 积分`, "gold"]);
  if(xp)  items.push([`+${xp} 亲密`, "rose"]);
  items.forEach(([txt, cls], i) => arcFly(txt, cls, a, b, i * 120));
  setTimeout(() => { chip.classList.add("pulse"); setTimeout(() => chip.classList.remove("pulse"), 660); }, 640);
}
function arcFly(txt, cls, a, b, delay){
  const el = document.createElement("div");
  el.className = "fly " + cls; el.textContent = txt; el.style.opacity = "0";
  fxAdd(el, delay + 1100);
  const cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - 72;
  const t0 = performance.now() + delay, dur = 800;
  (function step(now){
    if(!el.isConnected) return;
    const k = (now - t0) / dur;
    if(k < 0) return requestAnimationFrame(step);
    const p = Math.min(1, k), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const x = (1 - e) * (1 - e) * a.x + 2 * (1 - e) * e * cx + e * e * b.x;
    const y = (1 - e) * (1 - e) * a.y + 2 * (1 - e) * e * cy + e * e * b.y;
    el.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(${1 - .42 * e})`;
    el.style.opacity = p < .1 ? p / .1 : p > .85 ? (1 - p) / .15 : 1;
    if(p < 1) requestAnimationFrame(step);
  })(performance.now());
}

/* 粒子：金色小点或心形，只用这两种颜色 */
function burst(r, { n = 12, kind = "dot", spread = 46 } = {}){
  const p = fxAt(r); if(rm() || !p) return;
  for(let i = 0; i < n; i++){
    const el = document.createElement("div");
    const rose = kind === "heart" ? i % 3 !== 0 : i % 4 === 0;
    el.className = "spark" + (kind === "heart" ? " hrt" + (rose ? "" : " g") : rose ? " r" : "");
    if(kind === "heart") el.innerHTML = HRT;
    const ang = (Math.PI * 2 * i) / n + Math.random() * .6, dist = spread * (.55 + Math.random() * .7);
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.style.setProperty("--x", (Math.cos(ang) * dist).toFixed(1) + "px");
    el.style.setProperty("--y", (Math.sin(ang) * dist - 14).toFixed(1) + "px");
    el.style.animationDelay = Math.round(Math.random() * 110) + "ms";
    fxAdd(el, 1000);
  }
}
function splash(r, gold){
  const p = fxAt(r); if(rm() || !p) return;
  const el = document.createElement("div");
  el.className = "splash" + (gold ? " g" : "");

function popNum(r, txt, rose){

  el.className = "pop-n" + (rose ? " r" : ""); el.textContent = txt;

}
/* 一个小图标从 A 飞到 B（送礼物用） */
function flyIcon(from, to, icon, done){
  const a = fxAt(from), b = fxAt(to);
  if(rm() || !a || !b){ if(done) done(); return; }
  const el = document.createElement("div");
  el.className = "flyico"; el.innerHTML = ico(icon);
  fxAdd(el, 760);
  const cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - 56, t0 = performance.now(), dur = 620;
  (function step(now){
    if(!el.isConnected) return;
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    const x = (1 - e) * (1 - e) * a.x + 2 * (1 - e) * e * cx + e * e * b.x;
    const y = (1 - e) * (1 - e) * a.y + 2 * (1 - e) * e * cy + e * e * b.y;
    el.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(${1 - .3 * e}) rotate(${e * 200}deg)`;
    el.style.opacity = p > .88 ? (1 - p) / .12 : 1;
    if(p < 1) requestAnimationFrame(step); else if(done) done();
  })(performance.now());
}
/* 11. 卡片飞进「已加入收藏」药丸 */
function flyToCollect(fromEl, label){

    el.style.cssText = `width:62px;height:46px;left:0;top:0`;
    if(img) el.innerHTML = `<img src="${img.getAttribute("src")}" alt="">`;
    fxAdd(el, 700);
    const t0 = performance.now(), dur = 560;
    (function step(now){
      if(!el.isConnected) return;
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.style.transform = `translate3d(${a.x + (b.x - a.x) * e}px,${a.y + (b.y - a.y) * e}px,0) translate(-50%,-50%) scale(${1 - .62 * e})`;
      el.style.opacity = p > .8 ? (1 - p) / .2 : 1;
      if(p < 1) requestAnimationFrame(step); else burst(pill.getBoundingClientRect(), { n:8, spread:26 });
    })(performance.now());
  });
}
/* 6. 升级庆祝：金 / 玫瑰两色心形飘落 */
function confetti(host){
  if(rm() || !host) return;
  const b = host.getBoundingClientRect(), f = fxBox();
  for(let i = 0; i < 16; i++){
    const el = document.createElement("div");
    el.className = "spark hrt" + (i % 2 ? "" : " g");
    el.innerHTML = HRT;
    el.style.left = (b.left - f.left + 20 + Math.random() * (b.width - 40)) + "px";

  const g = girl();
  return [
    { k:"checkin", t:"每日打卡",       p:`+${RULES.checkin} 积分`,      x:`+${XPR.checkin} 亲密`, done:S.tasks.checkin, go:null },
    { k:"game",    t:"玩一局亲密游戏",   p:`最多 +${RULES.gameMax} 积分`, x:`+${XPR.game} 亲密`,    done:S.tasks.game,    go:"#games" },
    { k:"drama",   t:"看完一集短剧",   p:"解锁后续内容",                x:`+${XPR.drama} 亲密`,   done:S.tasks.drama,   go:"#drama" },
    { k:"gift",    t:"送她一份礼物",   p:`-${PRICE.gift} 积分`,         x:`+${XPR.gift} 亲密`,    done:S.tasks.gift,    go:"#girl/" + g.id },
    { k:"share",   t:"分享给好友",     p:`好友有效观看 +${RULES.invite}/人`, x:"", done:S.tasks.share, go:"#drama" }
  ];
}

/* ============================================================
   女友列表 / 详情
   ============================================================ */
ROUTES.girls = { view(){
  return {
    tab:"girls",
    bar:`<div class="row-m"><div class="bar-t">我的女友</div></div>${ptLink()}`,
    html:`
    <div class="gl2" data-od-id="girls-grid">
      ${GIRLS.map(g => { const cur = S.girl === g.id, bd = bondOf(g.id); return `
        <div class="gcard gl2-c ${cur ? "cur" : ""}" data-od-id="girl-card-${g.id}">
          <a class="gl2-ph" href="#girl/${g.id}" aria-label="${esc(g.name)} 角色详情">
            ${phImg(g.v3, g.initial, g.name + " 形象", "", "50% 12%")}
            ${cur ? `<em class="gl2-cur">${ico("i-check")}陪伴中</em>` : ""}
            <span class="gl2-n"><b>${esc(g.name)}</b><small>${esc(g.type)} · ${g.age} 岁</small></span>
          </a>
          <div class="gl2-b">
            <div class="gl2-lv"><span>Lv.${bd.lv} ${esc(bd.name)}</span><i><u style="width:${Math.round(bd.pct * 100)}%"></u></i></div>
            ${cur ? `<a class="gl2-btn ghost" href="#games">陪她玩</a>`
                  : `<button class="gl2-btn" data-pick="${g.id}">选她陪我</button>`}
          </div>
        </div>`; }).join("")}
    </div>
    <p class="sm" style="margin-top:20px;text-align:center;color:var(--tx2)">角色形象仅作演示用途</p>`,
    after(root){
      $$("[data-pick]", root).forEach(b => b.onclick = () => {
        const g = girl(b.dataset.pick);
        burst(b.getBoundingClientRect(), { n:10, kind:"heart", spread:56 });
        pulseOnce(b.closest(".gcard"), "flip", 460);
        S.girl = g.id;
        if(!S.owned.vid.includes(g.id)) S.owned.vid.push(g.id);
        save(); toast(`已选择 ${g.name} · 问候短片已加入视频收藏`, "i-heart");
        setTimeout(render, 430);
      });
    }
  };
}};

ROUTES.girl = { view(id){
  const g = girl(id);
  const isCur = S.girl === g.id;
  const bd = bondOf(g.id);
  const ownsVid = S.owned.vid.includes(g.id);
  return {
    tab:"girls", ghost:true, flush:true,
    bar:`<button class="ibtn hit" onclick="history.length>1?history.back():nav('#girls')" aria-label="返回">${ico("i-back")}</button>
      <div class="row-m" style="text-align:center"><div class="bar-t">角色详情</div></div>
      <button class="ibtn hit" id="girlGift" aria-label="送礼物">${ico("i-gift")}</button>`,
    html:`
    <section class="hero" id="gHero" style="border-radius:0" data-react-pos="right:14px;bottom:170px" data-od-id="girl-hero-${g.id}">
      <div class="ph gvid" style="--pos:50% 24%;height:clamp(380px,60vh,500px)">
        <img src="${outfitImg(g)}" alt="${esc(g.name)} 形象" onerror="imgFail(this)">
        <video id="gVid" src="${(g.videos || [g.video])[0]}" poster="${outfitImg(g)}" muted autoplay loop playsinline
          preload="auto" aria-label="${esc(g.name)} 动态形象" onerror="this.remove()"></video></div>
      <div class="scrim"></div>
      <div class="hero-c" style="bottom:14px">
        <h1 class="h1" style="font-size:28px">${esc(g.name)}<span class="agechip">${g.age}岁 ${ico("i-heart","ic f")}</span></h1>
        <div class="ichips" style="margin-top:10px">${g.tags.map(t => `<span class="ichip">${esc(t)}</span>`).join("")}</div>
      </div>
    </section>
    <div style="padding:0 14px">
      <section class="panel" style="margin-top:12px" data-od-id="girl-about">
        <div class="h3 gg">角色简介</div>
        <p class="p" style="margin-top:7px;color:var(--muted)">${esc(g.about)}</p>
      </section>
      <div style="margin-top:12px">${bondBar(g.id)}</div>
      <div style="margin-top:12px">
        ${isCur
          ? `<a class="btn btn-pri btn-w claim" href="#games" data-od-id="girl-cta-games">${ico("i-game")}和${esc(g.name)}玩亲密游戏</a>`
          : `<button class="btn btn-gold btn-w claim" id="pick" data-od-id="girl-cta-pick">${ico("i-heart")}选她陪我</button>`}
      </div>
      ${S.owned.act.length && isCur ? `
      <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
        ${ACTS.filter(a => S.owned.act.includes(a.id)).map(a =>
          `<button class="btn btn-qt" data-act="${a.id}" style="min-height:40px;font-size:13px">${ico(a.icon)}${a.name}</button>`).join("")}
      </div>` : ""}

      <section class="sec">
        <div class="sec-h"><h2 class="h2">她的空间</h2></div>
        <div style="display:flex;flex-direction:column;gap:9px">
          <a class="lrow" href="#wardrobe">${ico("i-shirt")}<div class="row-m">换装与场景<div class="row-s">${TIERS.length} 套造型 · 已解锁 ${TIERS.filter(t => ownTier(g.id, t.k)).length}</div></div><span class="cv">${ico("i-next")}</span></a>
          <a class="lrow" href="#videos">${ico("i-play")}<div class="row-m">视频收藏<div class="row-s">${ownsVid ? "已解锁 " + g.name + " 的问候短片" : "未解锁"}</div></div><span class="cv">${S.owned.vid.length}/${GIRLS.length}${ico("i-next")}</span></a>
          <a class="lrow" href="#games">${ico("i-game")}<div class="row-m">陪她玩亲密游戏<div class="row-s">${LIVE.length} 个游戏 · 每局都计分</div></div><span class="cv">${ico("i-next")}</span></a>
        </div>
      </section>

      <section class="sec" data-od-id="girl-album">
        <div class="sec-h"><h2 class="h2">她的私密相册</h2>
          <span class="sm">${albumCount(g.id)} / 4 已解锁${shotsOf(g.id).length ? " · 写真 " + shotsOf(g.id).length + " 张" : ""}</span></div>
        ${albumGrid(g.id)}
      </section>

      <section class="sec" data-od-id="girl-bond">
        <div class="sec-h"><h2 class="h2">亲密内容</h2><span class="sm">Lv.${bd.lv} ${esc(bd.name)}</span></div>
        <div style="display:flex;flex-direction:column;gap:9px">
          <button class="lrow" data-bond-open="scene" data-od-id="girl-scene">
            ${ico(bd.lv >= 3 ? "i-sparkle" : "i-lock")}
            <div class="row-m">特别互动：${esc(BOND[g.id].scene.t)}<div class="row-s">Lv.3 默契 解锁</div></div>
            <span class="cv">${bd.lv >= 3 ? `<span class="pill ok">已解锁</span>` : `<span class="pill tbd">Lv.3 解锁</span>`}${ico("i-next")}</span>
          </button>
          <button class="lrow" data-bond-open="story" data-od-id="girl-story">
            ${ico(bd.lv >= 4 ? "i-star" : "i-lock")}
            <div class="row-m">专属故事：${esc(BOND[g.id].story.t)}<div class="row-s">Lv.4 专属羁绊 解锁</div></div>
            <span class="cv">${bd.lv >= 4 ? `<span class="pill ok">已解锁</span>` : `<span class="pill tbd">Lv.4 解锁</span>`}${ico("i-next")}</span>
          </button>
        </div>
      </section>
    </div>`,
    after(root){
      const gv = $("#gVid", root), list = g.videos || [g.video];
      if(gv && list.length > 1){        // 多段视频：播完一段接下一段，循环
        let vi = 0; gv.loop = false;
        gv.addEventListener("ended", () => { vi = (vi + 1) % list.length; gv.src = list[vi]; gv.play().catch(() => {}); });
      }
      if(gv) gv.play().catch(() => {});
      const hero = $("#gHero", root);
      hero.addEventListener("click", () => react(hero, "idle", g.id));
      const p = $("#pick", root);
      if(p) p.onclick = () => {
        S.girl = g.id;
        if(!S.owned.vid.includes(g.id)) S.owned.vid.push(g.id);
        save(); toast(`已选择 ${g.name} · 问候短片已加入视频收藏`, "i-heart");
        render();
      };
      $$("[data-act]", root).forEach(b => b.onclick = () => {
        const a = ACTS.find(x => x.id === b.dataset.act);
        react(hero, "win", g.id); toast(`${g.name} 回应了「${a.name}」`, a.icon);
      });
      $("#girlGift").onclick = () => giftSheet(g.id);
      bindAlbum(root, g.id);
      $$("[data-bond-open]", root).forEach(b => b.onclick = () => bondStory(g.id, b.dataset.bondOpen));
    }
  };
}};
</script>
<script>
"use strict";

const BGS = [
  { id:"cafe",  name:"咖啡馆", en:"Cafe",  img:"assets/img/bg-cafe.webp",  initial:"咖" },
  { id:"beach", name:"海边",   en:"Beach", img:"assets/img/bg-beach.webp", initial:"海" },
  { id:"night", name:"夜景",   en:"Night", img:"assets/img/bg-night.webp", initial:"夜" }
];
const ACTS = [
  { id:"heart", name:"比心", en:"Heart",     icon:"i-heart",   say:"比心" },
  { id:"wave",  name:"挥手", en:"Wave",      icon:"i-sparkle", say:"挥手" },
  { id:"cheer", name:"庆祝", en:"Celebrate", icon:"i-star",    say:"庆祝" }
];

ROUTES.wardrobe = { view(){
  const g = girl();
  const cur = wornTier(g.id);
  const OUT = TIERS.map(t => ({ k:t.k, t:t.t, price:t.price, img:t.img(g), own:ownTier(g.id, t.k) }));
  return {
    tab:"girls",
    bar:barBack("换装与场景", "", `<div style="margin-left:auto">${ptLink()}</div>`),
    html:`
    <section class="sec" style="margin-top:4px" data-od-id="wardrobe-outfits">
      <div class="sec-h"><h2 class="h2">造型</h2><span class="sm">${OUT.filter(o => o.own).length} / ${TIERS.length} 可用</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
        ${OUT.map(o => `<button class="item tall ${o.own ? "" : "tierlk"}" data-outfit="${o.k}" data-od-id="outfit-${o.k}">
          ${phImg(o.img, g.initial, o.own ? g.name + " " + o.t : "未解锁造型", "", "50% 20%")}
          <span class="shine"></span>
          ${o.own
            ? (cur === o.k ? `<span class="pill g badge">${ico("i-check")}穿着中</span>` : "")
            : `<span class="lkbox">${ico("i-lock")}<span class="pill g">${o.price} 积分</span></span>`}
          <div class="item-b"><div class="item-t" style="font-size:13px">${esc(o.t)}</div>
            <div class="sm" style="font-size:11px">${o.own ? (cur === o.k ? "穿着中" : "点击换上") : o.price + " 积分解锁"}</div></div>
        </button>`).join("")}
      </div>
    </section>

    <section class="sec" data-od-id="wardrobe-bgs">
      <div class="sec-h"><h2 class="h2">约会场景</h2><span class="sm">${S.owned.bg.length} / ${BGS.length} 已拥有</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px">
        ${BGS.map(b => {
          const own = S.owned.bg.includes(b.id);
          return `<button class="sw ${S.bg === b.id ? "on" : ""}" data-bg="${b.id}" data-od-id="bg-${b.id}">
            ${phImg(b.img, b.initial, b.name + " 场景")}
            <div class="scrim"></div>
            <span>${esc(b.name)}${own ? "" : ` · ${PRICE.bg}`}</span>
            ${own ? "" : `<span style="position:absolute;z-index:4;top:7px;right:7px;color:var(--gold)">${ico("i-lock","ic")}</span>`}
          </button>`;
        }).join("")}
      </div>
      <p class="sm" style="margin-top:10px">场景会用在聊天背景里。</p>
    </section>

    <section class="sec" data-od-id="wardrobe-acts">
      <div class="sec-h"><h2 class="h2">专属动作 / 语音</h2><span class="sm">每项 ${PRICE.act} 积分</span></div>
      <div style="display:flex;flex-direction:column;gap:9px">
        ${ACTS.map(a => {
          const own = S.owned.act.includes(a.id);
          return `<button class="lrow" data-act="${a.id}" data-od-id="act-${a.id}">
            ${ico(a.icon)}<div class="row-m">${esc(a.name)}<div class="row-s">在角色页点按触发她的回应</div></div>
            <span class="cv">${own ? `<span class="pill ok">${ico("i-check")}已拥有</span>` : `<span class="pill g">${PRICE.act}</span>`}</span>
          </button>`;
        }).join("")}
      </div>
    </section>`,
    after(root){
      $$("[data-outfit]", root).forEach(b => b.onclick = () => {
        const v = b.dataset.outfit, o = OUT.find(x => x.k === v);
        if(!o.own){
          return buy({ cost:o.price, title:"一套角色服装", sub:`${g.name} · ${o.t}`, fromEl:b,
            cond:["解锁后永久可切换","仅对该角色生效"],
            done(){
              const t = S.owned.tier = S.owned.tier || {};
              (t[g.id] = t[g.id] || []).push(v);
              S.outfit[g.id] = v;
            },
            then(){
              const card = $(`[data-outfit="${v}"]`);
              if(card){ card.classList.remove("tierlk"); pulseOnce(card, "unl", 1000); }
              if(TIER_LINE[v]) toast(`${g.name}：${TIER_LINE[v]}`, "i-heart");
              setTimeout(render, 900);
            } });
        }
        S.outfit[g.id] = v; save(); toast(`${g.name} 换上了${o.t}`, "i-shirt"); render();
      });
      $$("[data-bg]", root).forEach(b => b.onclick = () => {
        const bg = BGS.find(x => x.id === b.dataset.bg);
        if(!S.owned.bg.includes(bg.id)){
          return buy({ cost:PRICE.bg, title:"一个角色背景", sub:bg.name, fromEl:b,
            cond:["解锁后永久可用","所有角色通用"],
            done(){ S.owned.bg.push(bg.id); S.bg = bg.id; } });
        }
        S.bg = bg.id; save(); toast(`场景已切换到${bg.name}`, "i-star"); render();
      });
      $$("[data-act]", root).forEach(b => b.onclick = () => {
        const a = ACTS.find(x => x.id === b.dataset.act);
        if(S.owned.act.includes(a.id)){ toast(`「${a.name}」已拥有，在角色页可触发`); return; }
        buy({ cost:PRICE.act, title:"一个专属动作/语音", sub:a.name, fromEl:b,
          cond:["解锁后永久可用","在角色页点按触发"],
          done(){ S.owned.act.push(a.id); } });
      });
    }
  };
}};

/* 余额三行：每次抽屉打开时现算，不缓存 */
function balanceRows(cost){
  const after = S.pts - cost, ok = after >= 0;
  return `<div class="panel" style="padding:4px 16px" data-od-id="sheet-balance">
    <div class="row"><div class="row-m"><div class="row-t">消耗积分</div></div>
      <b class="big" style="font-size:15px">${cost}</b></div>
    <div class="row"><div class="row-m"><div class="row-t">当前余额</div></div>
      <b class="big" style="font-size:15px">${S.pts}</b></div>
    <div class="row"><div class="row-m"><div class="row-t">${cost > 0 ? "兑换后余额" : "余额"}</div>
      ${ok ? "" : `<div class="row-s rose">积分不足，还差 ${cost - S.pts}</div>`}</div>
      <b class="big" style="font-size:15px;color:${ok ? "var(--gold)" : "var(--rose)"}">${ok ? after : S.pts}</b></div>
  </div>`;
}

/* 统一的「确认兑换」确认单 */
function buy({ cost, title, sub, cond = [], stock, limit, expiry, done, then, fromEl }){
  const after = S.pts - cost;
  const ok = after >= 0;
  const sh = sheet({
    title:"确认兑换", sub:`${title}${sub ? " · " + sub : ""}`,
    body:`${balanceRows(cost)}
      <div class="sec" style="margin-top:18px">
        <div class="lbl" style="margin-bottom:9px">兑换条件</div>
        <ul style="list-style:none;display:flex;flex-direction:column;gap:8px">
          ${[...cond,
             stock ? `库存 ${stock}` : null,
             limit || null,
             expiry ? `有效期至 ${expiry}` : null].filter(Boolean)
            .map(c => `<li class="sm" style="display:flex;gap:8px;color:var(--muted)"><span class="gold">${ico("i-check","ic")}</span><span>${esc(c)}</span></li>`).join("")}
        </ul>
      </div>`,
    foot: ok
      ? `<button class="btn btn-pri btn-w" id="yes">确认兑换 · ${cost} 积分</button>
         <button class="btn btn-qt btn-w" onclick="closeSheet()">再想想</button>`
      : `<a class="btn btn-pri btn-w" href="#games" onclick="closeSheet()">${ico("i-game")}去玩亲密游戏赚积分</a>
         <button class="btn btn-qt btn-w" onclick="closeSheet()">关闭</button>`
  });
  const y = sh.querySelector("#yes");
  if(y) y.onclick = () => {
    if(S.pts < cost){ toast("积分不足"); return; }
    const src = fromEl && fromEl.isConnected ? fromEl : null;
    done(); save(); addPts(-cost, `兑换 ${title}`);
    closeSheet();
    setTimeout(() => flyToCollect(src, `${title} 已加入收藏`), 220);
    if(then) then(); else setTimeout(render, 760);
  };
}
window.closeSheet = closeSheet; window.nav = nav;

/* ---------- 送礼物 ---------- */
function giftSheet(gid){
  const g = girl(gid), b = bondOf(g.id);
  const sh = sheet({
    title:`<span style="display:inline-flex;align-items:center;gap:8px">${i3("gift", 26)}送礼物</span>`,
    sub:`${g.name} · 每件 ${PRICE.gift} 积分 · +${XPR.gift} 亲密`,
    body:`<div class="gifts" data-od-id="gift-grid">
        ${GIFTS.map(x => `<button class="gift" data-gift="${x.id}" data-od-id="gift-${x.id}">
          ${ico(x.icon)}<span>${esc(x.name)}</span><em>${PRICE.gift} 积分</em></button>`).join("")}
      </div>
      <div style="margin-top:14px">${balanceRows(PRICE.gift)}</div>
      <div class="panel" style="margin-top:11px;padding:4px 16px">
        <div class="row"><div class="row-m"><div class="row-t">${esc(g.name)} 的亲密度</div>
          <div class="row-s">${b.max ? "已满级" : "距 Lv." + (b.lv + 1) + " 还差 " + (b.next - b.xp) + " 点"}</div></div>
          <b style="font-size:15px;color:var(--gold)">Lv.${b.lv} ${esc(b.name)}</b></div>
      </div>
      <p class="sm" style="margin-top:14px">选中即送出，她会立刻回你一句。礼物为虚拟物品，不可转让、不折现。</p>`,
    foot:`<button class="btn btn-qt btn-w" onclick="closeSheet()">再看看</button>`
  });
  $$("[data-gift]", sh).forEach(btn => btn.onclick = () => sendGift(g, GIFTS.find(x => x.id === btn.dataset.gift), btn));
}
function sendGift(g, gift, fromEl){
  if(S.pts < PRICE.gift){ closeSheet(); toast(`积分不足，还差 ${PRICE.gift - S.pts}`, "i-coin"); return; }
  S.tasks.gift = true;
  const from = fromEl ? fromEl.getBoundingClientRect() : lastTap;
  closeSheet();
  const to = rectOf("#fab") || rectOf(".ptchip");
  flyIcon(from, to, gift.icon, () => burst(to, { n:9, kind:"heart", spread:36 }));
  reward(`送出${gift.name}`, -PRICE.gift, XPR.gift, g.id);
  toast(`${g.name}：${BOND[g.id].thanks[gift.id]}`, "i-heart");
  setTimeout(render, 980);
}

/* ---------- 私密相册：解锁 + 全屏看图 ---------- */
const ALB_LINE = {
  sweet:["这张是我最喜欢的一张。","只给你看哦～（脸红）","那天房间里只开了串灯……","这套是我自己挑的，好看吗？"],
  queen:["看吧。我允许了。","这张我删过一次，又找回来了。","别传出去。","你眼神有点不老实。"],
  cool:["……别看太久。","就一眼。","这张是凌晨拍的。","嗯。现在你知道了。"]
};
function albumGrid(gid){
  const g = girl(gid), A = albumOf(g);
  const shots = shotsOf(gid);
  return `<div class="alb" data-od-id="album-${gid}">
    ${shots.map(sh => `<button class="albc" data-shot="1" data-od-id="shot-${gid}">
      ${phImg(sh.img, g.initial, g.name + " " + sh.t, "", "50% 18%")}
      <span class="cap">${esc(sh.t)}</span></button>`).join("")}
    ${A.map((ph, i) => {
      const own = albumOwned(gid, i);

function bindAlbum(root, gid){
  $$("[data-shot]", root).forEach(b => b.onclick = () => openViewer(gid, 0));
  $$("[data-alb]", root).forEach(b => b.onclick = () => {
    const i = +b.dataset.alb;
    if(albumOwned(gid, i)) return openViewer(gid, i);
    const g = girl(gid), ph = albumOf(g)[i];
    buy({ cost:PRICE.album, title:"一张私密照片", sub:`${g.name} · ${ph.t}`, fromEl:b,
      cond:["解锁后永久可看","仅解锁这一张"],

      then(){

        setTimeout(render, 900);
      } });
  });
}
let VW = null;
function openViewer(gid, i){
  const g = girl(gid), A = albumOf(g);
  const idx = A.map((_, k) => k).filter(k => albumOwned(gid, k));
  let at = Math.max(0, idx.indexOf(i));
  const v = $("#viewer");
  v.innerHTML = `
    <div class="vtop">
      <button class="ibtn hit" id="vClose" aria-label="关闭">${ico("i-close")}</button>
      <b>${esc(g.name)} · 私密相册</b>
      <span class="sm" id="vNum"></span>
    </div>
    <div class="vwrap"><div class="vtrack" id="vTrack">
      ${idx.map(k => `<div class="vslide"><img src="${A[k].img}" alt="${esc(g.name)} ${esc(A[k].t)}"></div>`).join("")}
    </div></div>
    <div class="vbot">
      <div class="vdots">${idx.map(() => `<i></i>`).join("")}</div>
      <div class="vline" id="vLine"></div>
    </div>`;
  v.classList.add("on"); v.setAttribute("aria-hidden", "false");
  VW = { gid, idx, at };
  paint();
  $("#vClose").onclick = closeViewer;
  const wrap = v.querySelector(".vwrap");
  let x0 = null;
  wrap.addEventListener("pointerdown", e => { x0 = e.clientX; });
  wrap.addEventListener("pointerup", e => {
    if(x0 == null) return;
    const dx = e.clientX - x0; x0 = null;
    if(Math.abs(dx) < 40) return;
    VW.at = Math.max(0, Math.min(VW.idx.length - 1, VW.at + (dx < 0 ? 1 : -1)));
    paint();
  });
  function paint(){
    $("#vTrack").style.transform = `translateX(${-VW.at * 100}%)`;
    $("#vNum").textContent = `${VW.at + 1} / ${VW.idx.length}`;
    $("#vLine").textContent = ALB_LINE[gid][VW.idx[VW.at]] || "";
    $$("#viewer .vdots i").forEach((d, k) => d.classList.toggle("on", k === VW.at));
  }
}
function closeViewer(){
  const v = $("#viewer");
  v.classList.remove("on"); v.setAttribute("aria-hidden", "true"); v.innerHTML = "";
  VW = null;
}
window.closeViewer = closeViewer;

  for(let k = 0; k < GTIERS.length; k++) if(xp >= GTIERS[k].at) i = k;
  const cur = GTIERS[i], nxt = GTIERS[i + 1];
  return { ...cur, i, xp, next:nxt, need: nxt ? nxt.at - xp : 0,
    pct: nxt ? Math.min(1, (xp - cur.at) / (nxt.at - cur.at)) : 1 };
}

/* ---------- 共用：开始 / 停止 / 结算 ---------- */
let G = null;
function stopGame(){
  if(!G) return;
  if(G.tick) clearInterval(G.tick);
  if(G.spawn) clearInterval(G.spawn);
  if(G.raf) cancelAnimationFrame(G.raf);
  if(G.off) try { G.off(); } catch(e){}
  G = null;
}
let settled = false;          /* 一局只能结算一次：超时与手动结束可能同时触发 */
function startGame(gm){
  stopGame();
  settled = false;
  curGame = gm.id;
  const scored = true;              /* 每局都计分，没有练习模式 */
  ({ heart:playHeart, quiz:playQuiz, memory:playMemory, catch:playCatch, truth:playTruth, fog:playFog,
     rps:playRps, photo:playPhoto, sun:playSun })[gm.id](gm, scored);
}
/* 把一局的得分折算成积分并出结算页 */
function gameFinish(gm, { score, scored, earned, detail }){
  if(settled) return;
  settled = true;
  stopGame();
  const g = girl();
  /* 基础分 → 段位加成 → 双倍卡，三段分开展示 */
  const T0 = gTier(gm.id);
  const base = earned;
  const tbonus = Math.round(base * (T0.mul - 1));
  let dbl = false, dbonus = 0;
  if(S.dbl > 0 && base > 0){            /* 双倍积分卡：一次性，用掉即失效 */
    dbl = true; dbonus = base + tbonus; S.dbl = 0; useVoucher("x2");
  }
  const total = base + tbonus + dbonus;
  const rec = (S.gt = S.gt || {})[gm.id] = S.gt[gm.id] || { xp:0, best:0, plays:0 };
  rec.plays = (rec.plays || 0) + 1;
  rec.best = Math.max(rec.best || 0, score);
  rec.xp = (rec.xp || 0) + base;         /* 段位分按基础积分累积 */
  S.rounds = (S.rounds || 0) + 1;
  S.tasks.game = true; save();
  const T = gTier(gm.id);
  const promoted = T.i > T0.i;
  reward(gm.name, total, XPR.game, g.id);
  if(total > 0) setTimeout(() => winPop(total, `${gm.name} · ${T.t}${promoted ? " · 段位升级！" : ""}`), 700);
  const mood = total >= 36 ? "win" : total >= 15 ? "ok" : "low";
  const cheer = BOND[g.id].cheer[mood];
  $("#gameHost").innerHTML = `
  <section data-od-id="game-result">
    <div class="panel gframe" style="padding:0;overflow:hidden">
      <div class="rhero" data-od-id="result-companion">
        ${phImg(outfitImg(g), g.initial, g.name + " 的庆祝")}
        <div class="scrim"></div>
        <span class="pill g badge" style="position:absolute;top:12px;right:12px;z-index:4">
          ${ico(mood === "win" ? "i-star" : "i-heart")}${mood === "win" ? "特别庆祝" : "她的回应"}</span>
        <div style="position:absolute;z-index:3;left:16px;right:16px;bottom:14px">
          <div class="h3">${esc(g.name)}<span class="en">${esc(g.en)}</span></div>
          <p class="p" style="margin-top:5px;color:rgba(255,255,255,.9)">「${esc(cheer)}」</p>
        </div>
      </div>
      <div style="text-align:center;padding:18px 18px 20px">
        <div class="lbl">${esc(gm.name)} · 本局结果</div>
        <div class="big xl" id="finalScore" style="margin-top:6px;font-size:46px">${score}</div>
        <div class="sm" style="margin-top:3px">${esc(detail)}</div>
        <div class="scorelist" data-od-id="result-breakdown">
          <div class="row"><div class="row-m"><div class="row-t">基础积分</div></div>
            <b class="big stat-n" style="font-size:18px">+${base}</b></div>
          <div class="row"><div class="row-m"><div class="row-t">段位加成</div>
            <div class="row-s">${T0.t} ×${T0.mul}</div></div>
            <b class="big stat-n" style="font-size:18px;color:${tbonus ? "var(--gold-2)" : "var(--muted)"}">+${tbonus}</b></div>
          ${dbl ? `<div class="row"><div class="row-m"><div class="row-t">双倍积分卡</div>
            <div class="row-s">已用掉，下一局恢复</div></div>
            <b class="big stat-n" style="font-size:18px;color:var(--gold-2)">+${dbonus}</b></div>` : ""}
          <div class="row total"><div class="row-m"><div class="row-t">本局合计</div>
            <div class="row-s">亲密 +${XPR.game}</div></div>
            <b class="big stat-n gg" style="font-size:24px">+${total}</b></div>
        </div>
        ${promoted ? `<div class="panel vhit" style="margin-top:12px;padding:11px 14px;display:flex;align-items:center;gap:10px">
          ${ico("i-up")}<div class="row-m" style="text-align:left"><b style="font-size:13.5px">段位提升 · ${T.t}</b>
          <div class="sm" style="margin-top:2px">${esc(gm.name)} 的积分倍率升到 ×${T.mul}</div></div></div>` : ""}

  if(promoted) setTimeout(() => { confetti($(".rhero")); toast(`${gm.name} 升到 ${T.t} · 倍率 ×${T.mul}`, "i-crown"); }, 320);

    countTo($("#finalScore"), 0, score);

   ============================================================ */
function playHeart(gm, scored){
  const g = girl();
  $("#gameHost").innerHTML = `
  <section data-od-id="game-run">
    ${gstat([["得分","sc",0],["连击","cb",0],["剩余","tm",GAME.len]], scored)}
    <div class="arena" id="arena" data-react-pos="right:12px;bottom:12px"><div class="combo" id="comboTag"></div></div>
    ${modeBar(scored)}
  </section>`;
  const arena = $("#arena"), bar = $(".tbar"), tmEl = $("#tm");
  G = { score:0, combo:0, best:0, hits:0, left:GAME.len, celebrated:false, arena };
  react(arena, "idle", g.id);
  G.tick = setInterval(() => {
    G.left--;
    tmEl.textContent = Math.max(0, G.left);
    $("#tb").style.transform = `scaleX(${Math.max(0, G.left / GAME.len)})`;
    const low = G.left <= 5 && G.left > 0;
    bar.classList.toggle("low", low); tmEl.classList.toggle("low", low);
    if(G.left <= 0) done();
  }, 1000);
  G.spawn = setInterval(pop, 620);
  pop(); pop();
  $("#quit").onclick = done;

  function done(){
    const { score, best, hits } = G;
    const earned = scored ? Math.min(RULES.gameMax, Math.round(score / 10)) : 0;
    const host = $("#gameHost");
    if(!rm() && host){                       // 奖励吻：唇印盖在屏幕中间
      const st = document.createElement("div");
      st.className = "lipstamp"; st.innerHTML = LIPS;
      host.appendChild(st); setTimeout(() => st.remove(), 1600);
    }
    toast(`${g.name}：${KISS_LINE[g.id]}`, "i-heart");
    setTimeout(() => gameFinish(gm, { score, scored, earned,
      detail:`接住 ${hits} 次 · 最高 ${best} 连击` }), rm() ? 0 : 900);
  }
  function pop(){
    if(!G) return;
    const w = arena.clientWidth || 320, h = arena.clientHeight || 396;
    const b = document.createElement("button");
    const gold = Math.random() < 0.14;
    b.className = "hbtn kiss" + (gold ? " gold" : "");
    b.type = "button"; b.setAttribute("aria-label", gold ? "点击飞吻" : "点击心形");
    b.innerHTML = gold ? LIPS : HEART;
    b.style.left = (18 + Math.random() * Math.max(10, w - 92)) + "px";
    b.style.top  = (18 + Math.random() * Math.max(10, h - 92)) + "px";
    arena.appendChild(b);
    const life = setTimeout(() => {
      if(!b.isConnected) return;
      b.classList.add("fade"); setTimeout(() => b.remove(), 300);
      if(G){ G.combo = 0; $("#cb").textContent = 0; $("#comboTag").classList.remove("on"); }
    }, 1500);
    b.onclick = () => {
      if(!G) return;
      clearTimeout(life);
      const r = b.getBoundingClientRect();
      b.classList.add("pop"); setTimeout(() => b.remove(), 340);
      splash(r, gold);
      G.hits++; G.combo++; G.best = Math.max(G.best, G.combo);
      const gain = (GAME.hit + (G.combo >= 5 ? GAME.comboBonus : 0)) * (gold ? 2 : 1);
      G.score += gain;
      popNum(r, "+" + gain, !gold);
      $("#sc").textContent = G.score; $("#cb").textContent = G.combo;
      const tag = $("#comboTag");
      if(G.combo >= 2){ tag.textContent = `${G.combo} 连击${gold ? " · 双倍" : ""}`; tag.classList.add("on"); }
      else tag.classList.remove("on");
      if(G.combo === 5 || G.combo === 10 || G.combo === 20){
        pulseOnce(tag, "hit", 460);
        burst(r, { n:7, kind:"heart", spread:48 });   // 连击时她送一串飞吻
      }
      if(G.score >= GAME.target && !G.celebrated){ G.celebrated = true; react(arena, "win", g.id); }
      else if(G.combo >= 5){ if(G.combo % 3 === 0) react(arena, "combo", g.id); }
      else if(G.hits % 4 === 0) react(arena, "hit", g.id);
    };
  }
}

const QUIZ_PT = 6;
function playQuiz(gm, scored){
  const g = girl();
  const qs = QUIZ[g.id].map(q => {
    const idx = q.o.map((_, i) => i);
    for(let i = idx.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return { q:q.q, pic:q.pic, o:idx.map(i => q.o[i]), a:idx.indexOf(q.a) };
  });
  G = { i:0, right:0, locked:false };
  paint();
  function paint(){
    if(!G) return;
    const q = qs[G.i];
    $("#gameHost").innerHTML = `
    <section data-od-id="game-run">
      <div class="qprog">${qs.map((_, i) => `<i class="${i < G.i ? "on" : i === G.i ? "cur" : ""}"></i>`).join("")}</div>
      <div class="panel" style="display:flex;align-items:center;gap:12px;padding:12px 14px">

          <div class="sm" style="margin-top:2px">第 ${G.i + 1} / ${qs.length} 题 · 答对 +${QUIZ_PT} 分</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px" id="opts">
        ${q.o.map((o, i) => `<button class="qopt" data-o="${i}" data-od-id="quiz-opt-${i}">
          ${q.pic && o[1] ? phImg(SCENE[o[1]].img, SCENE[o[1]].initial, o[0]) : ""}
          <span>${esc(o[0])}</span>
          <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 12.6 9.6 17.4 19.2 6.6"/></svg></span>
        </button>`).join("")}
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
        ${curGame ? tierBadge(curGame) : ""}
        <span class="pill">已答对 ${G.right}</span>
        <button class="btn btn-pri" id="nextQ" style="margin-left:auto;min-height:42px;font-size:13.5px" aria-disabled="true">
          ${G.i === qs.length - 1 ? "看结果" : "下一题"}</button>
      </div>
    </section>`;
    const nx = $("#nextQ");
    $$("[data-o]").forEach(b => b.onclick = () => {
      if(!G || G.locked) return;
      G.locked = true;
      const pick = +b.dataset.o, ok = pick === q.a;
      b.classList.add("sel", ok ? "right" : "wrong");
      if(!ok) $$("[data-o]")[q.a].classList.add("right");
      $$("[data-o]").forEach(x => x.setAttribute("disabled", ""));
      if(ok){ G.right++; burst(b.getBoundingClientRect(), { n:9, kind:"heart", spread:46 }); popNum(b.getBoundingClientRect(), "+" + QUIZ_PT); }
      react($("#gameHost"), ok ? (G.right >= 4 ? "win" : "hit") : "idle", g.id);
      nx.removeAttribute("aria-disabled");
      nx.classList.add("claim");
    });
    nx.onclick = () => {
      if(!G || !G.locked) return;
      G.locked = false;
      if(G.i >= qs.length - 1) return done();
      G.i++; paint();
    };
  }
  function done(){
    const right = G.right;
    const score = right * QUIZ_PT;
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    gameFinish(gm, { score, scored, earned, detail:`答对 ${right} / ${qs.length} 题` });
  }
}

    G.t++;
    $("#tm").textContent = G.t;
    $("#tb").style.transform = `scaleX(${Math.max(0, (MEM_LEN - G.t) / MEM_LEN)})`;
    const low = MEM_LEN - G.t <= 8 && G.t < MEM_LEN;
    $(".tbar").classList.toggle("low", low); $("#tm").classList.toggle("low", low);
    if(G.t >= MEM_LEN) done(false);
  }, 1000);
  $("#quit").onclick = () => done(false);
  $$("[data-c]", grid).forEach(b => b.onclick = () => {
    if(!G || G.lock) return;
    const i = +b.dataset.c;
    if(b.classList.contains("flip")) return;
    b.classList.add("flip");
    G.flips++; $("#mf").textContent = G.flips;
    G.open.push({ i, b });
    if(G.open.length < 2) return;
    G.lock = true;
    const [x, y] = G.open;
    if(deck[x.i].k === deck[y.i].k){
      G.pairs++; $("#mp").textContent = `${G.pairs} / 6`;
      setTimeout(() => {
        x.b.classList.add("done"); y.b.classList.add("done");
        const her = deck[x.i].her;
        burst(y.b.getBoundingClientRect(), { n:her ? 9 : 8, kind:her ? "heart" : "dot", spread:36 });
        if(her) toast(`${g.name}：${HER_LINE[G.herPairs++ % HER_LINE.length]}`, "i-heart");
        react(grid, G.pairs >= 5 ? "win" : "hit", g.id);
        G.open = []; G.lock = false;
        if(G.pairs === 6) done(true);
      }, 280);
    } else {
      setTimeout(() => {
        if(!G) return;
        x.b.classList.remove("flip"); y.b.classList.remove("flip");
        G.open = []; G.lock = false;
      }, 700);
    }
  });
  function done(won){
    const t = G ? G.t : MEM_LEN, pairs = G ? G.pairs : 0;
    const score = won ? Math.max(6, Math.min(30, Math.round(30 - t / 1.5))) : pairs * 3;
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    gameFinish(gm, { score, scored, earned,
      detail: won ? `${t} 秒完成 · 翻牌 ${G ? G.flips : 0} 次` : `配对 ${pairs} / 6 · 时间到` });
  }
}

const CATCH_LEN = 30;
function playCatch(gm, scored){
  const g = girl();
  $("#gameHost").innerHTML = `
  <section data-od-id="game-run">
    ${gstat([["得分","sc",0],["连击","cb",0],["剩余","tm",CATCH_LEN]], scored)}

    </div>

  </section>`;
  const st = $("#stage2"), basket = $("#basket");
  let W = st.clientWidth || 330;
  G = { score:0, combo:0, best:0, caught:0, left:CATCH_LEN, items:[], x:W / 2 - 38, last:0 };
  const place = () => { basket.style.transform = `translateX(${G.x}px)`; };
  place();
  react(st, "idle", g.id);

  const moveTo = cx => {
    if(!G) return;
    W = st.clientWidth || W;
    G.x = Math.max(0, Math.min(W - 76, cx - 38));
    place();
  };
  const onPtr = e => {
    const r = st.getBoundingClientRect();
    const cx = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - r.left;
    moveTo(cx);
  };
  const onDown = e => { st.setPointerCapture && e.pointerId != null && st.setPointerCapture(e.pointerId); onPtr(e); };
  st.addEventListener("pointerdown", onDown);
  st.addEventListener("pointermove", e => { if(e.buttons) onPtr(e); });
  const onKey = e => {
    if(!G) return;
    if(e.key === "ArrowLeft"){ moveTo(G.x + 38 - 34); e.preventDefault(); }
    if(e.key === "ArrowRight"){ moveTo(G.x + 38 + 34); e.preventDefault(); }
  };
  window.addEventListener("keydown", onKey);
  G.off = () => { st.removeEventListener("pointerdown", onDown); window.removeEventListener("keydown", onKey); };

  G.tick = setInterval(() => {
    if(!G) return;
    G.left--;
    $("#tm").textContent = Math.max(0, G.left);
    $("#tb").style.transform = `scaleX(${Math.max(0, G.left / CATCH_LEN)})`;
    const low = G.left <= 5 && G.left > 0;
    $(".tbar").classList.toggle("low", low); $("#tm").classList.toggle("low", low);
    if(G.left <= 0) done();
  }, 1000);
  G.spawn = setInterval(spawn, 620);
  spawn();

  const step = now => {
    if(!G) return;
    const dt = G.last ? Math.min(48, now - G.last) : 16;
    G.last = now;
    const H = st.clientHeight || 340;
    for(let i = G.items.length - 1; i >= 0; i--){
      const it = G.items[i];
      it.y += it.sp * dt / 16;
      it.el.style.transform = `translate(${it.x}px,${it.y}px) rotate(${it.r}deg)`;
      it.r += it.spin;
      if(it.y > H - 48 && it.y < H - 6 && it.x + 17 > G.x && it.x + 17 < G.x + 76){
        hit(it); G.items.splice(i, 1); continue;
      }
      if(it.y > H){ it.el.remove(); G.items.splice(i, 1); if(it.k !== "rival") breakCombo(); }
    }
    G.raf = requestAnimationFrame(step);
  };
  G.raf = requestAnimationFrame(step);

  function spawn(){
    if(!G) return;
    W = st.clientWidth || W;
    const roll = Math.random();
    const k = roll < .2 ? "rival" : roll < .5 ? "kiss" : roll < .76 ? "heart" : "rose";
    const el = document.createElement("div");
    el.className = "falling"; el.innerHTML = FALL[k].svg;
    st.appendChild(el);
    G.items.push({ k, el, x:8 + Math.random() * Math.max(10, W - 50), y:-36,
      sp:1.9 + Math.random() * 1.5, r:0, spin:(Math.random() - .5) * 6 });
  }
  function hit(it){
    const r = it.el.getBoundingClientRect();
    it.el.remove();

      G.combo = 0; $("#cb").textContent = 0;

      $("#sc").textContent = G.score;
      popNum(r, "-4", true);
      splash(r, false);
      pulseOnce(st, "shake", 420);
      return;
    }
    G.caught++; G.combo++; G.best = Math.max(G.best, G.combo);
    const gain = FALL[it.k].v * (G.combo >= 5 ? 2 : 1);
    G.score += gain;
    $("#sc").textContent = G.score; $("#cb").textContent = G.combo;
    popNum(r, "+" + gain, it.k !== "rose");
    splash(r, it.k === "rose");
    if(G.combo === 5 || G.combo === 10 || G.combo === 20) react(st, "combo", g.id);
    else if(G.caught % 5 === 0) react(st, "hit", g.id);
  }
  function breakCombo(){ if(!G) return; G.combo = 0; $("#cb").textContent = 0; }
  function done(){
    const { score, caught, best } = G;
    const earned = scored ? Math.min(RULES.gameMax, Math.round(score / 4)) : 0;
    gameFinish(gm, { score, scored, earned, detail:`接住 ${caught} 个飞吻 · 最高 ${best} 连击` });
  }
  $("#quit").onclick = done;
}

  };
  fog();
  // 雾慢慢回来：每 1.4s 补一层很淡的雾
  G.spawn = setInterval(() => {
    if(!G || G.won) return;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(253,242,215,.1)";
    ctx.fillRect(0, 0, W, H);
    measure();
  }, 1400);

  const wipe = (x, y) => {
    ctx.globalCompositeOperation = "destination-out";
    const r = Math.max(22, Math.min(W, H) * .11);
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(0,0,0,1)");
    gr.addColorStop(.6, "rgba(0,0,0,.85)");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  };
  function measure(){
    if(!G) return 0;
    let clear = 0, total = 0;
    try {
      const d = ctx.getImageData(0, 0, W, H).data;
      for(let i = 3; i < d.length; i += 4 * 97){ total++; if(d[i] < 120) clear++; }
    } catch(e){ return G.pct; }
    G.pct = total ? clear / total : 0;
    const el = $("#fp"); if(el) el.textContent = Math.round(G.pct * 100) + "%";
    if(G.pct >= FOG_GOAL && !G.won){ G.won = true; done(true); }
    return G.pct;
  }
  const at = e => {
    const r = cv.getBoundingClientRect();
    const cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const cy = e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return [(cx - r.left) * (W / (r.width || W)), (cy - r.top) * (H / (r.height || H))];
  };
  const down = e => { G && (G.wiping = true); const [x, y] = at(e); wipe(x, y); measure();
    const h = $("#fhint"); if(h) h.style.display = "none"; };
  const move = e => { if(!G || !G.wiping) return; const [x, y] = at(e); wipe(x, y); };
  const up = () => { if(G){ G.wiping = false; measure(); } };
  cv.addEventListener("pointerdown", down);
  cv.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  G.off = () => { window.removeEventListener("pointerup", up); };

  G.tick = setInterval(() => {
    if(!G) return;
    G.left--;
    $("#tm").textContent = Math.max(0, G.left);
    $("#tb").style.transform = `scaleX(${Math.max(0, G.left / FOG_LEN)})`;
    const low = G.left <= 5 && G.left > 0;
    $(".tbar").classList.toggle("low", low); $("#tm").classList.toggle("low", low);
    if(G.left <= 0) done(false);
  }, 1000);
  $("#quit").onclick = () => done(false);

  function done(won){
    const pct = G ? Math.round(G.pct * 100) : 0;
    const used = FOG_LEN - (G ? G.left : 0);
    const score = won ? Math.max(10, Math.min(30, Math.round(30 - used * .6))) : Math.round(pct * .25);
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    toast(`${g.name}：被你看到了啦～（脸红）`, "i-heart");
    setTimeout(() => gameFinish(gm, { score, scored, earned,
      detail: won ? `${used} 秒擦开 ${pct}%` : `只擦开 ${pct}% · 时间到` }), rm() ? 0 : 700);
  }
}

/* ============================================================
   游戏 7 · 猜拳换装（赢了她换下一套，顶到比基尼为止）
   ============================================================ */
const RPS = [
  { k:"rock",  t:"石头", svg:HAND_R },
  { k:"paper", t:"布",   svg:HAND_P },
  { k:"sci",   t:"剪刀", svg:HAND_S }
];
const RPS_BEATS = { rock:"sci", paper:"rock", sci:"paper" };
/* 换装阶梯：礼服 → 睡衣 → 比基尼，赢一局上一档 */
const RPS_LADDER = ["lounge", "x", "bikini"];
const RPS_LINE = {
  sweet:{ win:["那…我去换一套。", "说好只看一眼哦。（脸红）", "最后一套了，不许笑我。"],
          lose:["哼～弹你额头。", "笨手笨脚的。", "再来呀，我可不让。"],
          tie:["平手！不算不算。"] },
  queen:{ win:["说话算话。等我两分钟。", "你赢了。看仔细了。", "这是最后一套。"],
          lose:["弹一下。记住这感觉。", "太急了。", "再来。我还没尽兴。"],
          tie:["一样。重来。"] },
  cool:{ win:["……行。我去换。", "嗯。看吧。", "就这一套了。"],
         lose:["弹你。", "输了。", "再来。"],
         tie:["又一样。"] }
};
const RPS_SURPRISE = {
  sweet:"被你赢走了…这套只给你看（脸红）",
  queen:"被你赢走了…这套只给你看（脸红）",
  cool:"被你赢走了…这套只给你看（脸红）"
};
const RPS_ROUNDS = 5, RPS_PT = 15, RPS_BONUS = 20;   /* 赢两局到顶 = 30 封顶 + 20 惊喜 */
const RPS_BEAT = ["石头…", "剪刀…", "布！"];

function playRps(gm, scored){
  const g = girl();
  G = { i:0, win:0, lose:0, step:0, lock:false, surprise:false };

  const tierAt = i => RPS_LADDER[Math.min(i, RPS_LADDER.length - 1)];
  const wornSrc = () => tierImg(g, tierAt(G.step));
  const wornName = () => tierOf(tierAt(G.step)).t;

  function ladder(){
    return RPS_LADDER.map((k, i) => {
      const got = i <= G.step, cur = i === G.step;
      return `<span class="rstep ${got ? "got" : ""} ${cur ? "cur" : ""}">
        ${phImg(tierImg(g, k), g.initial, got ? tierOf(k).t : "未解锁造型", "", "50% 18%")}
        ${got ? "" : `<i class="lk">${ico("i-lock","ic")}</i>`}
        <b>${esc(tierOf(k).t)}</b></span>`;
    }).join(`<i class="rarrow">${ico("i-next","ic")}</i>`);
  }
  function paint(){
    if(!G) return;
    $("#gameHost").innerHTML = `
    <section data-od-id="game-run">
      <div class="qprog">${Array.from({length:RPS_ROUNDS}, (_, i) =>
        `<i class="${i < G.i ? "on" : i === G.i ? "cur" : ""}"></i>`).join("")}</div>
      <div class="rstage cv-pink" id="rstage" data-react-pos="right:12px;bottom:84px">
        <div class="rph" id="rph">${phImg(wornSrc(), g.initial, g.name + " " + wornName(), "", "50% 14%")}</div>
        <div class="cv-tint"></div>
        <div class="scrim"></div>
        <div class="rladder" id="rladder">${ladder()}</div>
        <div class="rhand" id="herHand">${HAND_R}</div>
        <div class="rbeat" id="rbeat"></div>
        <div class="rcap" id="rcap"><b>${esc(g.name)} · <span id="rtier">${esc(wornName())}</span></b>
          <span class="pill g" id="rwl">赢 ${G.win} · 输 ${G.lose}</span></div>
        <div class="rwipe" id="rwipe"></div>
      </div>
      <div class="rpsrow" style="margin-top:13px" id="rpsrow">
        ${RPS.map(r => `<button class="rpsbtn" data-rps="${r.k}" data-od-id="rps-${r.k}">
          ${r.svg}<span>${r.t}</span></button>`).join("")}
      </div>
      ${modeBar(scored)}
      <p class="sm" style="margin-top:10px;text-align:center">连赢两局就能一路换到比基尼，最后有惊喜。</p>
    </section>`;
    $("#quit").onclick = done;
    $$("[data-rps]").forEach(b => b.onclick = () => throwHand(b.dataset.rps));
  }
  const lockBtns = on => $$("[data-rps]").forEach(b => on ? b.setAttribute("disabled","") : b.removeAttribute("disabled"));

  /* 石头…剪刀…布！三拍，然后开手 */
  function throwHand(mine){
    if(!G || G.lock) return;
    G.lock = true; lockBtns(true);
    const hers = RPS[(Math.random() * 3) | 0];
    const hand = $("#herHand"), beat = $("#rbeat");
    const gap = rm() ? 0 : 420;
    RPS_BEAT.forEach((t, i) => setTimeout(() => {
      if(!G || !$("#rbeat")) return;
      beat.textContent = t;
      pulseOnce(beat, "pop", 360);
      if(i < 2) pulseOnce(hand, "shakeh", 380);
    }, gap * i));
    setTimeout(() => {
      if(!G) return;
      pulseOnce(hand, "flip", 480);
      setTimeout(() => { if(G && $("#herHand")) hand.innerHTML = hers.svg; }, rm() ? 0 : 210);
      setTimeout(() => { if(G) settle(mine, hers); }, rm() ? 10 : 460);
    }, gap * 2 + (rm() ? 10 : 320));
  }

  function settle(mine, hers){
    const L = RPS_LINE[g.id], beat = $("#rbeat");
    if(mine === hers.k){
      if(beat) beat.textContent = "平手";
      toast(`${g.name}：${L.tie[0]}`, "i-heart");
      G.i++;
      return next();
    }
    if(RPS_BEATS[mine] === hers.k){
      G.win++;
      if(beat) beat.textContent = "你赢了";
      const last = G.step >= RPS_LADDER.length - 1;
      burst($("#herHand").getBoundingClientRect(), { n:12, kind:"heart", spread:58 });
      if(last){                                     /* 已经是比基尼：直接给惊喜 */
        G.i++; return surprise();
      }
      G.step++;
      toast(`${g.name}：${L.win[Math.min(G.step - 1, L.win.length - 1)]}`, "i-heart");
      changeOutfit(() => {
        G.i++;
        if(G.step >= RPS_LADDER.length - 1) return surprise();
        next();
      });
      return;
    }
    G.lose++;
    if(beat) beat.textContent = "她赢了";
    pulseOnce($("#rstage"), "flick", 520);          /* 弹额头 */
    toast(`${g.name}：${L.lose[(G.lose - 1) % L.lose.length]}`, "i-heart");
    G.i++;
    next();
  }

  /* 闪光横扫换装 */
  function changeOutfit(cb){
    const w = $("#rwipe"), ph = $("#rph");
    const swap = () => {
      if(!G || !$("#rph")) return;
      ph.innerHTML = phImg(wornSrc(), g.initial, g.name + " " + wornName(), "", "50% 14%");
      const t = $("#rtier"); if(t) t.textContent = wornName();
      const l = $("#rladder"); if(l) l.innerHTML = ladder();
      react($("#rstage"), "win", g.id);
    };
    if(rm() || !w){ swap(); return setTimeout(cb, 240); }
    w.classList.remove("on"); void w.offsetWidth; w.classList.add("on");
    setTimeout(swap, 300);
    setTimeout(() => { if(w) w.classList.remove("on"); cb(); }, 760);
  }

  function next(){
    const wl = $("#rwl"); if(wl) wl.textContent = `赢 ${G.win} · 输 ${G.lose}`;
    setTimeout(() => {
      if(!G || G.surprise) return;
      if(G.i >= RPS_ROUNDS) return done();
      G.lock = false;
      paint();
    }, rm() ? 60 : 820);
  }

  /* 惊喜：庆祝 + 奖励卡 + 比基尼进衣柜 */
  function surprise(){
    if(!G || G.surprise) return;
    G.surprise = true;
    const t = S.owned.tier = S.owned.tier || {};
    const arr = t[g.id] = t[g.id] || [];
    const isNew = !arr.includes("bikini");
    if(isNew) arr.push("bikini");
    S.outfit[g.id] = "bikini";
    save();
    const bonus = scored ? RPS_BONUS : 0;
    $("#gameHost").innerHTML = `
    <section data-od-id="rps-surprise">
      <div class="rstage cv-pink surp" id="rstage">
        <div class="rph">${phImg(tierImg(g, "bikini"), g.initial, g.name + " 比基尼造型", "", "50% 14%")}</div>
        <div class="cv-tint"></div>
        <div class="scrim"></div>
        <span class="pill g badge" style="position:absolute;top:12px;left:12px;z-index:5">${ico("i-star")}惊喜</span>
        <div class="rcap big-cap">
          <div class="h1" style="font-size:21px">一路赢到比基尼</div>
          <p class="p" style="margin-top:6px;color:rgba(255,255,255,.93)">「${esc(RPS_SURPRISE[g.id])}」</p>
        </div>
      </div>
      <div class="panel vhit" style="margin-top:13px;padding:4px 16px" data-od-id="rps-bonus">
        <div class="row"><span class="gold" style="width:18px">${ico("i-coin")}</span>
          <div class="row-m"><div class="row-t">惊喜奖励</div>
            <div class="row-s">点「收下」后到账</div></div>
          <b class="big" style="font-size:17px;color:${bonus ? "var(--gold-2)" : "var(--muted)"}">${bonus ? "+" + bonus : "0"}</b></div>
        <div class="row"><span class="gold" style="width:18px">${ico("i-game")}</span>
          <div class="row-m"><div class="row-t">本局结算</div>
            <div class="row-s">收下后结算，封顶 +${RULES.gameMax}，再按段位加成</div></div>
          <b class="big" style="font-size:17px;color:var(--gold-2)">+${RULES.gameMax}</b></div>
        <div class="row"><span class="gold" style="width:18px">${ico("i-shirt")}</span>
          <div class="row-m"><div class="row-t">比基尼造型 已加入衣柜试穿</div>
            <div class="row-s">${isNew ? "新解锁 · 永久可切换" : "已在衣柜里"}</div></div>
          <a class="tbtn" href="#wardrobe">去衣柜</a></div>
      </div>
      <button class="btn btn-pri btn-w claim" id="takeit" style="margin-top:14px">${ico("i-gift")}收下惊喜 · +${RPS_BONUS} 积分</button>
    </section>`;
    setTimeout(() => confetti($("#rstage")), rm() ? 0 : 240);
    /* 领取时才发放：中途离开不会反复白拿 +20 */
    $("#takeit").onclick = () => {
      if(bonus) reward("猜拳换装 · 惊喜奖励", bonus, 0, g.id);
      setTimeout(() => done(true), bonus ? 420 : 0);
    };
  }

  paint();                                        /* 放在所有 const 之后，避免 TDZ */

  function done(full){
    const win = G ? G.win : 0, lose = G ? G.lose : 0, step = G ? G.step : 0;
    if(G && G.surprise && !full) return;            /* 惊喜页上不要被计时器抢走 */
    const score = win * RPS_PT;
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    gameFinish(gm, { score, scored, earned,
      detail:`赢 ${win} · 输 ${lose} · 换到${tierOf(RPS_LADDER[Math.min(step, 2)]).t}` });
  }
}

/* ============================================================
