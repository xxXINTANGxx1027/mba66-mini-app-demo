<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MBA66 · 娱乐小程序演示</title>
<meta name="theme-color" content="#0B1735">
<link rel="icon" href="assets/logo/mba-app-icon01.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* 深宝蓝底 */
  --navy:#0A1A5C;--navy-2:#0C2378;--navy-3:#14306F;--ink:#05102F;
  --bg-1:#07154A;--bg-2:#0C2378;
  /* 电光蓝 */
  --blue:#2F6BFF;--blue-2:#1E50FF;--blue-hi:#3A7BFF;--blue-btn:#2E66F5;--blue-btn-2:#1736BE;
  --glow:rgba(47,107,255,.45);
  /* 金 */
  --gold-1:#FFE59A;--gold-2:#F2C25B;--gold-3:#C98A2B;
  --gold:#F2C25B;--gold-d:#C98A2B;--rose:#FF6E9C;
  --purple-1:#7A45F0;--purple-2:#5329C8;--orange-1:#F08A4B;--orange-2:#C9552A;
  --pink:#FF4D8D;
  --card:rgba(16,36,110,.72);--card-2:rgba(10,24,78,.88);
  --fg:#FFFFFF;--muted:rgba(226,236,255,.74);--faint:rgba(206,220,255,.66);
  --line:rgba(58,123,255,.38);--line-2:rgba(120,160,255,.2);
  --r-ctl:12px;--r-card:16px;--r-panel:18px;
  /* 苹方原生：中文苹方，英文数字走系统 SF；非苹果设备落到鸿蒙 / 冬青 / Noto Sans SC */
  --sans:"PingFang SC",-apple-system,"SF Pro Display","HarmonyOS Sans SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --e:cubic-bezier(.22,.61,.36,1);--e2:cubic-bezier(.32,.72,0,1);--e3:cubic-bezier(.2,.7,.2,1);
}
html,body{height:100%}
body{
  font-family:var(--sans);font-weight:400;font-size:14.5px;line-height:1.6;color:var(--fg);background:var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  letter-spacing:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
/* ---------- desktop backdrop ---------- */
#backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(90rem 60rem at 18% -10%,#1b2f61 0%,rgba(27,47,97,0) 62%),
  radial-gradient(70rem 50rem at 92% 108%,#2a1c3a 0%,rgba(42,28,58,0) 60%),
  linear-gradient(170deg,#0A1330 0%,#060C1C 100%);}
#backdrop::after{content:"";position:absolute;inset:-10%;backdrop-filter:blur(70px);-webkit-backdrop-filter:blur(70px)}
#bd-brand{position:fixed;z-index:1;left:clamp(32px,5vw,96px);top:50%;transform:translateY(-50%);
  width:228px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
#bd-logo{height:30px;width:auto;opacity:.94;filter:drop-shadow(0 2px 16px rgba(0,0,0,.55))}
#bd-rule{width:40px;height:1px;background:rgba(226,187,106,.45)}
#bd-note{font-size:12px;font-weight:400;line-height:1.85;letter-spacing:.01em;color:rgba(242,237,227,.5)}
/* 窄桌面放不下左栏：回到顶部居中，并为机身预留真实净空 */
@media (max-width:1099px){
  #bd-brand{left:50%;top:22px;transform:translateX(-50%);width:auto;align-items:center;gap:0}
  #bd-logo{height:24px}
  #bd-rule,#bd-note{display:none}
}
/* ---------- phone frame ---------- */
#phone{position:relative;z-index:2;width:390px;height:844px;max-height:calc(100vh - 118px);
  border-radius:46px;background:var(--navy);padding:0;overflow:hidden;
  box-shadow:0 0 0 1px rgba(226,187,106,.22),0 0 0 9px #0a0f1f,0 0 0 10px rgba(226,187,106,.1),
    0 50px 90px -20px rgba(0,0,0,.85);}
#phone::before{content:"";position:absolute;z-index:40;top:0;left:50%;transform:translateX(-50%);
  width:112px;height:26px;background:#0a0f1f;border-radius:0 0 15px 15px;pointer-events:none}
.app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--navy-2) 0%,var(--navy) 46%,#09122b 100%)}
/* ---------- app bar ---------- */
#bar{flex:0 0 auto;padding:34px 18px 10px;display:flex;align-items:center;gap:12px;min-height:76px;
  position:relative;z-index:20}
#bar.ghost{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,rgba(6,12,28,.78),rgba(6,12,28,0))}
.bar-t{font-weight:600;font-size:17px;line-height:1.45;letter-spacing:0}
.bar-s{font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:2px}
.en{font-weight:400;font-size:.76em;color:var(--muted);letter-spacing:.01em;margin-left:5px}
.ibtn{width:36px;height:36px;min-width:36px;border-radius:50%;border:1px solid var(--line-2);background:rgba(242,237,227,.04);
  display:grid;place-items:center;cursor:pointer;color:var(--fg);transition:background .18s var(--e),border-color .18s var(--e)}
.ibtn:hover{background:rgba(226,187,106,.14);border-color:var(--line)}
.ibtn:active{transform:scale(.94)}
.hit{position:relative}
.hit::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
/* ---------- stage ---------- */
#stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.scr{padding:0 18px 26px;animation:scrIn .4s var(--e3) backwards}
.scr.flush{padding:0 0 26px}
@keyframes scrIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ---------- tabbar ---------- */
#tabs{position:relative;flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 8px 20px;
  background:linear-gradient(180deg,rgba(6,12,28,.4),rgba(6,12,28,.96));border-top:1px solid var(--line-2);
  position:relative;z-index:30}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;min-height:52px;
  text-decoration:none;color:var(--faint);transition:color .2s var(--e)}
#tabs a .ic{width:21px;height:21px}
#tabs a span{font-size:11px;font-weight:500;letter-spacing:0}
#tabs a:hover{color:var(--fg)}
#tabs a.on{color:var(--gold)}
#tabs a.on span{font-weight:600}
/* ---------- type ---------- */
.h1{font-weight:600;font-size:23px;line-height:1.45;letter-spacing:0}
.h2{font-weight:600;font-size:16.5px;line-height:1.5;letter-spacing:0}
.h3{font-weight:600;font-size:15px;line-height:1.5;letter-spacing:0}
.lbl{font-size:12px;font-weight:500;line-height:1.5;letter-spacing:0;color:var(--muted)}
.p{font-size:14.5px;line-height:1.6;color:var(--muted);font-weight:400}
.sm{font-size:12px;line-height:1.6;color:var(--muted);font-weight:400;letter-spacing:0}
/* 计数器与价格：等宽数字；大号数字收紧字距 */
.big{font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.big.xl{font-weight:300}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.gold{color:var(--gold)}.rose{color:var(--rose)}
/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;
  border-radius:999px;border:1px solid transparent;font-family:var(--sans);font-size:14px;font-weight:400;
  letter-spacing:0;font-weight:500;cursor:pointer;text-decoration:none;transition:background .2s var(--e),color .2s var(--e),border-color .2s var(--e),transform .12s var(--e)}
.btn:active{transform:scale(.975)}
.btn-pri{background:var(--gold);color:#11193a}
.btn-pri:hover{background:#EFCD83;color:#0d1430}
.btn-gh{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-gh:hover{background:rgba(226,187,106,.12);border-color:rgba(226,187,106,.4);color:var(--fg)}
.btn-go{background:transparent;color:var(--gold);border-color:rgba(226,187,106,.5)}
.btn-go:hover{background:rgba(226,187,106,.17);color:#F3DCA8;border-color:var(--gold)}
.btn-qt{background:rgba(242,237,227,.05);color:var(--fg);border-color:var(--line-2)}
.btn-qt:hover{background:rgba(242,237,227,.12)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;pointer-events:none}
.btn-w{width:100%}
.btn .ic{width:17px;height:17px}
.tbtn{position:relative;background:none;border:0;color:var(--gold);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
  text-decoration:none;padding:6px 2px;letter-spacing:0;border-bottom:1px solid transparent;transition:border-color .2s var(--e)}
.tbtn::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;transform:translateY(-50%);height:44px}
.tbtn:hover{border-bottom-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
/* ---------- media + fallbacks ---------- */
.ph{position:relative;overflow:hidden;background:
  linear-gradient(145deg,var(--navy-3) 0%,#0b1430 55%,#1a1430 100%);isolation:isolate}
.ph::after{content:attr(data-initial);position:absolute;inset:0;display:grid;place-items:center;
  font-weight:500;font-size:clamp(34px,16vw,72px);color:rgba(226,187,106,.3);
  letter-spacing:0;z-index:0}
.ph>img,.ph>video{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;
  object-position:var(--pos,50% 20%)}
.ph.gone>img,.ph.gone>video{display:none}
.ph>img.kb{animation:kb 22s var(--e) infinite alternate}
@keyframes kb{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(-2%,-2.5%,0)}}
.scrim{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(6,12,28,.42) 0%,rgba(6,12,28,0) 32%,rgba(6,12,28,.1) 54%,rgba(6,12,28,.88) 100%)}
/* ---------- cards ---------- */
.card{border:1px solid var(--line-2);border-radius:var(--r-card);background:rgba(242,237,227,.035);overflow:hidden}
.panel{border:1px solid var(--line-2);border-radius:var(--r-panel);background:rgba(242,237,227,.03);padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row-m{flex:1 1 auto;min-width:0}
.row-t{font-size:14px;font-weight:400;line-height:1.5}
.row-s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.lrow{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;background:rgba(242,237,227,.035);
  border:1px solid var(--line-2);border-radius:var(--r-ctl);color:var(--fg);font-family:var(--sans);font-size:14px;
  font-weight:400;text-align:left;text-decoration:none;cursor:pointer;min-height:50px;
  transition:background .18s var(--e),border-color .18s var(--e)}
.lrow:hover{background:rgba(226,187,106,.1);border-color:var(--line)}
.lrow .ic{width:18px;height:18px;color:var(--gold);flex:0 0 auto}
.lrow .cv{margin-left:auto;color:var(--faint);display:flex;align-items:center;gap:8px;font-size:12px}
.lrow .cv .ic{width:14px;height:14px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px;border-radius:999px;
  font-size:11.5px;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums;
  border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.g{border-color:rgba(226,187,106,.4);color:var(--gold);background:rgba(226,187,106,.08)}
.pill.r{border-color:rgba(240,122,154,.4);color:var(--rose);background:rgba(240,122,154,.08)}
.pill.ok{border-color:rgba(146,205,157,.42);color:#92CD9D;background:rgba(146,205,157,.08)}
.pill.tbd{border-style:dashed;border-color:rgba(242,237,227,.34);color:var(--muted)}
.pill.badge{background:rgba(8,14,34,.9);box-shadow:0 4px 14px -4px rgba(0,0,0,.6)}
.ic{display:inline-block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.f{fill:currentColor;stroke:none}
/* ---------- points chip ---------- */
.ptchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border-radius:999px;
  border:1px solid rgba(226,187,106,.34);background:rgba(11,23,53,.6);backdrop-filter:blur(8px);
  font-size:13px;color:var(--gold);letter-spacing:0;text-decoration:none}
.ptchip .ic{width:14px;height:14px}
.ptchip b{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* ---------- toast ---------- */
#toast{position:absolute;z-index:70;left:0;right:0;top:88px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 20px}
.tst{max-width:100%;display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:999px;
  background:rgba(8,15,36,.94);border:1px solid var(--line);color:var(--fg);font-size:13px;line-height:1.4;
  font-weight:500;box-shadow:0 14px 34px -10px rgba(0,0,0,.8);animation:tstIn .3s var(--e2) both}
.tst .ic{width:15px;height:15px;color:var(--gold);flex:0 0 auto}
.tst-r{display:flex;align-items:center;gap:9px;margin-left:2px;white-space:nowrap}
.tst-r b{font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums}
.tst-r b.xp{display:inline-flex;align-items:center;gap:4px;color:var(--rose)}
.tst-r b.xp .ic{width:12px;height:12px;color:var(--rose)}
.tst.out{animation:tstOut .3s var(--e) both}
@keyframes tstIn{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tstOut{to{opacity:0;transform:translateY(-12px) scale(.98)}}
/* ---------- sheet ---------- */
#veil{position:absolute;inset:0;z-index:50;background:rgba(4,8,20,.72);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .28s var(--e)}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;z-index:60;left:0;right:0;bottom:0;transform:translateY(102%);
  transition:transform .4s var(--e2);background:#0C1733;border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;max-height:86%;display:flex;flex-direction:column}
#sheet.on{transform:none}
.sh-h{flex:0 0 auto;padding:18px 20px 12px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line-2)}
.sh-b{flex:1 1 auto;overflow-y:auto;padding:16px 20px 0;scrollbar-width:none}
.sh-b::-webkit-scrollbar{display:none}
.sh-f{flex:0 0 auto;padding:14px 20px 24px;display:flex;flex-direction:column;gap:9px}
.grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:3px;border-radius:2px;background:rgba(242,237,227,.22)}
/* ---------- coach marks ---------- */
#coach{position:absolute;inset:0;z-index:90;display:none}
#coach.on{display:block}
#coach .mask{position:absolute;inset:0;background:rgba(4,8,20,.8)}
#coach .ring{position:absolute;border:1.5px solid var(--gold);border-radius:14px;box-shadow:0 0 0 9999px rgba(4,8,20,.8),0 0 26px rgba(226,187,106,.4);
  transition:all .36s var(--e2)}
#coach .cc{position:absolute;left:18px;right:18px;padding:18px;border-radius:var(--r-panel);background:#0C1733;
  border:1px solid var(--line);box-shadow:0 20px 50px -14px rgba(0,0,0,.8);transition:top .36s var(--e2),bottom .36s var(--e2)}
#coach .dots{display:flex;gap:6px;margin-top:14px}
#coach .dots i{width:16px;height:2px;border-radius:2px;background:rgba(242,237,227,.2)}
#coach .dots i.on{background:var(--gold);width:22px}
/* ---------- girls ---------- */
.gcard{display:block;text-decoration:none;color:inherit;border-radius:var(--r-card);overflow:hidden;
  border:1px solid var(--line-2);background:rgba(242,237,227,.03);transition:border-color .24s var(--e),transform .24s var(--e)}
.gcard:hover{border-color:rgba(226,187,106,.42);transform:translateY(-2px)}
.gcard .ph{aspect-ratio:3/4}
.gcard-b{padding:13px 14px 15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hero{position:relative;border-radius:0 0 var(--r-panel) var(--r-panel);overflow:hidden}
.hero .ph{aspect-ratio:3/4.1;width:100%}
.hero-c{position:absolute;z-index:3;left:18px;right:18px;bottom:16px}
/* ---------- quick entries ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick a{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;min-height:76px;
  border-radius:var(--r-ctl);border:1px solid var(--line-2);background:rgba(242,237,227,.035);
  text-decoration:none;color:var(--fg);font-size:13px;font-weight:500;transition:background .2s var(--e),border-color .2s var(--e)}
.quick a:hover{background:rgba(226,187,106,.1);border-color:var(--line)}
.quick .ic{width:20px;height:20px;color:var(--gold)}
/* ---------- chat ---------- */
.chat-wrap{position:relative;height:100%;display:flex;flex-direction:column}
.chat-bg{position:absolute;inset:0;z-index:0}
.chat-bg>.ph{position:absolute;inset:0}
.chat-bg::before{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(6,12,28,.95) 0%,rgba(6,12,28,.76) 26%,rgba(6,12,28,.78) 60%,rgba(6,12,28,.96) 100%)}
.chat-sc{flex:1 1 auto;overflow-y:auto;padding:12px 18px 10px;display:flex;flex-direction:column;gap:11px;
  position:relative;z-index:1;scrollbar-width:none}
.chat-sc::-webkit-scrollbar{display:none}
.msg{max-width:78%;padding:11px 14px;font-size:14.5px;line-height:1.6;border-radius:16px;animation:msgIn .3s var(--e) both}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.her{align-self:flex-start;background:rgba(19,33,74,.92);color:var(--fg);
  border:1px solid rgba(226,187,106,.16);border-bottom-left-radius:5px;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.msg.me{align-self:flex-end;background:var(--gold);color:#11193a;border-bottom-right-radius:5px;font-weight:500;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.msg.sys{align-self:center;background:rgba(6,12,28,.72);color:var(--muted);font-size:11.5px;max-width:94%;
  text-align:center;line-height:1.6;padding:8px 13px;border-radius:12px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 15px;background:rgba(19,33,74,.92);
  border:1px solid rgba(226,187,106,.16);border-radius:16px;border-bottom-left-radius:5px}
.typing i{width:5px;height:5px;border-radius:50%;background:rgba(242,237,227,.72);animation:tp 1.1s var(--e) infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-in{flex:0 0 auto;position:relative;z-index:2;display:flex;gap:9px;align-items:flex-end;
  padding:10px 14px max(18px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line-2);background:rgba(8,14,34,.86)}
.chat-in textarea{flex:1 1 auto;min-height:44px;max-height:92px;resize:none;border-radius:22px;padding:12px 16px;
  background:rgba(242,237,227,.07);border:1px solid var(--line-2);color:var(--fg);font-family:var(--sans);
  font-size:14.5px;font-weight:400;line-height:1.5}
.chat-in textarea::placeholder{color:var(--faint)}
.chat-in textarea:focus{outline:none;border-color:rgba(226,187,106,.5);box-shadow:0 0 0 3px rgba(226,187,106,.12)}
.send{width:44px;height:44px;min-width:44px;border-radius:50%;border:0;background:var(--gold);color:#11193a;
  display:grid;place-items:center;cursor:pointer;transition:background .2s var(--e),transform .12s var(--e)}
.send:hover{background:#EFCD83}.send:active{transform:scale(.93)}
.send[disabled]{background:rgba(242,237,227,.12);color:var(--faint);cursor:not-allowed}
/* ---------- reaction bubble ---------- */
.react{position:absolute;z-index:14;display:flex;align-items:center;gap:9px;padding:7px 13px 7px 7px;
  border-radius:999px;background:rgba(8,14,34,.92);border:1px solid var(--line);font-size:13px;font-weight:500;
  box-shadow:0 10px 28px -10px rgba(0,0,0,.8);animation:rcIn .34s var(--e2) both}
.react.hide{animation:rcOut .3s var(--e) both}
@keyframes rcIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes rcOut{to{opacity:0;transform:scale(.94)}}
.av-s{width:34px;height:34px;min-width:34px;border-radius:50%;overflow:hidden;flex:0 0 auto}
.av-s .ph::after{font-size:15px}
.react .av{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:0 0 auto}
.react .av .ph{width:100%;height:100%}
.react .av .ph::after{font-size:13px}
/* ---------- game ---------- */
.arena{position:relative;height:396px;border-radius:var(--r-panel);overflow:hidden;border:1px solid var(--line-2);
  background:radial-gradient(70% 60% at 50% 18%,rgba(240,122,154,.14),rgba(11,23,53,0) 70%),
    linear-gradient(170deg,#0d1a3c,#0a1230 100%);background-color:#0b1735;touch-action:manipulation}
.hbtn{position:absolute;width:56px;height:56px;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;animation:hPop .26s var(--e2) both}
.hbtn svg{width:38px;height:38px;fill:var(--rose);filter:drop-shadow(0 4px 12px rgba(240,122,154,.5))}
.hbtn.gold svg{fill:var(--gold);filter:drop-shadow(0 4px 12px rgba(226,187,106,.5))}
@keyframes hPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.hbtn.pop{animation:hGo .34s var(--e3) forwards;pointer-events:none}
@keyframes hGo{0%{transform:scale(1)}30%{transform:scale(1.18,.86)}60%{opacity:1;transform:scale(.9,1.12)}100%{opacity:0;transform:scale(1.5)}}
.hbtn.fade{animation:hFade .3s var(--e) forwards;pointer-events:none}
@keyframes hFade{to{opacity:0;transform:scale(.6)}}
.gstat{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.gstat>div{flex:1 1 0;padding:11px 13px;border-radius:var(--r-ctl);border:1px solid var(--line-2);background:rgba(242,237,227,.035)}
.gstat b{display:block;font-size:23px;font-weight:400;margin-top:3px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.tbar{height:3px;border-radius:2px;background:rgba(242,237,227,.12);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transform-origin:left;
  transition:transform .95s linear}
.combo{position:absolute;z-index:12;left:50%;top:14px;transform:translateX(-50%);
  font-size:13px;font-weight:500;color:var(--gold);letter-spacing:.01em;font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .2s var(--e)}
.combo.on{opacity:1}
/* ---------- drama ---------- */
.dcard{display:flex;gap:13px;text-decoration:none;color:inherit;padding:11px;border-radius:var(--r-card);
  border:1px solid var(--line-2);background:rgba(242,237,227,.03);transition:border-color .24s var(--e)}
.dcard:hover{border-color:rgba(226,187,106,.42)}
.dcard .ph{width:92px;min-width:92px;aspect-ratio:3/4;border-radius:8px}
.dcard .ph::after{font-size:26px}
.player{position:relative;width:100%;aspect-ratio:9/16;background:#05091a;overflow:hidden}
.player video{width:100%;height:100%;object-fit:cover;display:block}
.unmute{position:absolute;z-index:5;top:12px;right:12px;display:inline-flex;align-items:center;gap:7px;
  min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(8,14,34,.88);
  color:var(--fg);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
  box-shadow:0 8px 22px -8px rgba(0,0,0,.7);transition:background .18s var(--e),border-color .18s var(--e)}
.unmute:hover{background:rgba(226,187,106,.22);border-color:var(--gold)}
.unmute::after{content:"";position:absolute;inset:-4px}
.unmute .ic{width:15px;height:15px;color:var(--gold)}
.epgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ep{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:11px 12px;min-height:66px;border-radius:var(--r-ctl);
  border:1px solid var(--line-2);background:rgba(242,237,227,.035);color:var(--fg);font-family:var(--sans);
  font-size:13px;font-weight:400;text-align:left;cursor:pointer;transition:background .18s var(--e),border-color .18s var(--e)}
.ep:hover{background:rgba(226,187,106,.1);border-color:var(--line)}
.ep.on{border-color:var(--gold);background:rgba(226,187,106,.14)}
.ep .ic{width:13px;height:13px;color:var(--faint)}
.ep em{font-style:normal;font-size:11.5px;color:var(--muted);letter-spacing:0}
.ep.on em{color:var(--gold)}
/* ---------- wardrobe / rewards grid ---------- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;border-radius:var(--r-card);border:1px solid var(--line-2);overflow:hidden;
  background:rgba(242,237,227,.03);text-align:left;color:var(--fg);font-family:var(--sans);cursor:pointer;
  padding:0;display:flex;flex-direction:column;transition:border-color .24s var(--e)}
.item:hover{border-color:rgba(226,187,106,.42)}
.item .ph{aspect-ratio:4/3;width:100%}
.item .ph::after{font-size:28px}
.item.tall .ph{aspect-ratio:3/4}
.item-b{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1 1 auto}
.item-t{font-size:14px;font-weight:500;line-height:1.45}
.item .badge{position:absolute;z-index:4;top:9px;right:9px}
.sw{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:var(--r-ctl);overflow:hidden;
  box-shadow:0 0 0 1px var(--line-2);transition:box-shadow .2s var(--e)}
.sw:hover{box-shadow:0 0 0 1px rgba(226,187,106,.5)}
.sw.on{box-shadow:0 0 0 2px var(--gold)}
.sw .ph{aspect-ratio:1/1}
.sw .ph::after{font-size:20px}
.sw span{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11.5px;font-weight:500;color:var(--fg);
  background:linear-gradient(180deg,rgba(6,12,28,0),rgba(6,12,28,.9))}
/* ---------- 亲密度 bond bar ---------- */
.bond{display:flex;flex-direction:column;gap:6px}
.bond-h{display:flex;align-items:baseline;gap:7px;font-size:12px;letter-spacing:0}
.bond-h b{font-weight:600;font-size:13px;color:var(--gold);letter-spacing:0;font-variant-numeric:tabular-nums}
.bond-h .st{color:var(--fg)}
.bond-h .nm{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.bond-t{height:3px;border-radius:2px;background:rgba(242,237,227,.14);overflow:hidden}
.bond-t i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-d),var(--gold));
  transform-origin:left;transition:transform .62s var(--e2)}
.bond.sm .bond-h{font-size:11.5px}
.bond.sm .bond-h b{font-size:12px}
.bond.sm .bond-t{height:2px}
.bond.onimg .bond-t{background:rgba(6,12,28,.55)}
/* ---------- 话题 chips ---------- */
.chips{flex:0 0 auto;position:relative;z-index:2;display:flex;gap:7px;padding:9px 14px 3px;overflow-x:auto;
  scrollbar-width:none;background:linear-gradient(180deg,rgba(8,14,34,0),rgba(8,14,34,.86))}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(242,237,227,.06);color:var(--fg);font-family:var(--sans);
  font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;
  transition:background .18s var(--e),border-color .18s var(--e)}
.chip:hover{background:rgba(226,187,106,.16);border-color:rgba(226,187,106,.45)}
.chip::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}
.chip .ic{width:13px;height:13px;color:var(--gold)}
.chip.lk{color:var(--muted);border-style:dashed}
.chip.lk .ic{color:var(--muted)}
.chip.lk:hover{background:rgba(242,237,227,.1);border-color:var(--faint);color:var(--fg)}
/* ---------- 礼物 ---------- */
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gift{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;padding:15px 8px 13px;border-radius:var(--r-card);
  border:1px solid var(--line-2);background:rgba(242,237,227,.035);color:var(--fg);font-family:var(--sans);
  font-size:13px;font-weight:500;cursor:pointer;transition:background .18s var(--e),border-color .18s var(--e)}
.gift:hover{background:rgba(226,187,106,.12);border-color:rgba(226,187,106,.45)}
.gift .ic{width:26px;height:26px;color:var(--gold)}
.gift em{font-style:normal;font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
/* ---------- 升级 ---------- */
.lvup{position:relative;border-radius:var(--r-card);overflow:hidden}
.lvup .ph,.rhero .ph{aspect-ratio:16/10}
.rhero{position:relative}
.lvup .cap{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:34px 16px 14px;
  background:linear-gradient(180deg,rgba(6,12,28,0),rgba(6,12,28,.92))}
/* ---------- ledger ---------- */
.lg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.lg:last-child{border-bottom:0}
.lg b{margin-left:auto;font-weight:500;font-size:14.5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.lg b.up{color:#92CD9D}.lg b.dn{color:var(--rose)}
.empty{padding:26px 14px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-card)}
/* ---------- mobile ---------- */
@media (max-width:1099px) and (min-width:501px){
  #phone{max-height:calc(100vh - 160px)}
}
@media (max-width:500px){
  body{display:block;overflow:hidden}
  #bd-brand,#backdrop{display:none}
  #phone{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  #phone::before{display:none}
  #bar{padding-top:max(16px,env(safe-area-inset-top))}
  #tabs{padding-bottom:max(14px,env(safe-area-inset-bottom))}
}

/* ============================================================
   MOTION LAYER · 只动 transform / opacity / filter
   ============================================================ */
/* 1. 列表与卡片错峰进场（backwards：动画结束后交还给 hover 等正常样式） */
.rv{animation:rvUp .42s var(--e3) backwards}
@keyframes rvUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 特效层：所有飞行物、粒子、涟漪都画在这里，不参与布局 */
#fx{position:absolute;inset:0;z-index:65;pointer-events:none;overflow:hidden}
#fx>*{position:absolute;will-change:transform,opacity}
.fly{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  background:rgba(8,14,34,.92);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.fly.gold{color:var(--gold)}
.fly.rose{color:var(--rose);border-color:rgba(240,122,154,.4)}
.spark{width:6px;height:6px;border-radius:50%;background:var(--gold);
  transform:translate(-50%,-50%);animation:sparkGo .74s var(--e3) both}
.spark.r{background:var(--rose)}
.spark.hrt{width:14px;height:14px;background:none;border-radius:0}
.spark.hrt svg{width:14px;height:14px;fill:var(--rose)}
.spark.hrt.g svg{fill:var(--gold)}
@keyframes sparkGo{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(.65)}}
.splash{width:18px;height:18px;border-radius:50%;border:2px solid var(--rose);
  transform:translate(-50%,-50%);animation:splashGo .45s var(--e3) both}
.splash.g{border-color:var(--gold)}
@keyframes splashGo{from{opacity:.9;transform:translate(-50%,-50%) scale(.3)}
  to{opacity:0;transform:translate(-50%,-50%) scale(5)}}
.pop-n{font-size:15px;font-weight:600;color:var(--gold);transform:translate(-50%,-50%);
  font-variant-numeric:tabular-nums;text-shadow:0 2px 10px rgba(0,0,0,.6);
  animation:popUp 1s var(--e3) both}
.pop-n.r{color:var(--rose)}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  30%{transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) translateY(-60px) scale(.95)}}
.ghost-card{border-radius:12px;overflow:hidden;box-shadow:0 14px 34px -12px rgba(0,0,0,.8);
  transform:translate(-50%,-50%);background:var(--navy-3)}
.ghost-card img{display:block;width:100%;height:100%;object-fit:cover}
.flyico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(8,14,34,.94);border:1px solid var(--line);transform:translate(-50%,-50%)}
.flyico .ic{width:17px;height:17px;color:var(--gold)}

/* 13. 按压涟漪 */
.rip{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(226,187,106,.5),rgba(226,187,106,0) 70%);
  transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:ripGo .5s var(--e3) forwards}
@keyframes ripGo{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* 2. 首页主视觉：缓慢 Ken-Burns + 漂浮气泡 + 名字光扫 */
.hero .ph>img,.hero .ph>video{animation:kbHero 11s var(--e3) infinite alternate}
@keyframes kbHero{from{transform:scale(1.015)}to{transform:scale(1.1)}}
.floaters{position:absolute;inset:0;z-index:3;pointer-events:none}
.flo{position:absolute;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:11.5px;font-weight:500;white-space:nowrap;color:var(--fg);
  background:rgba(8,14,34,.82);border:1px solid var(--line);box-shadow:0 8px 20px -10px rgba(0,0,0,.7);
  opacity:0;animation:floUp 3.8s var(--e3) infinite}
.flo .ic{width:12px;height:12px;color:var(--gold)}
.flo.r{color:var(--rose);border-color:rgba(240,122,154,.38)}
.flo.r .ic{color:var(--rose)}
.flo.f1{left:16px;top:120px;animation-delay:.3s}
.flo.f2{right:18px;top:170px;animation-delay:1.5s}
.flo.f3{right:54px;top:238px;padding:6px;animation-delay:2.4s}
.flo.f3 .ic{width:15px;height:15px;fill:var(--rose);stroke:none;color:var(--rose)}
@keyframes floUp{
  0%{opacity:0;transform:translateY(8px) scale(.84)}
  12%{opacity:1;transform:translateY(0) scale(1)}
  62%{opacity:1;transform:translateY(-9px) scale(1)}
  100%{opacity:0;transform:translateY(-16px) scale(.96)}}
.sweep{background:linear-gradient(100deg,var(--fg) 0 40%,#FFF0C8 47%,var(--gold) 53%,var(--fg) 62% 100%);
  background-size:300% 100%;background-position:120% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:nameSweep 6s linear infinite}
@keyframes nameSweep{0%,70%{background-position:120% 0}100%{background-position:-60% 0}}

/* 3. 悬浮陪伴头像 */
#fab{position:absolute;z-index:28;right:16px;bottom:calc(94px + env(safe-area-inset-bottom));
  width:54px;height:54px;border-radius:50%;padding:0;border:1px solid rgba(226,187,106,.5);
  background:var(--navy-3);cursor:pointer;display:none;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.85);animation:bob 2.2s ease-in-out infinite}
#fab.on{display:block}
#fab .ph{width:100%;height:100%;border-radius:50%;overflow:hidden}
#fab .ph::after{font-size:20px}
#fab .dot{position:absolute;z-index:3;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;
  background:#58C98B;border:2px solid #0B1735}
#fab .ring{position:absolute;inset:-1px;border-radius:50%;border:1.5px solid var(--gold);
  animation:ringPulse 2s var(--e3) infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ringPulse{0%{opacity:.85;transform:scale(.95)}100%{opacity:0;transform:scale(1.32)}}
#fab:hover{border-color:var(--gold)}
#fab:active{transform:scale(.94)}

/* 4. 积分芯片脉冲 */
.ptchip.pulse{animation:chipPulse .62s var(--e3)}
@keyframes chipPulse{0%{transform:scale(1)}36%{transform:scale(1.14);border-color:var(--gold)}100%{transform:scale(1)}}

/* 5. 可领取的按钮 / 任务入口 */
.claim{animation:claimPulse 1.6s var(--e3) infinite}
@keyframes claimPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(226,187,106,0))}
  55%{transform:scale(1.035);filter:drop-shadow(0 0 7px rgba(226,187,106,.55))}}
.nudge{animation:nudge 1.9s var(--e3) infinite}
@keyframes nudge{0%,72%,100%{transform:translateX(0)}80%{transform:translateX(3px)}88%{transform:translateX(0)}}
.flip{animation:flipY .42s var(--e3)}
@keyframes flipY{0%{transform:rotateY(0)}50%{transform:rotateY(84deg) scale(.97)}100%{transform:rotateY(0)}}
.chk-draw{stroke-dasharray:26;animation:drawChk .52s var(--e3) both}
@keyframes drawChk{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}

/* 6. 亲密度条扫光 */
.bond-t{position:relative}
.bond-t.swept::after{content:"";position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,240,200,.85),transparent);
  transform:translateX(-100%);animation:barSweep .9s var(--e3) both}
@keyframes barSweep{to{transform:translateX(100%)}}
.lvup .ph{animation:popOver .6s var(--e3) both}
@keyframes popOver{0%{opacity:0;transform:scale(.84)}60%{opacity:1;transform:scale(1.045)}100%{transform:scale(1)}}
.rollN{display:inline-block;height:1.2em;overflow:hidden;vertical-align:-.18em}
.rollN i{display:block;font-style:normal;animation:rollUp .7s var(--e3) .18s both}
@keyframes rollUp{from{transform:translateY(0)}to{transform:translateY(-1.2em)}}

/* 7. 女友卡：当前卡抬起，人像轻微呼吸 */
.gcard.cur{border-color:rgba(226,187,106,.45);transform:translateY(-2px) scale(1.012);
  box-shadow:0 20px 46px -20px rgba(226,187,106,.45)}
.gcard.cur:hover{transform:translateY(-4px) scale(1.012)}
.gcard .ph>img,.dcard .ph>img{animation:swayIdle 7.5s ease-in-out infinite alternate}
@keyframes swayIdle{from{transform:scale(1.01)}to{transform:scale(1.055) translate3d(-1%,-.8%,0)}}

/* 9. 游戏 */
.hbtn{animation:hPop .26s var(--e3) both,hWob 2.6s ease-in-out .26s infinite}
@keyframes hWob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
.combo.hit{animation:comboHit .42s var(--e3)}
@keyframes comboHit{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.3);filter:drop-shadow(0 0 10px rgba(226,187,106,.8))}100%{transform:translateX(-50%) scale(1)}}
.tbar.low i{background:linear-gradient(90deg,var(--rose),#FF9CB4)}
.tbar.low{animation:lowPulse 1s var(--e3) infinite}
@keyframes lowPulse{0%,100%{opacity:1}50%{opacity:.45}}
.gstat .low{color:var(--rose)}
.react.k-hit .av{animation:smileBounce .5s var(--e3)}
.react.k-combo .av{animation:winkTilt .6s var(--e3)}
.react.k-win .av{animation:celebrate .75s var(--e3)}
@keyframes smileBounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-5px) scale(1.08)}}
@keyframes winkTilt{0%,100%{transform:rotate(0) scale(1)}35%{transform:rotate(-6deg) scale(1.06)}70%{transform:rotate(4deg) scale(1.03)}}
@keyframes celebrate{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-9px) rotate(-5deg) scale(1.1)}55%{transform:translateY(0) rotate(5deg)}80%{transform:translateY(-4px) rotate(0)}}
.seq{animation:seqPop .44s var(--e3) backwards}
@keyframes seqPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}

/* 10. 短剧：锁抖动 + 解锁扫光 + 进度条 */
.shake{animation:shakeX .42s var(--e3)}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shimmer::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  background:linear-gradient(104deg,transparent 38%,rgba(255,240,200,.42) 50%,transparent 62%);
  transform:translateX(-110%);animation:shimGo 1.05s var(--e3) both}
@keyframes shimGo{to{transform:translateX(110%)}}
.pprog{position:absolute;z-index:4;left:0;right:0;bottom:0;height:3px;background:rgba(242,237,227,.16);display:block}
.pprog b{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold));
  transform:scaleX(0);transform-origin:left;transition:transform .25s linear}

/* 11. 奖励：飞入收藏 */
.collect{position:absolute;z-index:66;left:50%;top:150px;transform:translateX(-50%) translateY(-14px);
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  background:rgba(8,14,34,.94);border:1px solid var(--line);color:var(--gold);font-size:12.5px;font-weight:500;
  opacity:0;animation:collectIn 2.1s var(--e3) both;pointer-events:none}
.collect .ic{width:14px;height:14px}
@keyframes collectIn{0%{opacity:0;transform:translateX(-50%) translateY(-14px)}
  12%,78%{opacity:1;transform:translateX(-50%) translateY(0)}
  100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
.collect.hitnow{animation:collectIn 2.1s var(--e3) both,collectPop .4s var(--e3) .62s}
@keyframes collectPop{0%,100%{scale:1}45%{scale:1.12}}

/* 12. tab 指示条 + 图标弹跳 */
#tabInd{position:absolute;top:3px;left:0;width:26px;height:2px;border-radius:2px;background:var(--gold);
  opacity:0;transform:translateX(0);transition:transform .36s var(--e3),opacity .2s linear}
#tabs a.on .ic{animation:tabPop .44s var(--e3)}
@keyframes tabPop{0%{transform:scale(1)}40%{transform:scale(1.18)}70%{transform:scale(.96)}100%{transform:scale(1)}}

/* 规则：降级时关掉所有循环与装饰粒子，状态仍然瞬时可见 */

/* ============================================================
   BRAND V5 · 宝蓝 + 电光蓝 + 金（后置覆盖，同权重后来者胜）
   ============================================================ */
#backdrop{background:
  radial-gradient(60rem 42rem at 16% 8%,rgba(47,107,255,.5) 0%,rgba(47,107,255,0) 62%),
  radial-gradient(52rem 40rem at 88% 86%,rgba(120,70,240,.38) 0%,rgba(120,70,240,0) 60%),
  radial-gradient(40rem 30rem at 72% 12%,rgba(242,194,91,.16) 0%,rgba(242,194,91,0) 60%),
  linear-gradient(165deg,#0A1E6B 0%,#07154A 52%,#040C2C 100%)}
#bd-rule{background:linear-gradient(90deg,var(--gold-1),var(--gold-3))}
#phone{background:var(--bg-1);
  box-shadow:0 0 0 1px var(--blue-hi),0 0 0 9px #061236,0 0 0 10px rgba(58,123,255,.55),
    0 0 42px rgba(47,107,255,.45),0 50px 90px -20px rgba(0,0,0,.85)}
.app{background:
  radial-gradient(130% 56% at 50% -8%,rgba(47,107,255,.34) 0%,rgba(47,107,255,0) 70%),
  radial-gradient(90% 40% at 108% 72%,rgba(122,69,240,.22) 0%,rgba(122,69,240,0) 70%),
  linear-gradient(180deg,#0A1E6B 0%,#07154A 46%,#061034 100%)}
#bar.ghost{background:linear-gradient(180deg,rgba(5,14,45,.86),rgba(5,14,45,0))}

/* 金色渐变标题 */
.gg{background:linear-gradient(100deg,var(--gold-1) 0%,var(--gold-2) 44%,var(--gold-3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.h1{font-weight:700;font-size:25px;line-height:1.4}
.h2{font-weight:700;font-size:17px}
.h3{font-weight:600;font-size:15px}
.sec-h .h2{letter-spacing:0}

/* 卡片 / 面板：玻璃宝蓝 + 蓝边光 */
.panel,.card{background:var(--card);border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 10px 30px -14px rgba(0,0,0,.7)}
.panel{border-radius:var(--r-panel)}
.lrow{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-card)}
.lrow:hover{background:rgba(47,107,255,.26);border-color:var(--line)}
.lrow .ic{color:var(--blue-hi)}
.row{border-bottom:1px solid rgba(120,160,255,.16)}

/* 按钮 */
.btn-pri{background:linear-gradient(180deg,var(--blue-btn) 0%,var(--blue-btn-2) 100%);color:#fff;font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.34) inset,0 8px 20px -8px rgba(47,107,255,.9)}
.btn-pri:hover{background:linear-gradient(180deg,#3F76FF 0%,#1F3FD2 100%);color:#fff}
.btn-gold{background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 48%,var(--gold-3) 100%);
  color:#0A1A4E;font-weight:700;border:0;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 20px -8px rgba(242,194,91,.75)}
.btn-gold:hover{background:linear-gradient(180deg,#FFF0C2 0%,#FFD277 48%,#D9972F 100%);color:#08143C}
.btn-gh{border-color:var(--line);color:var(--fg)}
.btn-gh:hover{background:rgba(47,107,255,.26);border-color:var(--blue-hi);color:#fff}
.btn-go{color:var(--gold-2);border-color:rgba(242,194,91,.55)}
.btn-go:hover{background:rgba(242,194,91,.2);color:#FFE2A4;border-color:var(--gold-2)}
.btn-qt{background:rgba(47,107,255,.16);border-color:var(--line-2)}
.btn-qt:hover{background:rgba(47,107,255,.3)}
.tbtn{color:var(--gold-2)}
.tbtn:hover{border-bottom-color:var(--gold-2)}
.gold{color:var(--gold-2)}

/* 药丸 */
.pill{background:rgba(47,107,255,.2);border-color:var(--line-2);color:var(--muted)}
.pill.g{border-color:rgba(242,194,91,.5);color:var(--gold-2);background:rgba(242,194,91,.14)}
.pill.r{border-color:rgba(255,110,156,.5);color:var(--rose);background:rgba(255,110,156,.14)}
.pill.ok{border-color:rgba(74,222,160,.5);color:#5BE3B0;background:rgba(74,222,160,.14)}
.pill.tbd{border-style:dashed;border-color:rgba(206,220,255,.4);color:var(--faint);background:none}
.pill.badge{background:rgba(5,14,45,.88);box-shadow:0 4px 14px -4px rgba(0,0,0,.6)}

/* 积分芯片 */
.ptchip{border-color:rgba(242,194,91,.5);background:rgba(10,26,92,.72);color:var(--gold-2)}

/* ---------- 3D 光泽图标（PNG 优先，CSS 玻璃砖兜底） ---------- */
.i3{position:relative;display:inline-grid;place-items:center;width:var(--s,44px);height:var(--s,44px);flex:0 0 auto}
.i3 img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.i3-fb{display:none}
.i3.fb .i3-fb{display:grid;place-items:center;width:100%;height:100%;border-radius:26%;
  background:linear-gradient(165deg,var(--c1,#4D86FF) 0%,var(--c2,#1A44D6) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -6px 12px -6px rgba(0,0,0,.5) inset,
    0 6px 14px -6px rgba(0,0,0,.6)}
.i3.fb .i3-fb::before{content:"";position:absolute;left:12%;right:12%;top:8%;height:34%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.i3-fb svg{width:52%;height:52%;fill:#fff;stroke:none;position:relative;z-index:1;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.i3-coin .i3-fb,.i3-crown .i3-fb{--c1:#FFE59A;--c2:#C98A2B}
.i3-coin .i3-fb svg,.i3-crown .i3-fb svg{fill:#6B4410}
.i3-coin .i3-fb,.i3-gift .i3-fb{border-radius:50%}
.i3-gift .i3-fb{--c1:#FF7FB0;--c2:#D62E73}
.i3-game .i3-fb{--c1:#9A6BFF;--c2:#5329C8}
.i3-drama .i3-fb{--c1:#FFA468;--c2:#C9552A}
.i3-share .i3-fb{--c1:#4D86FF;--c2:#1736BE}
.i3-checkin .i3-fb{--c1:#5FA0FF;--c2:#1E50FF}
.i3-chat-role .i3-fb{--c1:#4D86FF;--c2:#1A44D6}

/* ---------- 今日打卡 7 日条 ---------- */
.ckwrap{position:relative;z-index:6;margin:-54px 14px 0;padding:13px 13px 15px;border-radius:var(--r-panel);
  background:linear-gradient(180deg,rgba(10,26,92,.9),rgba(7,18,62,.96));
  border:1px solid var(--line);box-shadow:0 14px 34px -14px rgba(0,0,0,.8),0 0 24px -12px var(--glow)}
.ckwrap h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.ckdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}
.ckday{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;
  cursor:default;font-family:var(--sans)}
.ckday i{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1/1;border-radius:9px;
  background:linear-gradient(180deg,rgba(47,107,255,.2),rgba(20,48,111,.6));
  border:1px solid rgba(120,160,255,.26);transition:transform .2s var(--e3),box-shadow .2s var(--e3)}
.ckday i svg{width:56%;height:56%;stroke:rgba(206,220,255,.5);fill:none;stroke-width:2.4}
.ckday.on i{background:linear-gradient(180deg,#4D86FF,#1A44D6);border-color:rgba(255,255,255,.3);
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 5px 12px -5px rgba(47,107,255,.95)}
.ckday.on i svg{stroke:#fff;stroke-width:3}
.ckday.gift i{background:linear-gradient(180deg,#FF7FB0,#D62E73);border-color:rgba(255,255,255,.3);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 5px 12px -5px rgba(255,77,141,.9)}
.ckday.gift i svg{stroke:#fff;fill:none;stroke-width:2.6}
.ckday.today i{border-color:var(--gold-2);box-shadow:0 0 0 2px rgba(242,194,91,.35),0 6px 16px -6px rgba(242,194,91,.8)}
.ckday.act{cursor:pointer}
.ckday.act::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;transform:translateY(-50%);height:44px}
.ckday{position:relative}
.ckday.act:active i{transform:scale(.93)}
.ckday b{font-size:10.5px;font-weight:500;color:var(--faint);letter-spacing:0}
.ckday.on b,.ckday.gift b{color:var(--fg)}
.ckbar{display:flex;align-items:center;gap:10px;margin-top:12px}

/* ---------- 彩色快捷大块 ---------- */
.qtiles{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:9px}
.qt{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  min-height:108px;padding:12px;border-radius:var(--r-card);text-decoration:none;color:#fff;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 10px 24px -12px rgba(0,0,0,.75);
  transition:transform .22s var(--e3),box-shadow .22s var(--e3)}
.qt::after{content:"";position:absolute;left:0;right:0;top:0;height:44%;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0));pointer-events:none}
/* 文字永远压在深端上，白字对比度不随渐变位置漂移 */
.qt::before{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(180deg,rgba(6,16,52,0),rgba(6,16,52,.52));pointer-events:none}
.qt:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.34) inset,0 16px 30px -12px rgba(0,0,0,.8)}
.qt span{font-size:14px;font-weight:700;position:relative;z-index:2}
.qt em{font-style:normal;font-size:11px;font-weight:400;color:rgba(255,255,255,.82);position:relative;z-index:2}
.qt .i3{position:relative;z-index:2}
.qt-blue{background:linear-gradient(160deg,#4D86FF 0%,#1A44D6 100%)}
.qt-purple{background:linear-gradient(160deg,var(--purple-1) 0%,var(--purple-2) 100%)}
.qt-orange{background:linear-gradient(160deg,var(--orange-1) 0%,#A8431F 100%)}

/* ---------- 会员中心行 ---------- */
.vip{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;border-radius:var(--r-card);
  text-decoration:none;color:#fff;font-family:var(--sans);cursor:pointer;
  background:linear-gradient(100deg,rgba(242,194,91,.22) 0%,rgba(16,36,110,.8) 58%);
  border:1px solid rgba(242,194,91,.45);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 10px 24px -14px rgba(0,0,0,.7);
  transition:background .22s var(--e3)}
.vip:hover{background:linear-gradient(100deg,rgba(242,194,91,.34) 0%,rgba(22,46,130,.85) 58%)}
.vip b{font-size:15px;font-weight:700}
.vip .cv{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--gold-2);font-size:12.5px}

/* ---------- 海报卡 ---------- */
.posters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.poster{position:relative;display:block;border-radius:var(--r-card);overflow:hidden;text-decoration:none;color:#fff;
  border:1px solid var(--line-2);transition:transform .22s var(--e3),border-color .22s var(--e3)}
.poster:hover{transform:translateY(-2px);border-color:var(--blue-hi)}
.poster .ph{aspect-ratio:3/4}
.poster .cap{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:22px 8px 8px;
  background:linear-gradient(180deg,rgba(5,14,45,0),rgba(5,14,45,.92));
  font-size:12px;font-weight:600;text-align:center}
.poster .pbadge{position:absolute;z-index:4;right:7px;top:7px;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;background:rgba(5,14,45,.78);border:1px solid rgba(255,255,255,.26)}
.poster .pbadge svg{width:11px;height:11px;fill:#fff;stroke:none}

/* ---------- 三大动作块（剧集详情） ---------- */
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.act3{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;min-height:106px;padding:14px 6px;border-radius:var(--r-card);cursor:pointer;color:#fff;
  font-family:var(--sans);font-size:13.5px;font-weight:700;text-decoration:none;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 10px 24px -12px rgba(0,0,0,.75);
  transition:transform .2s var(--e3)}
.act3::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
.act3:active{transform:scale(.97)}
.act3 .i3{position:relative;z-index:2}
.act3 span{position:relative;z-index:2}
.a3-gold{background:linear-gradient(170deg,#16307C 0%,#0A1A52 100%);border-color:rgba(242,194,91,.6)}
.a3-blue{background:linear-gradient(170deg,#4D86FF 0%,#1A44D6 100%)}
.a3-deep{background:linear-gradient(170deg,#3B6DE8 0%,#132C93 100%)}

/* ---------- 分享面板 ---------- */
.shrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shbtn{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 6px;border-radius:var(--r-card);
  background:rgba(47,107,255,.14);border:1px solid var(--line-2);color:#fff;font-family:var(--sans);
  font-size:12.5px;font-weight:600;cursor:pointer;transition:background .2s var(--e3),border-color .2s var(--e3)}
.shbtn:hover{background:rgba(47,107,255,.3);border-color:var(--blue-hi)}
.shbtn i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 8px 18px -8px rgba(0,0,0,.7)}
.shbtn i svg{width:24px;height:24px;fill:#fff;stroke:none}
.sh-wa i{background:linear-gradient(170deg,#4AE07A,#1EA94C)}
.sh-tg i{background:linear-gradient(170deg,#45B6F2,#1E86C8)}
.sh-cp i{background:linear-gradient(170deg,#6E85B8,#38507F)}

/* ---------- 我的积分 ---------- */
.ptcard{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:17px;
  border-radius:var(--r-panel);
  background:linear-gradient(118deg,rgba(242,194,91,.3) 0%,rgba(20,48,111,.9) 52%,rgba(10,26,92,.95) 100%);
  border:1px solid rgba(242,194,91,.5);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 14px 34px -16px rgba(0,0,0,.8)}
.ptcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(104deg,transparent 38%,rgba(255,240,200,.3) 50%,transparent 62%);
  transform:translateX(-120%);animation:shineX 5.5s var(--e3) infinite}
@keyframes shineX{0%,72%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.ptcard .n{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;
  font-variant-numeric:tabular-nums}
.lgrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(120,160,255,.16)}
.lgrow:last-child{border-bottom:0}
.lgrow .tile{display:grid;place-items:center;width:34px;height:34px;min-width:34px;border-radius:10px;
  background:linear-gradient(170deg,rgba(77,134,255,.4),rgba(26,68,214,.5));
  border:1px solid var(--line-2)}
.lgrow .tile svg{width:16px;height:16px;color:#BFD4FF}
.epthumb{width:52px;min-width:52px;height:52px;border-radius:10px;overflow:hidden;display:block}
.epthumb .ph{width:100%;height:100%}
.unlocked{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.uthumb{position:relative;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line-2)}
.uthumb .ph{aspect-ratio:3/4}
.uthumb .tag{position:absolute;z-index:4;left:6px;top:6px;padding:2px 7px;border-radius:999px;
  font-size:10px;font-weight:600;background:rgba(5,14,45,.86);border:1px solid rgba(242,194,91,.5);color:var(--gold-2)}
.uthumb .cap{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:18px 7px 7px;font-size:11px;font-weight:500;
  background:linear-gradient(180deg,rgba(5,14,45,0),rgba(5,14,45,.92))}

/* ---------- 角色详情（brand-03） ---------- */
.agechip{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:2px 9px;border-radius:999px;
  font-size:12.5px;font-weight:600;vertical-align:3px;
  background:linear-gradient(180deg,rgba(255,110,156,.3),rgba(214,46,115,.36));
  border:1px solid rgba(255,110,156,.55);color:#FFD2E0}
.ichips{display:flex;flex-wrap:wrap;gap:7px}
.ichip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:linear-gradient(180deg,rgba(77,134,255,.34),rgba(26,68,214,.34));
  border:1px solid rgba(120,160,255,.42);color:#DCE7FF}

/* ---------- 剧集网格 / 标签页 ---------- */
.tabs2{display:flex;gap:7px;padding:4px;border-radius:999px;background:rgba(10,24,78,.78);
  border:1px solid var(--line-2)}
.tabs2 button{position:relative;flex:1;min-height:38px;border:0;border-radius:999px;background:none;color:var(--muted);
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background .2s var(--e3),color .2s var(--e3)}
.tabs2 button.on{background:linear-gradient(180deg,var(--blue-btn),var(--blue-btn-2));color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset}
.tabs2 button:hover{color:#fff}
.tabs2 button::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}
.ep{background:rgba(16,36,110,.6);border-color:var(--line-2)}
.ep:hover{background:rgba(47,107,255,.3);border-color:var(--blue-hi)}
.ep.on{border-color:var(--gold-2);background:rgba(242,194,91,.18)}
.ep .ic{color:#9FBCFF}
.ep.on .ic{color:var(--gold-2)}

/* ---------- tab bar ---------- */
#tabs{background:linear-gradient(180deg,rgba(5,14,45,.5),rgba(4,11,36,.97));border-top:1px solid var(--line)}
#tabs a.on{color:var(--blue-hi)}
#tabInd{background:linear-gradient(90deg,var(--gold-1),var(--gold-3));
  box-shadow:0 0 10px rgba(242,194,91,.85)}
#fab{background:var(--navy-3);border-color:var(--blue-hi);
  box-shadow:0 0 18px -2px var(--glow),0 14px 30px -12px rgba(0,0,0,.85)}
#fab .ring{border-color:var(--blue-hi)}
#fab .dot{background:#4AE07A;border-color:#07154A}

/* ---------- 聊天 ---------- */
.msg.her{background:rgba(16,38,116,.94);border-color:rgba(120,160,255,.3)}
.msg.me{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#0A1A4E}
.typing{background:rgba(16,38,116,.94);border-color:rgba(120,160,255,.3)}
.chat-in{background:rgba(5,14,45,.9);border-top-color:var(--line-2)}
.chat-in textarea{background:rgba(47,107,255,.14);border-color:var(--line-2)}
.chat-in textarea:focus{border-color:var(--blue-hi);box-shadow:0 0 0 3px rgba(47,107,255,.26)}
.send{background:linear-gradient(180deg,var(--blue-btn),var(--blue-btn-2));color:#fff}
.send:hover{background:linear-gradient(180deg,#3F76FF,#1F3FD2)}
.chip{background:rgba(47,107,255,.2);border-color:var(--line-2)}
.chip:hover{background:rgba(47,107,255,.36);border-color:var(--blue-hi)}
.chip .ic{color:var(--blue-hi)}

/* ---------- 其它 ---------- */
.bond-t i{background:linear-gradient(90deg,var(--gold-3),var(--gold-1))}
.bond-h b{color:var(--gold-2)}
.tbar i{background:linear-gradient(90deg,var(--blue-hi),var(--gold-2))}
.arena{background:radial-gradient(70% 60% at 50% 18%,rgba(47,107,255,.26),rgba(7,21,74,0) 70%),
  linear-gradient(170deg,#0B2272,#071546);border-color:var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--gold-2)}
.item:hover,.gcard:hover{border-color:var(--blue-hi)}
.gcard.cur{border-color:rgba(242,194,91,.6);box-shadow:0 20px 46px -20px rgba(242,194,91,.5)}
#sheet{background:linear-gradient(180deg,#0C2378 0%,#071546 100%);border-top:1px solid var(--line);
  box-shadow:0 -20px 50px -18px rgba(0,0,0,.85),0 0 40px -16px var(--glow)}
.tst{background:rgba(7,21,74,.96);border-color:var(--line)}
.tst .ic{color:var(--gold-2)}
.tst-r b{color:var(--gold-2)}
.ph{background:linear-gradient(145deg,#14306F 0%,#0A1A5C 55%,#1B2A72 100%)}
.ph::after{color:rgba(242,194,91,.34)}
.scrim{background:linear-gradient(180deg,rgba(5,14,45,0) 30%,rgba(5,14,45,.5) 62%,rgba(5,14,45,.94) 100%)}
.empty{border-color:var(--line-2)}
.flo{background:rgba(7,21,74,.88);border-color:var(--line)}
.flo .ic{color:var(--blue-hi)}
.fly{background:rgba(7,21,74,.94);border-color:var(--line)}
.fly.gold{color:var(--gold-2)}
.spark{background:var(--gold-2)}
.splash{border-color:var(--rose)}
.splash.g{border-color:var(--gold-2)}
.pop-n{color:var(--gold-2)}
.collect{background:rgba(7,21,74,.96);border-color:rgba(242,194,91,.5);color:var(--gold-2)}
.rip{background:radial-gradient(circle,rgba(160,200,255,.55),rgba(160,200,255,0) 70%)}
.unmute{background:rgba(7,21,74,.9);border-color:var(--line)}
.unmute .ic{color:var(--blue-hi)}
.pprog b{background:linear-gradient(90deg,var(--blue-hi),var(--gold-2))}
.claim{animation:claimPulse 1.6s var(--e3) infinite}
@keyframes claimPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(47,107,255,0))}
  55%{transform:scale(1.035);filter:drop-shadow(0 0 9px rgba(47,107,255,.85))}}
.btn-pri.claim,.btn-gold.claim{animation:neonPulse 1.8s var(--e3) infinite}
@keyframes neonPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(58,123,255,0))}
  55%{filter:drop-shadow(0 0 12px rgba(58,123,255,.9))}}
.sweep{background:linear-gradient(100deg,#fff 0 40%,var(--gold-1) 47%,var(--gold-2) 53%,#fff 62% 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
@media (prefers-reduced-motion:reduce){ .ptcard::after{display:none} }

/* ============================================================
   V6 · 对齐 slide 截图：紧凑、浓烈、字重更重
   ============================================================ */
#bar{padding:26px 16px 8px;min-height:60px;gap:10px}
#bar.ghost{background:linear-gradient(180deg,rgba(5,14,45,.72),rgba(5,14,45,0))}
.ptchip{height:30px;font-size:12.5px}

/* 主视觉压到 ~40% 屏高，整屏信息必须在首屏内 */
.hero{border-radius:0}
.hero .ph{aspect-ratio:auto;height:clamp(258px,40vh,340px);width:100%}
.hero .ph>img{--pos:50% 26%}

/* 名字 / 等级压在照片左上角，小而不占版面 */
.heroTag{position:absolute;z-index:4;right:14px;top:66px;display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px 5px 6px;border-radius:999px;text-decoration:none;color:#fff;
  background:rgba(5,14,45,.6);border:1px solid rgba(140,180,255,.3);backdrop-filter:blur(8px)}
.heroTag .av-s{width:24px;height:24px;min-width:24px}
.av-s img,.av img,#fab .ph img{transform:scale(1.7);transform-origin:50% 24%}
.heroTag .av-s .ph,.heroTag .av-s img{position:static;width:100%!important;height:100%!important;inset:auto;
  object-fit:cover;object-position:50% 20%!important;animation:none!important;transform:scale(1.7)!important}
.heroTag b{font-size:13px;font-weight:700}
.heroTag span{font-size:11.5px;font-weight:600;color:var(--gold-2)}

/* 今日打卡：直接压在照片底部，不另起卡片 */
.ckover{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:34px 14px 13px;
  background:linear-gradient(180deg,rgba(5,14,45,0) 0%,rgba(6,18,58,.86) 46%,rgba(6,18,58,.97) 100%)}
.ckover .ckhead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ckover .ckhead h3{font-size:19px;font-weight:700;letter-spacing:0;
  text-shadow:0 2px 10px rgba(0,0,0,.6)}
.ckover .ckhead .pill{margin-left:auto}
.ckdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0}
.ckday{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;
  padding:0;cursor:default;font-family:var(--sans)}
.ckday i{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1/1;border-radius:9px;
  background:linear-gradient(180deg,#2F6BFF 0%,#1C47D8 100%);
  border:1px solid rgba(255,255,255,.34);opacity:.45;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 4px 10px -5px rgba(0,0,0,.6);
  transition:transform .2s var(--e3),opacity .2s var(--e3)}
.ckday i svg{width:58%;height:58%;stroke:#fff;fill:none;stroke-width:3.4;opacity:0}
.ckday.on i{opacity:1;box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 5px 13px -5px rgba(47,107,255,.95)}
.ckday.on i svg{opacity:1}
.ckday.gift i{opacity:1;background:linear-gradient(180deg,#FF6FA8 0%,#D62E73 100%)}
.ckday.gift i svg{opacity:1;stroke-width:2.4;width:62%;height:62%}
.ckday.today i{opacity:1;border-color:var(--gold-2);animation:ckToday 1.7s var(--e3) infinite}
@keyframes ckToday{0%,100%{box-shadow:0 0 0 0 rgba(242,194,91,.9),0 1px 0 rgba(255,255,255,.5) inset}
  55%{box-shadow:0 0 0 3px rgba(242,194,91,.28),0 1px 0 rgba(255,255,255,.5) inset}}
.ckday.act{cursor:pointer}
.ckday.act::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;transform:translateY(-50%);height:44px}
.ckday.act:active i{transform:scale(.92)}
.ckday b{font-size:10px;font-weight:600;color:rgba(214,228,255,.82);letter-spacing:0;white-space:nowrap}
.ckday.on b,.ckday.gift b,.ckday.today b{color:#fff}

/* 彩色快捷块：等宽、图标居中、标题居中、无副标题 */
.qtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qt{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;min-height:92px;padding:12px 6px;border-radius:18px;text-decoration:none;color:#fff;
  border:1px solid rgba(255,255,255,.22)}
.qt::before{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(180deg,rgba(6,16,52,0),rgba(6,16,52,.46));pointer-events:none}
.qt::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.qt span{font-size:14.5px;font-weight:700;position:relative;z-index:2;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.qt em{display:none}
.qt-blue{background:linear-gradient(165deg,#3D7BFF 0%,#1B3FCB 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.32) inset,0 10px 26px -12px rgba(61,123,255,.95)}
.qt-purple{background:linear-gradient(165deg,#8A52FF 0%,#5A2BD0 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.32) inset,0 10px 26px -12px rgba(138,82,255,.95)}
.qt-orange{background:linear-gradient(165deg,#FF9A55 0%,#B9491D 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.32) inset,0 10px 26px -12px rgba(255,154,85,.85)}

/* 会员中心 */
.vip{padding:12px 15px;border-radius:16px}
.vip b{font-size:16px;font-weight:700}
.vip .sm{display:none}

/* 区块标题更重 */
.sec{margin-top:16px}
.sec-h{margin-bottom:10px}
.sec-h .h2{font-size:17.5px;font-weight:700}

/* 热门内容推荐：横向滑动的三张半 */
.pscroll{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;
  margin:0 -14px;padding:0 14px 2px;scroll-snap-type:x mandatory}
.pscroll::-webkit-scrollbar{display:none}
.pscroll .poster{flex:0 0 31.5%;scroll-snap-align:start}
.poster .ph{aspect-ratio:3/4}
.poster .cap{padding:20px 8px 8px;font-size:12.5px;font-weight:700;text-align:left}
.poster .pbadge{right:6px;bottom:6px;top:auto;width:26px;height:26px;
  background:linear-gradient(180deg,rgba(47,107,255,.95),rgba(26,68,214,.95));border-color:rgba(255,255,255,.4)}

/* ---------- 小游戏大厅 ---------- */
.ghub{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.gcardx{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:152px;padding:13px;border-radius:18px;text-decoration:none;color:#fff;text-align:left;
  font-family:var(--sans);cursor:pointer;border:1px solid rgba(255,255,255,.2);
  box-shadow:0 1px 0 rgba(255,255,255,.26) inset,0 12px 28px -14px rgba(0,0,0,.8);
  transition:transform .22s var(--e3)}
.gcardx .ph{position:absolute;inset:0;z-index:0}
.gcardx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:74%;z-index:1;
  background:linear-gradient(180deg,rgba(6,16,52,0),rgba(6,16,52,.58) 42%,rgba(6,16,52,.9));pointer-events:none}
.gcardx:hover{transform:translateY(-2px)}
.gcardx .i3{position:absolute;top:12px;right:12px;z-index:2}
.gcardx b{position:relative;z-index:2;font-size:15.5px;font-weight:700;
  text-shadow:0 2px 8px rgba(0,0,0,.6)}
.gcardx em{position:relative;z-index:2;font-style:normal;font-size:11.5px;font-weight:500;
  color:rgba(255,255,255,.88);margin-top:3px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.gcardx .pill{position:relative;z-index:2;margin-top:8px;align-self:flex-start;font-size:10.5px;height:22px;padding:0 8px}
.gx-1{background:linear-gradient(160deg,#FF5E8A 0%,#B81E52 100%)}
.gx-2{background:linear-gradient(160deg,#3D7BFF 0%,#1B3FCB 100%)}
.gx-3{background:linear-gradient(160deg,#8A52FF 0%,#5A2BD0 100%)}
.gx-4{background:linear-gradient(160deg,#FF9A55 0%,#B9491D 100%)}

/* 默契问答 */
.qprog{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.qprog i{width:26px;height:4px;border-radius:2px;background:rgba(140,180,255,.26)}
.qprog i.on{background:linear-gradient(90deg,var(--gold-1),var(--gold-3))}
.qprog i.cur{background:var(--blue-hi)}
.qopt{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:9px;border-radius:14px;
  background:rgba(16,36,110,.7);border:1px solid var(--line-2);cursor:pointer;color:#fff;
  font-family:var(--sans);font-size:14.5px;font-weight:600;text-align:left;
  transition:border-color .2s var(--e3),background .2s var(--e3)}
.qopt:hover{border-color:var(--blue-hi);background:rgba(47,107,255,.26)}
.qopt .ph{width:68px;min-width:68px;height:50px;border-radius:10px;overflow:hidden}
.qopt .mark{margin-left:auto;width:24px;height:24px;min-width:24px;border-radius:50%;
  border:2px solid rgba(160,195,255,.5);display:grid;place-items:center}
.qopt .mark svg{width:13px;height:13px;stroke:#0A1A4E;fill:none;stroke-width:3.4;opacity:0}
.qopt.sel{border-color:var(--gold-2);background:rgba(242,194,91,.18)}
.qopt.sel .mark{background:linear-gradient(180deg,var(--gold-1),var(--gold-3));border-color:var(--gold-1)}
.qopt.sel .mark svg{opacity:1}
.qopt.right{border-color:#4AE07A;background:rgba(74,224,122,.18)}
.qopt.right .mark{background:#4AE07A;border-color:#8BF0AE}
.qopt.right .mark svg{opacity:1;stroke:#06351A}
.qopt.wrong{border-color:var(--rose);background:rgba(255,110,156,.16)}
.qopt[disabled]{cursor:default}

/* 记忆翻翻乐 */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{position:relative;aspect-ratio:3/4;border:0;background:none;padding:0;cursor:pointer;
  perspective:700px;border-radius:12px}
.mcard .face{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;
  transition:transform .42s var(--e3);display:grid;place-items:center}
.mcard .back{transform:rotateY(0deg);background:linear-gradient(165deg,#2A5BE8 0%,#12277E 100%);
  border:1px solid rgba(140,180,255,.4);
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 6px 14px -6px rgba(0,0,0,.6)}
.mcard .back svg{width:46%;height:46%;fill:var(--gold-2);stroke:none;opacity:.92}
.mcard .front{transform:rotateY(180deg);background:#0C1F63;border:1px solid var(--line-2)}
.mcard .front .ph{width:100%;height:100%}
.mcard .front .ic3{width:52%;height:52%;fill:var(--gold-2);stroke:none}
.mcard.flip .back{transform:rotateY(-180deg)}
.mcard.flip .front{transform:rotateY(0deg)}
.mcard.done .front{border-color:var(--gold-2);box-shadow:0 0 0 2px rgba(242,194,91,.5)}
.mcard.done{animation:mDone .5s var(--e3)}
@keyframes mDone{0%,100%{transform:scale(1)}45%{transform:scale(1.07)}}

/* 接住礼物 */
.cstage{position:relative;height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(70% 55% at 50% 0%,rgba(47,107,255,.3),rgba(7,21,74,0) 70%),
    linear-gradient(180deg,#0B2272,#071546);touch-action:none;user-select:none}
.falling{position:absolute;width:34px;height:34px;display:grid;place-items:center;pointer-events:none;
  will-change:transform}
.falling svg{width:100%;height:100%}
.basket{position:absolute;bottom:8px;width:76px;height:40px;pointer-events:none;will-change:transform}
.basket .bk{width:100%;height:100%;border-radius:8px 8px 18px 18px;
  background:linear-gradient(180deg,#FFE59A,#C98A2B);border:1px solid rgba(255,255,255,.5);
  box-shadow:0 1px 0 rgba(255,255,255,.65) inset,0 6px 14px -6px rgba(242,194,91,.9)}
.chint{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:12px;font-weight:600;
  color:rgba(214,228,255,.78);pointer-events:none}

/* 结算页 */
.rhero .ph{aspect-ratio:16/10}
@media (prefers-reduced-motion:reduce){
  .ckday.today i,.gcardx{animation:none !important}
  .flo,#fab .ring,#fx>*{display:none !important}
  #fab{animation:none !important}
  .sweep{background:none;color:inherit;-webkit-text-fill-color:currentColor}
  .hero .ph>img,.hero .ph>video,.gcard .ph>img,.dcard .ph>img,.hbtn{animation:none !important}
  .claim,.nudge,.tbar.low{animation:none !important}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

const KEY = "mba66.demo.v1";
const today = () => new Date().toISOString().slice(0,10);

function fresh(){
  return {
    pts:0, day:today(), checkedIn:false, rounds:0, invited:0,
    girl:"sweet", bg:"cafe", outfit:{}, nick:"演示用户",
    owned:{ bg:["cafe"], act:[], outfit:[], outfitC:[], vid:[] },

    chats:{}, ledger:[], coached:false, booted:false,
    xp:{ sweet:80, queen:0, cool:0 },   // 演示起点：小糖差一步到 Lv.2
    chatXp:[], epXp:[], coachXp:false
  };
}
let S = load();
function load(){
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){ s = null; }
  if(!s || typeof s !== "object"){ s = fresh(); }
  else { const f = fresh(); for(const k in f) if(!(k in s)) s[k] = f[k]; }
  if(s.day !== today()){
    s.day = today(); s.checkedIn = false; s.rounds = 0; s.invited = 0;
    s.chatXp = [];
    s.tasks = { checkin:false, game:false, drama:false, share:false, gift:false };
  }
  if(!s.owned.outfitC) s.owned.outfitC = [];
  if(!s.booted){
    s.booted = true; s.pts = RULES.signup;
    s.ledger = [{ t:Date.now(), label:"首次注册奖励", d:RULES.signup }];
    s.owned.vid = ["sweet"];
  }
  return s;
}

/* ---------- 积分 + 亲密经验 ---------- */
function bondOf(gid){
  const xp = S.xp[gid] || 0;
  let i = 0;
  for(let k = 0; k < LEVELS.length; k++) if(xp >= LEVELS[k].at) i = k;
  const cur = LEVELS[i], nxt = LEVELS[i + 1];
  return { lv:cur.lv, name:cur.name, unlock:cur.unlock, xp, max:!nxt,
    next: nxt ? nxt.at : cur.at,
    pct: nxt ? Math.min(1, (xp - cur.at) / (nxt.at - cur.at)) : 1 };
}
const lvOf = gid => bondOf(gid).lv;

/* 一次发放：积分进流水，亲密按角色累积，合并成一条 toast */
function reward(label, pts, xp, gid){
  const g = girl(gid);
  if(pts){
    S.pts = Math.max(0, S.pts + pts);
    S.ledger.unshift({ t:Date.now(), label, d:pts });
    if(S.ledger.length > 60) S.ledger.length = 60;
  }
  let up = null;
  if(xp){
    const before = lvOf(g.id);
    S.xp[g.id] = (S.xp[g.id] || 0) + xp;
    if(lvOf(g.id) > before) up = LEVELS[lvOf(g.id) - 1];
  }
  save(); bumpChips(); bumpBonds();
  flyReward(pts, xp);
  rewardToast(label, pts, xp, g);
  if(up) setTimeout(() => levelSheet(g, up), 820);
  return up;
}
const addPts = (n, label) => reward(label, n, 0);

function bumpChips(){
  $$("[data-pts]").forEach(el => {
    const from = parseInt(el.textContent.replace(/\D/g,""), 10) || 0;
    countTo(el, from, S.pts);
  });
}
function countTo(el, from, to){
  if(from === to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 620;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if(k < 1) requestAnimationFrame(step);
  })(performance.now());
}
function toast(msg, icon="i-check"){
  const box = $("#toast");
  const d = document.createElement("div");
  d.className = "tst";
  d.innerHTML = `${ico(icon)}<span>${esc(msg)}</span>`;
  box.appendChild(d);
  setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 320); }, 2300);
}
