  setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 320); }, 2500);
}


/* ============================================================
   动效引擎 · 只写 transform / opacity，不碰布局
   ============================================================ */
const RMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
const rm = () => RMQ.matches;
const HRT = `<svg viewBox="0 0 24 24"><path d="M12 21S3 15.3 3 9.3A4.9 4.9 0 0 1 12 6.5a4.9 4.9 0 0 1 9 2.8C21 15.3 12 21 12 21z"/></svg>`;

/* 最后一次按下的位置：飞行物从这里出发 */
let lastTap = null;
const RIP = ".btn,.quick a,.lrow,.ep,.item,.gift";
document.addEventListener("pointerdown", e => {
  const t = e.target.closest("button,a,[data-gift],[data-rw],[data-pick],[data-ep]");
  lastTap = t ? t.getBoundingClientRect()
              : { left:e.clientX - 1, top:e.clientY - 1, width:2, height:2 };
  if(rm()) return;
  const host = e.target.closest(RIP);
  if(!host) return;
  const r = host.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2;
  const i = document.createElement("i");
  i.className = "rip";
  i.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left}px;top:${e.clientY - r.top}px`;
  host.appendChild(i);
  setTimeout(() => i.remove(), 520);
}, true);

const fxBox = () => $("#fx").getBoundingClientRect();
function fxAt(r){
  if(!r) return null;
  const b = fxBox();
  return { x:r.left - b.left + (r.width || 0) / 2, y:r.top - b.top + (r.height || 0) / 2 };
}
function fxAdd(el, ms){ $("#fx").appendChild(el); setTimeout(() => el.remove(), ms); return el; }
const rectOf = sel => { const e = typeof sel === "string" ? $(sel) : sel; return e ? e.getBoundingClientRect() : null; };

/* 4. 「+10 积分 / +5 亲密」沿弧线飞向积分芯片 */
function flyReward(pts, xp, from){
  const chip = $(".ptchip");
  if(rm() || !chip) return;
  const a = fxAt(from || lastTap) || { x:195, y:400 };
  const b = fxAt(chip.getBoundingClientRect());
  const items = [];
  if(pts) items.push([`${pts > 0 ? "+" : ""}${pts} 积分`, "gold"]);
  if(xp)  items.push([`+${xp} 亲密`, "rose"]);
  items.forEach(([txt, cls], i) => arcFly(txt, cls, a, b, i * 120));
  setTimeout(() => { chip.classList.add("pulse"); setTimeout(() => chip.classList.remove("pulse"), 660); }, 640);
}
function arcFly(txt, cls, a, b, delay){
  const el = document.createElement("div");
  el.className = "fly " + cls; el.textContent = txt; el.style.opacity = "0";
  fxAdd(el, delay + 1100);
  const cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - 72;
  const t0 = performance.now() + delay, dur = 800;
  (function step(now){
    if(!el.isConnected) return;
    const k = (now - t0) / dur;
    if(k < 0) return requestAnimationFrame(step);
    const p = Math.min(1, k), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const x = (1 - e) * (1 - e) * a.x + 2 * (1 - e) * e * cx + e * e * b.x;
    const y = (1 - e) * (1 - e) * a.y + 2 * (1 - e) * e * cy + e * e * b.y;
    el.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(${1 - .42 * e})`;
    el.style.opacity = p < .1 ? p / .1 : p > .85 ? (1 - p) / .15 : 1;
    if(p < 1) requestAnimationFrame(step);
  })(performance.now());
}

/* 粒子：金色小点或心形，只用这两种颜色 */
function burst(r, { n = 12, kind = "dot", spread = 46 } = {}){
  const p = fxAt(r); if(rm() || !p) return;
  for(let i = 0; i < n; i++){
    const el = document.createElement("div");
    const rose = kind === "heart" ? i % 3 !== 0 : i % 4 === 0;
    el.className = "spark" + (kind === "heart" ? " hrt" + (rose ? "" : " g") : rose ? " r" : "");
    if(kind === "heart") el.innerHTML = HRT;
    const ang = (Math.PI * 2 * i) / n + Math.random() * .6, dist = spread * (.55 + Math.random() * .7);
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    el.style.setProperty("--x", (Math.cos(ang) * dist).toFixed(1) + "px");
    el.style.setProperty("--y", (Math.sin(ang) * dist - 14).toFixed(1) + "px");
    el.style.animationDelay = Math.round(Math.random() * 110) + "ms";
    fxAdd(el, 1000);
  }
}
function splash(r, gold){
  const p = fxAt(r); if(rm() || !p) return;
  const el = document.createElement("div");
  el.className = "splash" + (gold ? " g" : "");
  el.style.left = p.x + "px"; el.style.top = p.y + "px";
  fxAdd(el, 520);
}
function popNum(r, txt, rose){
  const p = fxAt(r); if(rm() || !p) return;
  const el = document.createElement("div");
  el.className = "pop-n" + (rose ? " r" : ""); el.textContent = txt;
  el.style.left = p.x + "px"; el.style.top = p.y + "px";
  fxAdd(el, 1050);
}
/* 一个小图标从 A 飞到 B（送礼物用） */
function flyIcon(from, to, icon, done){
  const a = fxAt(from), b = fxAt(to);
  if(rm() || !a || !b){ if(done) done(); return; }
  const el = document.createElement("div");
  el.className = "flyico"; el.innerHTML = ico(icon);
  fxAdd(el, 760);
  const cx = (a.x + b.x) / 2, cy = Math.min(a.y, b.y) - 56, t0 = performance.now(), dur = 620;
  (function step(now){
    if(!el.isConnected) return;
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    const x = (1 - e) * (1 - e) * a.x + 2 * (1 - e) * e * cx + e * e * b.x;
    const y = (1 - e) * (1 - e) * a.y + 2 * (1 - e) * e * cy + e * e * b.y;
    el.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(${1 - .3 * e}) rotate(${e * 200}deg)`;
    el.style.opacity = p > .88 ? (1 - p) / .12 : 1;
    if(p < 1) requestAnimationFrame(step); else if(done) done();
  })(performance.now());
}
/* 11. 卡片飞进「已加入收藏」药丸 */
function flyToCollect(fromEl, label){
  if(rm()){ toast(label, "i-star"); return; }   // 降级时特效层是隐藏的，确认信息必须换回 toast
  const pill = document.createElement("div");
  pill.className = "collect hitnow";
  pill.innerHTML = ico("i-star") + esc(label);
  $("#fx").appendChild(pill);
  setTimeout(() => pill.remove(), 2200);
  if(rm() || !fromEl) return;
  const img = fromEl.querySelector("img");
  const a = fxAt(fromEl.getBoundingClientRect());
  requestAnimationFrame(() => {
    const b = fxAt(pill.getBoundingClientRect());
    if(!a || !b) return;
    const el = document.createElement("div");
    el.className = "ghost-card";
    el.style.cssText = `width:62px;height:46px;left:0;top:0`;
    if(img) el.innerHTML = `<img src="${img.getAttribute("src")}" alt="">`;
    fxAdd(el, 700);
    const t0 = performance.now(), dur = 560;
    (function step(now){
      if(!el.isConnected) return;
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.style.transform = `translate3d(${a.x + (b.x - a.x) * e}px,${a.y + (b.y - a.y) * e}px,0) translate(-50%,-50%) scale(${1 - .62 * e})`;
      el.style.opacity = p > .8 ? (1 - p) / .2 : 1;
      if(p < 1) requestAnimationFrame(step); else burst(pill.getBoundingClientRect(), { n:8, spread:26 });
    })(performance.now());
  });
}
/* 6. 升级庆祝：金 / 玫瑰两色心形飘落 */
function confetti(host){
  if(rm() || !host) return;
  const b = host.getBoundingClientRect(), f = fxBox();
  for(let i = 0; i < 16; i++){
    const el = document.createElement("div");
    el.className = "spark hrt" + (i % 2 ? "" : " g");
    el.innerHTML = HRT;
    el.style.left = (b.left - f.left + 20 + Math.random() * (b.width - 40)) + "px";
    el.style.top = (b.top - f.top + b.height * .35) + "px";
    el.style.setProperty("--x", (Math.random() * 70 - 35).toFixed(0) + "px");
    el.style.setProperty("--y", (-70 - Math.random() * 70).toFixed(0) + "px");
    el.style.animationDelay = Math.round(Math.random() * 420) + "ms";
    el.style.animationDuration = "1.25s";
    fxAdd(el, 1800);
  }
}
const pulseOnce = (el, cls, ms) => { if(!el || rm()) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };

/* 1. 重复卡片错峰进场 */
function stagger(scr){
  if(rm()) return;
  const seen = new Map();
  scr.querySelectorAll(".gcard,.gcardx,.dcard,.item,.quick a,.ep,.lrow,.gift,.qt,.poster").forEach(el => {
    const k = el.parentElement, i = seen.get(k) || 0;
    seen.set(k, i + 1);
    el.classList.add("rv");
    el.style.animationDelay = Math.min(i * 40, 240) + "ms";
  });
}

  if(rm()) return;
  scr.querySelectorAll('.pill.ok .ic,.row .ic').forEach(el => {
    if(el.querySelector('use[href="#i-check"]')) el.classList.add("chk-draw");
  });
}
/* 12. tab 指示条滑动 */
function moveTabInd(){

      <button class="ibtn hit" id="chatMenu" aria-label="更多">${ico("i-dots")}</button>`,
    html:`<div class="chat-wrap" style="height:100%">
      <div class="chat-bg">${phImg(bg.img, bg.initial, bg.name + " 场景")}</div>
      <div class="chat-sc" id="log">
        <div class="msg sys">以下对话由 AI 虚拟角色生成，不代表真实人物。聊天不产生娱乐积分，每天第一次互动 +${XPR.chat} 亲密。</div>
        ${log.length ? "" : `<div class="msg her">${esc(g.line)}</div>`}
        ${log.map(m => `<div class="msg ${m.r}">${esc(m.x)}</div>`).join("")}
      </div>
      <div class="chips" id="chips" data-od-id="chat-topics">
        ${BOND[g.id].topics.map(t => t.lv <= lv
          ? `<button class="chip" data-topic="${t.id}">${ico("i-chat")}${esc(t.label)}</button>`
          : `<button class="chip lk" data-locked="${t.lv}">${ico("i-lock")}${esc(t.label)} · Lv.${t.lv} 解锁</button>`).join("")}
        <button class="chip" data-gift-open="1">${ico("i-gift")}送礼物</button>
      </div>
      <form class="chat-in" id="form" autocomplete="off">
        <textarea id="inp" rows="1" placeholder="和${esc(g.name)}说点什么…" aria-label="输入消息"></textarea>
        <button class="send hit" type="submit" id="send" disabled aria-label="发送">${ico("i-send")}</button>
      </form>
    </div>`,
    after(root){
      // 聊天屏不滚动 stage，内部滚动
      $("#stage").style.overflow = "hidden";
      root.style.height = "100%"; root.style.paddingBottom = "0";
      const log = $("#log", root), inp = $("#inp", root), send = $("#send", root);
      const bottom = () => { log.scrollTop = log.scrollHeight; };
      bottom();
      const grow = () => { inp.style.height = "auto"; inp.style.height = Math.min(92, inp.scrollHeight) + "px"; send.disabled = !inp.value.trim(); };
      inp.addEventListener("input", grow);
      inp.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#form", root).requestSubmit(); } });
      $("#form", root).addEventListener("submit", e => {
        e.preventDefault();
        const txt = inp.value.trim(); if(!txt) return;
        inp.value = ""; grow();
        say(txt);
      });
      /* 发一条，并让她回一句（带输入中动画） */
      function say(txt, forced){
        push("me", txt);
        firstChatXp();
        const t = document.createElement("div");
        t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
        log.appendChild(t); bottom();
        setTimeout(() => { t.remove(); push("her", forced || answer(girl(), txt)); },
          620 + Math.random() * 760);
      }
      function firstChatXp(){
        const id = girl().id;
        if(S.chatXp.includes(id)) return;
        S.chatXp.push(id); save();
        reward(`和${girl().name}互动`, 0, XPR.chat, id);
      }
      $$("[data-topic]", root).forEach(b => b.onclick = () => {
        const t = BOND[girl().id].topics.find(x => x.id === b.dataset.topic);
        say(t.q, t.a);
      });
      $$("[data-locked]", root).forEach(b => b.onclick = () => {
        const need = +b.dataset.locked, bd = bondOf(girl().id);
        toast(`这个话题要 Lv.${need} ${LEVELS[need - 1].name} · 还差 ${LEVELS[need - 1].at - bd.xp} 点亲密`, "i-lock");
      });
      $("[data-gift-open]", root).onclick = () => giftSheet(girl().id);
      function push(r, x){
        chatLog().push({ r, x }); save();
        const d = document.createElement("div");
        d.className = "msg " + r; d.textContent = x;
        log.appendChild(d); bottom();
      }
      $("#chatMenu").onclick = () => sheet({
        title:"聊天设置", sub:`${girl().name} · AI 虚拟角色`,
        body:`<div class="panel" style="padding:4px 16px">
            <div class="row"><div class="row-m"><div class="row-t">当前场景</div><div class="row-s">${bgOf().name}</div></div><a class="tbtn" href="#wardrobe" onclick="closeSheet()">更换</a></div>
            <div class="row"><div class="row-m"><div class="row-t">对话条数</div><div class="row-s">仅保存在本机</div></div><span class="pill">${chatLog().length}</span></div>
          </div>
          <p class="sm" style="margin:14px 0 4px">聊天不产生娱乐积分。清除后无法恢复。</p>`,
        foot:`<button class="btn btn-gh btn-w" id="clr">${ico("i-refresh")}清除聊天记录</button>`
      }).querySelector("#clr").onclick = () => {
        S.chats[girl().id] = []; save(); closeSheet(); toast("聊天记录已清除"); render();
      };
    },
    leave(){ $("#stage").style.overflow = ""; }
  };
}};

function answer(g, txt){
  const t = txt.toLowerCase();
  for(const k in g.reply){
    if(k.split("|").some(w => t.includes(w))){
      const a = g.reply[k];
      return a[Math.floor(Math.random() * a.length)];
    }
  }
  return g.fallback[Math.floor(Math.random() * g.fallback.length)];
}

            .map(c => `<li class="sm" style="display:flex;gap:8px;color:var(--muted)"><span class="gold">${ico("i-check","ic")}</span><span>${esc(c)}</span></li>`).join("")}

}
function startGame(gm){

   ============================================================ */
function playHeart(gm, scored){
  const g = girl();
  $("#gameHost").innerHTML = `
  <section data-od-id="game-run">
    ${gstat([["得分","sc",0],["连击","cb",0],["剩余","tm",GAME.len]], scored)}
    <div class="arena" id="arena" data-react-pos="right:12px;bottom:12px"><div class="combo" id="comboTag"></div></div>
    ${modeBar(scored)}
  </section>`;
  const arena = $("#arena"), bar = $(".tbar"), tmEl = $("#tm");
  G = { score:0, combo:0, best:0, hits:0, left:GAME.len, celebrated:false, arena };
  react(arena, "idle", g.id);
  G.tick = setInterval(() => {
    G.left--;
    tmEl.textContent = Math.max(0, G.left);
    $("#tb").style.transform = `scaleX(${Math.max(0, G.left / GAME.len)})`;
    const low = G.left <= 5 && G.left > 0;
    bar.classList.toggle("low", low); tmEl.classList.toggle("low", low);
    if(G.left <= 0) done();
  }, 1000);
  G.spawn = setInterval(pop, 620);
  pop(); pop();
  $("#quit").onclick = done;

  function done(){
    const { score, best, hits } = G;
    const earned = scored ? Math.min(RULES.gameMax, Math.round(score / 10)) : 0;
    gameFinish(gm, { score, scored, earned, detail:`命中 ${hits} 次 · 最高 ${best} 连击` });
  }
  function pop(){
    if(!G) return;
    const w = arena.clientWidth || 320, h = arena.clientHeight || 396;
    const b = document.createElement("button");
    const gold = Math.random() < 0.14;
    b.className = "hbtn" + (gold ? " gold" : "");
    b.type = "button"; b.setAttribute("aria-label", "点击心形"); b.innerHTML = HEART;
    b.style.left = (18 + Math.random() * Math.max(10, w - 92)) + "px";
    b.style.top  = (18 + Math.random() * Math.max(10, h - 92)) + "px";
    arena.appendChild(b);
    const life = setTimeout(() => {
      if(!b.isConnected) return;
      b.classList.add("fade"); setTimeout(() => b.remove(), 300);
      if(G){ G.combo = 0; $("#cb").textContent = 0; $("#comboTag").classList.remove("on"); }
    }, 1500);
    b.onclick = () => {
      if(!G) return;
      clearTimeout(life);
      const r = b.getBoundingClientRect();
      b.classList.add("pop"); setTimeout(() => b.remove(), 340);
      splash(r, gold);
      G.hits++; G.combo++; G.best = Math.max(G.best, G.combo);
      const gain = (GAME.hit + (G.combo >= 5 ? GAME.comboBonus : 0)) * (gold ? 2 : 1);
      G.score += gain;
      popNum(r, "+" + gain, !gold);
      $("#sc").textContent = G.score; $("#cb").textContent = G.combo;
      const tag = $("#comboTag");
      if(G.combo >= 2){ tag.textContent = `${G.combo} 连击${gold ? " · 双倍" : ""}`; tag.classList.add("on"); }
      else tag.classList.remove("on");
      if(G.combo === 5 || G.combo === 10 || G.combo === 20) pulseOnce(tag, "hit", 460);
      if(G.score >= GAME.target && !G.celebrated){ G.celebrated = true; react(arena, "win", g.id); }
      else if(G.combo >= 5){ if(G.combo % 3 === 0) react(arena, "combo", g.id); }
      else if(G.hits % 4 === 0) react(arena, "hit", g.id);
    };
  }
}

const QUIZ_PT = 6;
function playQuiz(gm, scored){
  const g = girl();
  const qs = QUIZ[g.id].map(q => {
    const idx = q.o.map((_, i) => i);
    for(let i = idx.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return { q:q.q, pic:q.pic, o:idx.map(i => q.o[i]), a:idx.indexOf(q.a) };
  });
  G = { i:0, right:0, locked:false };
  paint();
  function paint(){
    if(!G) return;
    const q = qs[G.i];
    $("#gameHost").innerHTML = `
    <section data-od-id="game-run">
      <div class="qprog">${qs.map((_, i) => `<i class="${i < G.i ? "on" : i === G.i ? "cur" : ""}"></i>`).join("")}</div>
      <div class="panel" style="display:flex;align-items:center;gap:12px;padding:12px 14px">
        <span class="av-s">${phImg(outfitImg(g), g.initial, "", "", AV)}</span>
        <div class="row-m"><b style="font-size:16px;font-weight:700">${esc(q.q)}</b>
          <div class="sm" style="margin-top:2px">第 ${G.i + 1} / ${qs.length} 题 · 答对 +${QUIZ_PT} 分</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px" id="opts">
        ${q.o.map((o, i) => `<button class="qopt" data-o="${i}" data-od-id="quiz-opt-${i}">
          ${q.pic && o[1] ? phImg(SCENE[o[1]].img, SCENE[o[1]].initial, o[0]) : ""}
          <span>${esc(o[0])}</span>
          <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 12.6 9.6 17.4 19.2 6.6"/></svg></span>
        </button>`).join("")}
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
        <span class="pill ${scored ? "g" : "tbd"}">${scored ? "本局计分" : "练习模式 · 不计分"}</span>
        <span class="pill">已答对 ${G.right}</span>
        <button class="btn btn-pri" id="nextQ" style="margin-left:auto;min-height:42px;font-size:13.5px" aria-disabled="true">
          ${G.i === qs.length - 1 ? "看结果" : "下一题"}</button>
      </div>
    </section>`;
    const nx = $("#nextQ");
    $$("[data-o]").forEach(b => b.onclick = () => {
      if(!G || G.locked) return;
      G.locked = true;
      const pick = +b.dataset.o, ok = pick === q.a;
      b.classList.add("sel", ok ? "right" : "wrong");
      if(!ok) $$("[data-o]")[q.a].classList.add("right");
      $$("[data-o]").forEach(x => x.setAttribute("disabled", ""));
      if(ok){ G.right++; burst(b.getBoundingClientRect(), { n:9, kind:"heart", spread:46 }); popNum(b.getBoundingClientRect(), "+" + QUIZ_PT); }
      react($("#gameHost"), ok ? (G.right >= 4 ? "win" : "hit") : "idle", g.id);
      nx.removeAttribute("aria-disabled");
      nx.classList.add("claim");
    });
    nx.onclick = () => {
      if(!G || !G.locked) return;
      G.locked = false;
      if(G.i >= qs.length - 1) return done();
      G.i++; paint();
    };
  }
  function done(){
    const right = G.right;
    const score = right * QUIZ_PT;
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    gameFinish(gm, { score, scored, earned, detail:`答对 ${right} / ${qs.length} 题` });
  }
}

const CROWN_SVG = `<svg viewBox="0 0 24 24"><path d="M2.6 7.2 7 11l5-6.6 5 6.6 4.4-3.8-1.8 11.4H4.4z"/><rect x="4.4" y="19" width="15.2" height="1.8" rx=".9"/></svg>`;
const MEM_GLYPH = {
  coin:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 6.6 1.7 3.5 3.8.6-2.8 2.7.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.7 3.8-.6z" fill="#0C1F63"/></svg>`,

  heart:`<svg viewBox="0 0 24 24"><path d="M12 21S3 15.3 3 9.3A4.9 4.9 0 0 1 12 6.5a4.9 4.9 0 0 1 9 2.8C21 15.3 12 21 12 21z"/></svg>`,
  crown:CROWN_SVG
};
const MEM_LEN = 45;
function playMemory(gm, scored){
  const g = girl();
  const kinds = [
    { k:"p1", img:g.lounge }, { k:"p2", img:g.img2 },
    { k:"coin" }, { k:"gift" }, { k:"heart" }, { k:"crown" }
  ];
  const deck = kinds.concat(kinds).map(c => ({ ...c, id:Math.random() }));
  for(let i = deck.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }
  $("#gameHost").innerHTML = `
  <section data-od-id="game-run">
    ${gstat([["已配对","mp","0 / 6"],["用时","tm","0"],["翻牌","mf","0"]], scored)}
    <div class="mgrid" id="mgrid" data-react-pos="right:10px;bottom:10px">
      ${deck.map((c, i) => `<button class="mcard" data-c="${i}" aria-label="翻牌">
        <span class="face back">${CROWN_SVG}</span>
        <span class="face front">${c.img ? phImg(c.img, g.initial, "", "", "50% 24%") : `<svg class="ic3" viewBox="0 0 24 24">${MEM_GLYPH[c.k].replace(/^<svg[^>]*>|<\/svg>$/g, "")}</svg>`}</span>
      </button>`).join("")}
    </div>
    ${modeBar(scored)}
  </section>`;
  const grid = $("#mgrid");
  G = { open:[], pairs:0, flips:0, t:0, lock:false };
  G.tick = setInterval(() => {
    if(!G) return;
    G.t++;
    $("#tm").textContent = G.t;
    $("#tb").style.transform = `scaleX(${Math.max(0, (MEM_LEN - G.t) / MEM_LEN)})`;
    const low = MEM_LEN - G.t <= 8 && G.t < MEM_LEN;
    $(".tbar").classList.toggle("low", low); $("#tm").classList.toggle("low", low);
    if(G.t >= MEM_LEN) done(false);
  }, 1000);
  $("#quit").onclick = () => done(false);
  $$("[data-c]", grid).forEach(b => b.onclick = () => {
    if(!G || G.lock) return;
    const i = +b.dataset.c;
    if(b.classList.contains("flip")) return;
    b.classList.add("flip");
    G.flips++; $("#mf").textContent = G.flips;
    G.open.push({ i, b });
    if(G.open.length < 2) return;
    G.lock = true;
    const [x, y] = G.open;
    if(deck[x.i].k === deck[y.i].k){
      G.pairs++; $("#mp").textContent = `${G.pairs} / 6`;
      setTimeout(() => {
        x.b.classList.add("done"); y.b.classList.add("done");
        burst(y.b.getBoundingClientRect(), { n:8, spread:34 });
        react(grid, G.pairs >= 5 ? "win" : "hit", g.id);
        G.open = []; G.lock = false;
        if(G.pairs === 6) done(true);
      }, 280);
    } else {
      setTimeout(() => {
        if(!G) return;
        x.b.classList.remove("flip"); y.b.classList.remove("flip");
        G.open = []; G.lock = false;
      }, 700);
    }
  });
  function done(won){
    const t = G ? G.t : MEM_LEN, pairs = G ? G.pairs : 0;
    const score = won ? Math.max(6, Math.min(30, Math.round(30 - t / 1.5))) : pairs * 3;
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    gameFinish(gm, { score, scored, earned,
      detail: won ? `${t} 秒完成 · 翻牌 ${G ? G.flips : 0} 次` : `配对 ${pairs} / 6 · 时间到` });
  }
}

  heart:{ v:2, svg:`<svg viewBox="0 0 24 24"><path d="M12 21S3 15.3 3 9.3A4.9 4.9 0 0 1 12 6.5a4.9 4.9 0 0 1 9 2.8C21 15.3 12 21 12 21z" fill="#FF6E9C"/></svg>` },
  coin:{ v:4, svg:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#F2C25B"/><circle cx="12" cy="12" r="6" fill="#FFE59A"/></svg>` },
  cloud:{ v:-1, svg:`<svg viewBox="0 0 24 24"><path d="M6.5 18h11a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.7-1A3.9 3.9 0 0 0 6.5 18z" fill="#8894B5"/></svg>` }
};
const CATCH_LEN = 30;
function playCatch(gm, scored){
  const g = girl();
  $("#gameHost").innerHTML = `
  <section data-od-id="game-run">
    ${gstat([["得分","sc",0],["连击","cb",0],["剩余","tm",CATCH_LEN]], scored)}
    <div class="cstage" id="stage2" data-react-pos="right:10px;bottom:52px">
      <div class="basket" id="basket"><div class="bk"></div></div>
      <div class="chint">拖动或点击左右移动篮子 · 躲开乌云</div>
    </div>
    ${modeBar(scored)}
  </section>`;
  const st = $("#stage2"), basket = $("#basket");
  let W = st.clientWidth || 330;
  G = { score:0, combo:0, best:0, caught:0, left:CATCH_LEN, items:[], x:W / 2 - 38, last:0 };
  const place = () => { basket.style.transform = `translateX(${G.x}px)`; };
  place();
  react(st, "idle", g.id);

  const moveTo = cx => {
    if(!G) return;
    W = st.clientWidth || W;
    G.x = Math.max(0, Math.min(W - 76, cx - 38));
    place();
  };
  const onPtr = e => {
    const r = st.getBoundingClientRect();
    const cx = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - r.left;
    moveTo(cx);
  };
  const onDown = e => { st.setPointerCapture && e.pointerId != null && st.setPointerCapture(e.pointerId); onPtr(e); };
  st.addEventListener("pointerdown", onDown);
  st.addEventListener("pointermove", e => { if(e.buttons) onPtr(e); });
  const onKey = e => {
    if(!G) return;
    if(e.key === "ArrowLeft"){ moveTo(G.x + 38 - 34); e.preventDefault(); }
    if(e.key === "ArrowRight"){ moveTo(G.x + 38 + 34); e.preventDefault(); }
  };
  window.addEventListener("keydown", onKey);
  G.off = () => { st.removeEventListener("pointerdown", onDown); window.removeEventListener("keydown", onKey); };

  G.tick = setInterval(() => {
    if(!G) return;
    G.left--;
    $("#tm").textContent = Math.max(0, G.left);
    $("#tb").style.transform = `scaleX(${Math.max(0, G.left / CATCH_LEN)})`;
    const low = G.left <= 5 && G.left > 0;
    $(".tbar").classList.toggle("low", low); $("#tm").classList.toggle("low", low);
    if(G.left <= 0) done();
  }, 1000);
  G.spawn = setInterval(spawn, 620);
  spawn();

  const step = now => {
    if(!G) return;
    const dt = G.last ? Math.min(48, now - G.last) : 16;
    G.last = now;
    const H = st.clientHeight || 340;
    for(let i = G.items.length - 1; i >= 0; i--){
      const it = G.items[i];
      it.y += it.sp * dt / 16;
      it.el.style.transform = `translate(${it.x}px,${it.y}px) rotate(${it.r}deg)`;
      it.r += it.spin;
      if(it.y > H - 48 && it.y < H - 6 && it.x + 17 > G.x && it.x + 17 < G.x + 76){
        hit(it); G.items.splice(i, 1); continue;
      }
      if(it.y > H){ it.el.remove(); G.items.splice(i, 1); if(it.k !== "cloud") breakCombo(); }
    }
    G.raf = requestAnimationFrame(step);
  };
  G.raf = requestAnimationFrame(step);

  function spawn(){
    if(!G) return;
    W = st.clientWidth || W;
    const roll = Math.random();
    const k = roll < .22 ? "cloud" : roll < .46 ? "coin" : roll < .74 ? "heart" : "gift";
    const el = document.createElement("div");
    el.className = "falling"; el.innerHTML = FALL[k].svg;
    st.appendChild(el);
    G.items.push({ k, el, x:8 + Math.random() * Math.max(10, W - 50), y:-36,
      sp:1.9 + Math.random() * 1.5, r:0, spin:(Math.random() - .5) * 6 });
  }
  function hit(it){
    const r = it.el.getBoundingClientRect();
    it.el.remove();
    if(it.k === "cloud"){
      G.combo = 0; $("#cb").textContent = 0;
      G.score = Math.max(0, G.score - 4);
      $("#sc").textContent = G.score;
      popNum(r, "-4", true);
      splash(r, false);
      pulseOnce(st, "shake", 420);
      return;
    }
    G.caught++; G.combo++; G.best = Math.max(G.best, G.combo);
    const gain = FALL[it.k].v * (G.combo >= 5 ? 2 : 1);
    G.score += gain;
    $("#sc").textContent = G.score; $("#cb").textContent = G.combo;
    popNum(r, "+" + gain, it.k !== "coin");
    splash(r, it.k === "coin");
    if(G.combo === 5 || G.combo === 10 || G.combo === 20) react(st, "combo", g.id);
    else if(G.caught % 5 === 0) react(st, "hit", g.id);
  }
  function breakCombo(){ if(!G) return; G.combo = 0; $("#cb").textContent = 0; }
  function done(){
    const { score, caught, best } = G;
    const earned = scored ? Math.min(RULES.gameMax, Math.round(score / 4)) : 0;
    gameFinish(gm, { score, scored, earned, detail:`接住 ${caught} 个 · 最高 ${best} 连击` });
  }
  $("#quit").onclick = done;
}

let justUnlocked = null;
function openEp(d, n, el){
  const un = S.eps[d.id] || (S.eps[d.id] = []);
  if(un.includes(n)) return nav(`#play/${d.id}/${n}`);
  if(el && S.pts < PRICE.ep) pulseOnce(el, "shake", 460);
  buy({ cost:PRICE.ep, title:"一集AI短剧", sub:`${d.title} · 第 ${n} 集 ${d.eps[n - 1]}`, fromEl:el,
    cond:["解锁后永久可看，不重复扣分","仅解锁本集"],
    done(){ un.push(n); un.sort((a, b) => a - b); justUnlocked = `${d.id}-${n}`; },
    then(){ const h = `#play/${d.id}/${n}`; if(location.hash === h) render(); else nav(h); } });
}

      </div>`,
    foot:`<button class="btn btn-qt btn-w" onclick="closeSheet()">关闭</button>`
  });
  const done = msg => { S.tasks.share = true; save(); closeSheet(); toast(msg, "i-share"); };
  $$("[data-sh]", sh).forEach(b => b.onclick = async () => {
    const k = b.dataset.sh;
    if(k === "cp"){
      let ok = false;
      try { await navigator.clipboard.writeText(link); ok = true; }
      catch(e){
        const ta = document.createElement("textarea");
        ta.value = link; ta.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand("copy"); } catch(e2){}
        ta.remove();
      }
      return done(ok ? "链接已复制，发给好友即可" : "请长按上方链接手动复制");
    }
    const url = k === "wa"
      ? `https://wa.me/?text=${encodeURIComponent(txt + " " + link)}`
      : `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(txt)}`;
    try { window.open(url, "_blank", "noopener"); } catch(e){}
    done(k === "wa" ? "已打开 WhatsApp 分享" : "已打开 Telegram 分享");
  });
}

        <a class="lrow" href="#girls">${ico("i-heart")}<div class="row-m">陪伴角色<div class="row-s">随时可更换</div></div><span class="cv">${esc(g.name)}${ico("i-next")}</span></a>
        <a class="lrow" href="#wardrobe">${ico("i-star")}<div class="row-m">当前场景<div class="row-s">用于聊天背景</div></div><span class="cv">${esc(bgOf().name)}${ico("i-next")}</span></a>
        <button class="lrow" id="clrChat">${ico("i-chat")}<div class="row-m">清除聊天记录<div class="row-s">清除全部角色的对话</div></div><span class="cv">${GIRLS.reduce((a, x) => a + ((S.chats[x.id] || []).length), 0)} 条${ico("i-next")}</span></button>
        <button class="lrow" id="guide">${ico("i-sparkle")}<div class="row-m">重看新手引导<div class="row-s">3 步说明</div></div><span class="cv">${ico("i-next")}</span></button>
        <button class="lrow" id="reset">${ico("i-refresh")}<div class="row-m">重置演示数据<div class="row-s">积分、解锁、记录全部恢复初始</div></div><span class="cv">${ico("i-next")}</span></button>
      </div>
    </section>

    <div class="panel" style="margin-top:22px;text-align:center" data-od-id="me-disclaimer">
      <img src="assets/logo/logo-hg.png" alt="MBA66" style="height:22px;width:auto;max-width:70%;opacity:.9"
        onerror="this.outerHTML='<div class=\'h2 gold\'>MBA66</div>'">
      <p class="sm" style="margin-top:12px;color:var(--muted)">娱乐积分不充值、不提现，不与充值、投注或输赢挂钩。</p>
      <p class="sm" style="margin-top:6px">角色为 AI 虚拟形象 · 演示版本 · 数据仅存于本机浏览器</p>
    </div>`,
    after(root){
      const nickSheet = () => {
        const sh = sheet({ title:"修改昵称", sub:"仅保存在本机浏览器",
          body:`<label class="lbl" for="nk">昵称</label>
            <input id="nk" value="${esc(S.nick)}" maxlength="12" style="margin-top:9px;width:100%;min-height:48px;padding:0 15px;
              border-radius:var(--r-ctl);background:rgba(242,237,227,.07);border:1px solid var(--line-2);color:var(--fg);
              font-family:var(--sans);font-size:14px">`,
          foot:`<button class="btn btn-pri btn-w" id="sv">保存</button>` });
        const inp = sh.querySelector("#nk"); inp.focus(); inp.select();
        sh.querySelector("#sv").onclick = () => {
          const v = inp.value.trim(); if(!v){ toast("昵称不能为空"); return; }
          S.nick = v.slice(0, 12); save(); closeSheet(); toast("昵称已更新"); render();
        };
      };
      $("#editNick", root).onclick = nickSheet;
      $("#editNick2", root).onclick = nickSheet;
      $("#clrChat", root).onclick = () => { S.chats = {}; save(); toast("全部聊天记录已清除"); render(); };
      $("#guide", root).onclick = () => startCoach(true);
      $("#reset", root).onclick = () => {
        const sh = sheet({ title:"重置演示数据", sub:"此操作不可撤销",
          body:`<p class="p">将清除本机保存的全部演示状态：娱乐积分、签到、已解锁内容、观看记录、聊天记录与偏好，并重新发放首次注册 +${RULES.signup} 积分。</p>`,
          foot:`<button class="btn btn-pri btn-w" id="yes2">确认重置</button>
                <button class="btn btn-qt btn-w" onclick="closeSheet()">取消</button>` });
        sh.querySelector("#yes2").onclick = () => {
          try { localStorage.removeItem(KEY); } catch(e){}
          S = load(); save(); closeSheet(); nav("#home"); render();
          toast(`演示数据已重置 · 首次注册 +${RULES.signup} 积分`, "i-refresh");
        };
      };
    }
  };
}};

/* ============================================================
   新手引导（3 步）
   ============================================================ */
const COACH = [
  { sel:'#tabs a[data-tab="girls"]', t:"先选一位 AI 伙伴", s:"三位角色性格不同，聊天的语气也不一样。随时可以更换，已解锁的内容不会消失。" },
  { sel:'[data-od-id="home-checkin"]', t:"每天签到攒积分", s:`签到 +${RULES.checkin}，心动挑战单局最多 +${RULES.gameMax}（每日 ${RULES.gameRounds} 局计分）。` },
  { sel:'#tabs a[data-tab="rewards"]', t:"两套数值，各管各的", s:"娱乐积分解锁内容：短剧单集 20、礼物 20、背景 100、动作 150、服装 300。亲密经验只累积，升到 Lv.4 解锁她的专属故事。" }
];
let coachI = 0;
function startCoach(manual){
  if(location.hash !== "#home" && location.hash !== ""){ nav("#home"); setTimeout(() => startCoach(manual), 380); return; }
  coachI = 0; $("#coach").classList.add("on"); $("#coach").setAttribute("aria-hidden","false");
  drawCoach();
}
function drawCoach(){
  const step = COACH[coachI];
  const el = $(step.sel);
  const host = $("#phone").getBoundingClientRect();
  let ring = "";
  let cardPos = "top:120px";
  if(el){
    const r = el.getBoundingClientRect();
    const t = r.top - host.top, l = r.left - host.left;
    ring = `<div class="ring" style="left:${l - 6}px;top:${t - 6}px;width:${r.width + 12}px;height:${r.height + 12}px"></div>`;
    cardPos = (t > host.height * 0.5) ? `bottom:${host.height - t + 18}px` : `top:${t + r.height + 18}px`;
  }
  $("#coach").innerHTML = `${el ? ring : `<div class="mask"></div>`}
    <div class="cc" style="${cardPos}">
      <div class="lbl">新手引导 · ${coachI + 1} / ${COACH.length}</div>
      <div class="h2" style="margin-top:8px">${esc(step.t)}</div>
      <p class="p" style="margin-top:8px">${esc(step.s)}</p>
      <div class="dots">${COACH.map((_, i) => `<i class="${i === coachI ? "on" : ""}"></i>`).join("")}</div>
      <div style="display:flex;gap:9px;margin-top:16px">
        <button class="btn btn-qt" id="skip" style="flex:1;min-height:42px;font-size:13px">跳过</button>
        <button class="btn btn-pri" id="nextC" style="flex:1.3;min-height:42px;font-size:13px">
          ${coachI === COACH.length - 1 ? (S.coachXp ? "开始体验" : `开始体验 · +${XPR.coach} 亲密`) : "下一步"}</button>
      </div>
    </div>`;
  $("#skip").onclick = () => endCoach(false);
  $("#nextC").onclick = () => { if(coachI === COACH.length - 1) endCoach(true); else { coachI++; drawCoach(); } };
}
function endCoach(finished){
  $("#coach").classList.remove("on"); $("#coach").setAttribute("aria-hidden","true"); $("#coach").innerHTML = "";
  S.coached = true; save();
  if(finished && !S.coachXp){
    S.coachXp = true; save();
    reward("完成新手引导", 0, XPR.coach);   // bumpBonds 已就地刷新进度条，不要再 render
  }
}

/* ============================================================
   启动
   ============================================================ */
$("#fab").onclick = () => nav("#chat");
if(!location.hash) location.hash = "#home";
render();
if(!S.coached){
  setTimeout(() => startCoach(), 620);
  toast(`欢迎加入 · 首次注册 +${RULES.signup} 积分`, "i-crown");
}
window.addEventListener("resize", () => { if($("#coach").classList.contains("on")) drawCoach(); });
</script>
</body>
</html>
