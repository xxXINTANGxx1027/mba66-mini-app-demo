const POSES = [
  { k:"hair",  t:"撩头发" }, { k:"wink", t:"抛媚眼" },
  { k:"kiss",  t:"飞吻"   }, { k:"smile", t:"回眸笑" }
];
const SHOT_N = 5;
function playPhoto(gm, scored){
  const g = girl();
  const frames = [g.v3, g.lounge, g.x, g.bikini].filter(Boolean);
  G = { shot:0, hit:0, cur:0, target:0, lock:false };
  pick();
  render2();
  G.spawn = setInterval(() => {
    if(!G || G.lock) return;
    G.cur = (G.cur + 1) % POSES.length;
    const box = $("#shootbox"), img = box && box.querySelector("img"), lab = $("#poselab");
    if(img) img.setAttribute("src", frames[G.cur % frames.length]);
    if(box){ box.classList.remove("z1", "z2"); box.classList.add(G.cur % 2 ? "z1" : "z2"); }
    if(lab){
      lab.textContent = POSES[G.cur].t;
      lab.classList.toggle("hit", G.cur === G.target);
    }
  }, 900);
  function pick(){ G.target = (Math.random() * POSES.length) | 0; }
  function render2(){
    if(!G) return;
    $("#gameHost").innerHTML = `
    <section data-od-id="game-run">
      ${gstat([["已拍","sp",`0 / ${SHOT_N}`],["抓准","sh",0],["目标","st",POSES[G.target].t]], scored)}
      <div class="shootbox vf z2" id="shootbox" data-react-pos="right:12px;bottom:12px">
        ${phImg(frames[0], g.initial, g.name + " 写真", "", "50% 14%")}
        <i></i><i></i><i></i><i></i>
        <div class="poselab" id="poselab">${POSES[0].t}</div>
        <div class="flashfx" id="flash"></div>
      </div>
      <button class="shutter" id="shutter" aria-label="按下快门"><span></span></button>
      <p class="sm" style="margin-top:9px;text-align:center">目标姿势亮起时按快门</p>
      ${modeBar(scored)}
    </section>`;
    $("#quit").onclick = done;
    $("#shutter").onclick = shoot;
  }
  function shoot(){
    if(!G || G.lock) return;
    G.lock = true;
    const ok = G.cur === G.target;
    const fl = $("#flash"); if(fl){ fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on"); }
    G.shot++;
    if(ok){
      G.hit++;
      const box = $("#shootbox");
      burst(box.getBoundingClientRect(), { n:10, kind:"heart", spread:56 });
      popNum(box.getBoundingClientRect(), "+6");
      react(box, "win", g.id);
      const sc = S.shots = S.shots || {};
      sc[g.id] = (sc[g.id] || 0) + 1; save();
      toast(`抓到了！已存进她的相册 · 写真 · 第 ${sc[g.id]} 张`, "i-star");
    } else {
      toast(`${g.name}：这张我不要，重拍。`, "i-heart");
    }
    $("#sp").textContent = `${G.shot} / ${SHOT_N}`;
    $("#sh").textContent = G.hit;
    setTimeout(() => {
      if(!G) return;
      G.lock = false;
      if(G.shot >= SHOT_N) return done();
      pick();
      const st = $("#st"); if(st) st.textContent = POSES[G.target].t;
    }, 520);
  }
  function done(){
    const hit = G ? G.hit : 0, shot = G ? G.shot : 0;
    const score = hit * 6;
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    gameFinish(gm, { score, scored, earned, detail:`抓准 ${hit} / ${shot} 张 · 已存进相册` });
  }
}

/* ============================================================
   游戏 9 · 帮她涂防晒（只在肩膀 / 上背 / 手臂）
   ============================================================ */
const SUN_SPOTS = [          /* 只在肩膀、上背与手臂，避开脸与腰 */
  { x:39, y:54 }, { x:56, y:51 }, { x:48, y:58 },
  { x:61, y:55 }, { x:33, y:60 }, { x:26, y:67 }
];
const SUN_SAY = ["凉凉的～", "左边一点…对，就是那里", "你手好暖", "嗯……再轻一点", "这里晒到了", "好了，谢谢你～"];
const SUN_LEN = 20;
function playSun(gm, scored){
  let g = girl();
  let note = "";
  if(!g.sun){                                   // 只有夏夏有海边泳装图，其他人由夏夏顶上
    note = g.name + "去换泳衣了，夏夏来陪你";
    g = girl("summer");
  }
  G = { left:SUN_LEN, done:0, drag:false };
  $("#gameHost").innerHTML = `
  <section data-od-id="game-run">
    ${gstat([["已涂","sd","0 / 6"],["剩余","tm",SUN_LEN],["当前","sg",esc(g.name)]], scored)}
    ${note ? `<p class="sm" style="margin:-4px 0 10px;text-align:center">${esc(note)}</p>` : ""}
    <div class="sunbox" id="sunbox" data-react-pos="right:12px;bottom:12px">
      <img src="${g.sun}" alt="${esc(g.name)} 在沙滩椅上">
      ${SUN_SPOTS.map((p, i) => `<span class="spot" data-spot="${i}"
        style="left:${p.x}%;top:${p.y}%"><i></i></span>`).join("")}
    </div>
    <p class="sm" style="margin-top:9px;text-align:center">在发光的圈上来回涂抹</p>
    ${modeBar(scored)}
  </section>`;
  const box = $("#sunbox");
  const fill = {};
  const touch = e => {
    if(!G || !G.drag) return;
    const r = box.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    $$("[data-spot]", box).forEach(sp => {
      const i = sp.dataset.spot;
      if(sp.classList.contains("done")) return;
      const sr = sp.getBoundingClientRect();
      const dx = cx - (sr.left - r.left + sr.width / 2), dy = cy - (sr.top - r.top + sr.height / 2);
      if(dx * dx + dy * dy > 34 * 34) return;
      fill[i] = (fill[i] || 0) + .14;
      sp.querySelector("i").style.transform = `scale(${Math.min(1, fill[i])})`;
      if(fill[i] >= 1){
        sp.classList.add("done");
        G.done++;
        $("#sd").textContent = `${G.done} / 6`;
        burst(sp.getBoundingClientRect(), { n:7, spread:30 });
        toast(`${g.name}：${SUN_SAY[(G.done - 1) % SUN_SAY.length]}`, "i-heart");
        react(box, G.done >= 5 ? "win" : "hit", g.id);
        if(G.done >= 6) done();
      }
    });
  };
  const down = e => { if(G){ G.drag = true; touch(e); } };
  const up = () => { if(G) G.drag = false; };
  box.addEventListener("pointerdown", down);
  box.addEventListener("pointermove", touch);
  window.addEventListener("pointerup", up);
  G.off = () => { window.removeEventListener("pointerup", up); };
  G.tick = setInterval(() => {
    if(!G) return;
    G.left--;
    $("#tm").textContent = Math.max(0, G.left);
    $("#tb").style.transform = `scaleX(${Math.max(0, G.left / SUN_LEN)})`;
    const low = G.left <= 5 && G.left > 0;
    $(".tbar").classList.toggle("low", low); $("#tm").classList.toggle("low", low);
    if(G.left <= 0) done();
  }, 1000);
  $("#quit").onclick = done;
  function done(){
    const d = G ? G.done : 0, used = SUN_LEN - (G ? G.left : 0);
    const score = d * 5;
    const earned = scored ? Math.min(RULES.gameMax, score) : 0;
    gameFinish(gm, { score, scored, earned, detail:`涂好 ${d} / 6 处 · 用时 ${used} 秒` });
  }
}

ROUTES.drama = { view(){

      <p class="sm" style="margin-top:10px;text-align:center">第 1–${FREE_EPS} 集免费 · 第 ${FREE_EPS + 1} 集起每集 ${PRICE.ep} 积分，解锁后永久可看</p>

      <section class="sec" data-od-id="show-eps">

/* 每集视频上方的亮色分享横幅 + 看完后的弹窗，都走同一个 shareSheet */
const shareBanner = () => `<div class="shbar gframe" data-od-id="share-banner">

function epEndSheet(d, n){
  if(sheetOpen) return;
  const next = n < 6 ? n + 1 : null;
  const sh = sheet({

        <div class="row"><span class="gold" style="width:18px">${ico("i-heart")}</span>
          <div class="row-m"><div class="row-t">看完这一集</div>
            <div class="row-s">亲密 +${XPR.drama}，已记入进度</div></div></div>
      </div>`,
    foot:`<button class="btn btn-gold btn-w claim" id="epShare">${ico("i-share")}分享给好友</button>
      ${next
        ? `<button class="btn btn-qt btn-w" id="epNext">${epOpen(d, next) ? ico("i-play") + "下一集" : ico("i-lock") + `解锁第 ${next} 集`}</button>`
        : `<button class="btn btn-qt btn-w" onclick="closeSheet()">${ico("i-check")}全剧看完了</button>`}`
  });
  sh.querySelector("#epShare").onclick = () => { closeSheet(); setTimeout(() => shareSheet(d, n), 220); };
  const nx = sh.querySelector("#epNext");
  if(nx) nx.onclick = () => { closeSheet(); setTimeout(() => openEp(d, next), 200); };
}

let justUnlocked = null;
const epOpen = (d, n) => n <= FREE_EPS || (S.eps[d.id] || []).includes(n);
const epsOpenCount = d => d.eps.filter((_, i) => epOpen(d, i + 1)).length;
function openEp(d, n, el){
  const un = S.eps[d.id] || (S.eps[d.id] = []);
  if(epOpen(d, n)) return nav(`#play/${d.id}/${n}`);
  if(el && S.pts < PRICE.ep) pulseOnce(el, "shake", 460);
  buy({ cost:PRICE.ep, title:"一集AI短剧", sub:`${d.title} · 第 ${n} 集 ${d.eps[n - 1]}`, fromEl:el,
    cond:["解锁后永久可看，不重复扣分","仅解锁本集"],
    done(){ un.push(n); un.sort((a, b) => a - b); justUnlocked = `${d.id}-${n}`; },
    then(){ const h = `#play/${d.id}/${n}`; if(location.hash === h) render(); else nav(h); } });
}

ROUTES.play = { view(id, epStr){
  const d = drama(id), n = Math.min(6, Math.max(1, +epStr || 1));
  if(!epOpen(d, n)) return { ...ROUTES.show.view(id), after(root){ ROUTES.show.view(id).after(root); setTimeout(() => openEp(d, n), 260); } };
  // 记录进度
  S.last[d.id] = Math.max(S.last[d.id] || 0, n);
  S.watched = [{ d:d.id, e:n, t:Date.now() }, ...S.watched.filter(w => !(w.d === d.id && w.e === n))].slice(0, 20);
  S.tasks.drama = true; save();
  const prev = n > 1 ? n - 1 : null, next = n < 6 ? n + 1 : null;
  return {
    tab:"drama", flush:true, noTabs:true,
    bar:barBack(`${d.title} · 第 ${n} 集`, esc(d.eps[n - 1]), `<button class="topshare" data-share="1" aria-label="分享给好友，好友观看 +20 积分">${ico("i-share")}分享<em>+20</em></button>`),
    html:`
    <div style="padding:12px 14px 0">${shareBanner()}</div>
    <div class="player ph" style="--pos:50% 50%" data-initial="${esc(d.initial)}" data-od-id="player-${d.id}-${n}">
      <video src="${d.video}" poster="${d.poster}" data-alt="${esc(d.title)}" controls autoplay muted playsinline
        preload="metadata" onerror="vidFail(this)"></video>
      <button class="unmute" id="unmute" data-od-id="player-unmute">${ico("i-mute")}点击开声音</button>
      <i class="pprog"><b id="pbar"></b></i>
    </div>
    <div style="padding:16px 18px 0">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="row-m"><div class="h3">第 ${n} 集 · ${esc(d.eps[n - 1])}</div>
          <div class="row-s">${esc(d.tag)} · 演示中各集复用同一段样片</div></div>
        ${S.epXp.includes(d.id + "-" + n)
          ? `<span class="pill ok">${ico("i-check")}已看完</span>`
          : `<button class="tbtn" id="epDone">标记看完 · +${XPR.drama} 亲密</button>`}
      </div>
      <div style="display:flex;gap:9px;margin-top:16px">
        ${prev ? `<button class="btn btn-gh" style="flex:1" data-go="${prev}">${ico("i-back")}第 ${prev} 集</button>` : ""}
        ${next
          ? `<button class="btn btn-pri" style="flex:1.4" data-go="${next}" data-od-id="player-next">
               ${epOpen(d, next) ? ico("i-play") + "下一集" : ico("i-lock") + `解锁第 ${next} 集`}</button>`
          : `<button class="btn btn-pri" style="flex:1.4" id="epFin" data-od-id="player-fin">${ico("i-check")}看完了</button>`}
      </div>
      <section class="sec">
        <div class="sec-h"><h2 class="h2">剧集</h2><a class="tbtn" href="#show/${d.id}">剧集详情</a></div>
        <div class="epgrid">
          ${d.eps.map((t, i) => {
            const k = i + 1, ok = epOpen(d, k);
            return `<button class="ep ${k === n ? "on" : ""}" data-go="${k}">
              <span style="display:flex;align-items:center;gap:5px">${ok ? (k === n ? ico("i-pause") : ico("i-play")) : ico("i-lock")}第 ${k} 集</span>
              <em>${ok ? esc(t) : PRICE.ep + " 积分"}</em></button>`;
          }).join("")}
        </div>
      </section>
    </div>`,
    after(root){
      $$("[data-go]", root).forEach(b => b.onclick = () => openEp(d, +b.dataset.go, b));
      $$("[data-share]", root).forEach(b => b.onclick = () => shareSheet(d, n));
      $$("#bar [data-share]").forEach(b => b.onclick = () => shareSheet(d, n));
      const key = `${d.id}-${n}`;
      const credit = () => {
        if(S.epXp.includes(key)) return;
        S.epXp.push(key); save();
        reward(`看完《${d.title}》第 ${n} 集`, 0, XPR.drama);
        const b = $("#epDone", root);
        if(b) b.outerHTML = `<span class="pill ok">${ico("i-check")}已看完</span>`;
      };
      const done = $("#epDone", root); if(done) done.onclick = credit;
      const fin = $("#epFin", root); if(fin) fin.onclick = () => { credit(); epEndSheet(d, n); };
      if(!next){
        const b = root.querySelector('[data-od-id="player-fin"]');
        if(b) b.classList.add("claim");
      }
      const player = root.querySelector(".player"), pbar = $("#pbar", root);
      if(justUnlocked === key && player){
        justUnlocked = null;
        pulseOnce(player, "shimmer", 1150);
      }
      const v = root.querySelector("video"), um = $("#unmute", root);
      if(v){
        v.addEventListener("timeupdate", () => {
          if(pbar && v.duration) pbar.style.transform = `scaleX(${(v.currentTime / v.duration).toFixed(4)})`;
        });
        v.addEventListener("ended", () => { credit(); epEndSheet(d, n); });
        v.addEventListener("timeupdate", () => {
          if(v.duration && v.currentTime / v.duration > 0.95) credit();
        });
        v.addEventListener("error", () => um && um.remove());
        um.onclick = () => {
          v.muted = !v.muted;
          um.innerHTML = (v.muted ? ico("i-mute") + "点击开声音" : ico("i-sound") + "静音");
          if(!v.muted) v.play().catch(() => {});
        };
      } else if(um) um.remove();
    }
  };
}};

function shareSheet(d, n){
  const code = (d.id + "-" + (S.nick || "demo")).split("").reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 99991, 7).toString(36).toUpperCase();
  // demo: share the demo itself so the recipient lands on this drama
  const link = `${location.origin}${location.pathname}?s=${code}#show/${d.id}`;
  const txt = `${d.title}${n ? " 第 " + n + " 集" : ""} · MBA66 AI 剧集`;
  const sh = sheet({
    title:"分享给朋友", sub:`${d.title}${n ? " · 第 " + n + " 集" : ""}`,
    body:`<div class="shrow" data-od-id="share-targets">
        <button class="shbtn sh-wa" data-sh="wa" data-od-id="share-whatsapp">
          <i><svg viewBox="0 0 24 24"><path d="M12 2.6a9.3 9.3 0 0 0-8 14.1L2.6 21.4l4.9-1.3A9.3 9.3 0 1 0 12 2.6zm5.1 13c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .5l-.4.5c-.1.2-.3.3-.1.6.1.3.6 1.1 1.4 1.8 1 .9 1.8 1.1 2 1.2.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.8.9c.5.3.6.4.6.5s0 .8-.1 1.4z"/></svg></i>
          WhatsApp</button>
        <button class="shbtn sh-tg" data-sh="tg" data-od-id="share-telegram">
          <i><svg viewBox="0 0 24 24"><path d="M21.3 4.3 2.9 11.4c-1 .4-1 1 0 1.3l4.6 1.4 1.8 5.4c.2.6.4.8 1 .3l2.5-2.3 4.8 3.5c.9.5 1.4.2 1.6-.8l2.8-13c.2-1.2-.4-1.7-1.7-1.2zM8.9 13.8l9.1-5.7c.4-.3.8-.1.5.2l-7.6 6.9-.3 3z"/></svg></i>
          Telegram</button>
        <button class="shbtn sh-cp" data-sh="cp" data-od-id="share-copy">
          <i><svg viewBox="0 0 24 24"><path d="M10.6 13.4a3.4 3.4 0 0 0 5.1.4l2.6-2.6a3.4 3.4 0 0 0-4.8-4.8l-1.5 1.5 1.4 1.4 1.5-1.5a1.4 1.4 0 0 1 2 2l-2.6 2.6a1.4 1.4 0 0 1-2-.1zm2.8-2.8a3.4 3.4 0 0 0-5.1-.4l-2.6 2.6a3.4 3.4 0 0 0 4.8 4.8l1.5-1.5-1.4-1.4-1.5 1.5a1.4 1.4 0 0 1-2-2l2.6-2.6a1.4 1.4 0 0 1 2 .1z"/></svg></i>
          复制链接</button>
      </div>
      <div class="panel" style="margin-top:14px">
        <div class="lbl">你的专属链接</div>
        <p style="margin-top:8px;font-size:13px;word-break:break-all;color:var(--gold-2);line-height:1.7">${esc(link)}</p>
      </div>
      <div class="panel" style="margin-top:11px;padding:6px 16px">
        <div class="lgrow"><span class="tile">${ico("i-coin")}</span>
          <div class="row-m"><div class="row-t">好友完成有效观看</div>
            <div class="row-s">每天最多 ${RULES.inviteMax} 人 · 分享本身不计分</div></div>
          <b style="font-size:14px;color:var(--gold-2)">+${RULES.invite} 积分</b></div>
        <div class="lgrow"><span class="tile">${ico("i-eye")}</span>
          <div class="row-m"><div class="row-t">今日已计入</div></div>
          <b style="font-size:14px">${S.invited} / ${RULES.inviteMax}</b></div>
      </div>`,
    foot:`<button class="btn btn-qt btn-w" onclick="closeSheet()">关闭</button>`
  });
  const done = msg => { S.tasks.share = true; save(); closeSheet(); toast(msg, "i-share"); };
  $$("[data-sh]", sh).forEach(b => b.onclick = async () => {
    const k = b.dataset.sh;
    if(k === "cp"){
      let ok = false;
      try { await navigator.clipboard.writeText(link); ok = true; }
      catch(e){
        const ta = document.createElement("textarea");
        ta.value = link; ta.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand("copy"); } catch(e2){}
        ta.remove();
      }
      return done(ok ? "链接已复制，发给好友即可" : "请长按上方链接手动复制");
    }
    const url = k === "wa"
      ? `https://wa.me/?text=${encodeURIComponent(txt + " " + link)}`
      : `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(txt)}`;
    try { window.open(url, "_blank", "noopener"); } catch(e){}
    done(k === "wa" ? "已打开 WhatsApp 分享" : "已打开 Telegram 分享");
  });
}
</script>
<script>
"use strict";
/* ============================================================
   奖励兑换
   ============================================================ */
function nextLockedEp(){
  const order = [...DRAMAS].sort((a, b) => (S.last[b.id] || 0) - (S.last[a.id] || 0));
  for(const d of order){
    const un = S.eps[d.id] || [];
    for(let n = 1; n <= 6; n++) if(!un.includes(n)) return { d, n };
  }
  return null;
}

/* 周边核销码：和福利码一样存进兑换记录 */
function redeemMerch(m, fromEl){
  let code = "";
  buy({ cost:m.cost, title:m.t, sub:"MBA66 周边", fromEl,
    cond:["兑换后生成核销码，存入「兑换记录」", "凭核销码到 MBA66 门店领取实物"],
    done(){
      code = newCode();
      S.vouchers = S.vouchers || [];
      S.vouchers.unshift({ id:"merch:" + m.id, name:m.t, code, t:Date.now(), used:false });
      if(S.vouchers.length > 30) S.vouchers.length = 30;
      (S.owned.merch = S.owned.merch || []).push(m.id);
    },
    then(){ setTimeout(() => voucherDone({ title:m.t, sub:"到 MBA66 门店核销", icon:"crown" }, code), 340); } });
}

function unlockedThumbs(){
  const out = [];
  const d = DRAMAS[0];
  (S.eps[d.id] || []).filter(x => x > 2).forEach(ep =>
    out.push({ img:d.poster, ini:d.initial, cap:`${d.title} 第${ep}集`, href:`#play/${d.id}/${ep}` }));
  S.owned.vid.forEach(id => { const x = girl(id);
    out.push({ img:outfitImg(x), ini:x.initial, cap:`${x.name} 问候短片`, href:"#videos" }); });
  GIRLS.forEach(x => ((S.owned.album || {})[x.id] || []).forEach(i =>
    out.push({ img:albumOf(x)[i].img, ini:x.initial, cap:`${x.name} · ${albumOf(x)[i].t}`, href:`#girl/${x.id}` })));
  GIRLS.forEach(x => ((S.owned.tier || {})[x.id] || []).forEach(k =>
    out.push({ img:tierImg(x, k), ini:x.initial, cap:`${x.name} · ${tierOf(k).t}`, href:"#wardrobe" })));
  GIRLS.forEach(x => shotsOf(x.id).forEach(sh =>
    out.push({ img:sh.img, ini:x.initial, cap:`${x.name} · ${sh.t}`, href:`#girl/${x.id}` })));

  S.owned.bg.filter(b => b !== "cafe").forEach(b => { const bg = BGS.find(z => z.id === b);
    out.push({ img:bg.img, ini:bg.initial, cap:`背景 · ${bg.name}`, href:"#wardrobe" }); });
  return out;
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e2){}
    ta.remove();
    return ok;
  }
}

function redeemVoucher(v, fromEl){
  if(v.cost === null) return toast("生日礼敬请期待", "i-gift");
  if(v.once && (S.vouchers || []).some(x => x.id === v.id))
    return toast("新人礼每个账号限兑一次", "i-crown");
  let code = "";
  buy({
    cost:v.cost, title:v.title, sub:v.sub, fromEl,
    cond:["兑换后生成福利码，存入「兑换记录」",
          v.act === "x2" ? "下一局亲密游戏积分 ×2，用后失效" : "福利码可在「兑换记录」里复制"],
    done(){
      code = newCode();
      S.vouchers = S.vouchers || [];
      S.vouchers.unshift({ id:v.id, code, t:Date.now(), used:false });
      if(S.vouchers.length > 30) S.vouchers.length = 30;
      if(v.act === "x2") S.dbl = 1;
    },
    then(){ setTimeout(() => voucherDone(v, code), 340); }
  });
}

  for(let k = 0; k < MLEVELS.length; k++) if(got >= MLEVELS[k].at) i = k;

    pct: nxt ? Math.min(1, (got - MLEVELS[i].at) / (nxt.at - MLEVELS[i].at)) : 1 };

const COACH = [
  { sel:'#tabs a[data-tab="girls"]', t:"先选一位 AI 女友", s:`${GIRLS.length} 位虚拟女友，造型和性格都不一样。随时可以更换，已解锁的内容不会消失。` },
  { sel:'[data-od-id="home-checkin"]', t:"每天打卡攒积分", s:`打卡 +${RULES.checkin}，亲密游戏每局都计分，单局最多 +${RULES.gameMax}，段位越高倍率越高。` },
  { sel:'#tabs a[data-tab="rewards"]', t:"两套数值，各管各的", s:`娱乐积分解锁内容：短剧单集 ${PRICE.ep}、礼物 ${PRICE.gift}、场景 ${PRICE.bg}、造型 ${TIERS[1].price}–${TIERS[4].price}，也能在「我的」兑换会员福利。亲密经验只累积，升到 Lv.4 解锁她的专属故事。` }
];
let coachI = 0;
function startCoach(manual){
  if(location.hash !== "#home" && location.hash !== ""){ nav("#home"); setTimeout(() => startCoach(manual), 380); return; }
  coachI = 0; $("#coach").classList.add("on"); $("#coach").setAttribute("aria-hidden","false");
  drawCoach();
}
function drawCoach(){
  const step = COACH[coachI];
  const el = $(step.sel);
  const host = $("#phone").getBoundingClientRect();
  let ring = "";
  let cardPos = "top:120px";
  if(el){
    const r = el.getBoundingClientRect();
    const t = r.top - host.top, l = r.left - host.left;
    ring = `<div class="ring" style="left:${l - 6}px;top:${t - 6}px;width:${r.width + 12}px;height:${r.height + 12}px"></div>`;
    cardPos = (t > host.height * 0.5) ? `bottom:${host.height - t + 18}px` : `top:${t + r.height + 18}px`;
  }
  $("#coach").innerHTML = `${el ? ring : `<div class="mask"></div>`}
    <div class="cc" style="${cardPos}">
      <div class="lbl">新手引导 · ${coachI + 1} / ${COACH.length}</div>
      <div class="h2" style="margin-top:8px">${esc(step.t)}</div>
      <p class="p" style="margin-top:8px">${esc(step.s)}</p>
      <div class="dots">${COACH.map((_, i) => `<i class="${i === coachI ? "on" : ""}"></i>`).join("")}</div>
      <div style="display:flex;gap:9px;margin-top:16px">
        <button class="btn btn-qt" id="skip" style="flex:1;min-height:42px;font-size:13px">跳过</button>
        <button class="btn btn-pri" id="nextC" style="flex:1.3;min-height:42px;font-size:13px">
          ${coachI === COACH.length - 1 ? (S.coachXp ? "开始体验" : `开始体验 · +${XPR.coach} 亲密`) : "下一步"}</button>
      </div>
    </div>`;
  $("#skip").onclick = () => endCoach(false);
  $("#nextC").onclick = () => { if(coachI === COACH.length - 1) endCoach(true); else { coachI++; drawCoach(); } };
}
function endCoach(finished){
  $("#coach").classList.remove("on"); $("#coach").setAttribute("aria-hidden","true"); $("#coach").innerHTML = "";
  S.coached = true; save();
  if(finished && !S.coachXp){
    S.coachXp = true; save();
    reward("完成新手引导", 0, XPR.coach);   // bumpBonds 已就地刷新进度条，不要再 render
  }
}
